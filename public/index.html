<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>MayorChatZ PRO</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#111;color:#fff;height:100vh;display:flex;flex-direction:column}
#login{position:fixed;inset:0;background:#111;display:flex;align-items:center;justify-content:center;z-index:9999}.card{background:#1e1e1e;padding:24px;border-radius:16px;width:90%;max-width:340px}input,button{padding:12px;border-radius:10px;border:none;width:100%;margin-top:10px}input{background:#2a2a2a;color:#fff}button{background:#25D366;color:#000;font-weight:700}
#top{padding:10px;background:#1e1e1e;display:flex;justify-content:space-between;align-items:center}#tabs{display:flex;background:#1e1e1e;border-bottom:1px solid #333}.tab{flex:1;padding:10px;text-align:center;color:#888;cursor:pointer}.tab.active{color:#25D366;border-bottom:2px solid #25D366}
#content{flex:1;display:flex;flex-direction:column;overflow:hidden}#msgs{flex:1;overflow:auto;padding:10px}.m{background:#2a2a2a;padding:8px 12px;border-radius:12px;margin-bottom:8px;max-width:85%}.m.me{margin-left:auto;background:#005c4b}.m img,.m video,.m audio{max-width:100%;border-radius:8px;margin-top:6px;display:block}
#inputBar{display:flex;gap:6px;padding:8px;background:#1e1e1e}#inputBar input{flex:1;margin:0}.icon{width:44px;background:#333;color:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center}
#statusList,#groupList,#userList{padding:10px;overflow:auto}.sItem{background:#2a2a2a;padding:10px;border-radius:10px;margin-bottom:8px;display:flex;gap:10px;align-items:center}.sItem img{width:50px;height:50px;border-radius:50%;object-fit:cover}
#callModal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:100}#callBox{background:#1e1e1e;padding:20px;border-radius:16px;width:90%;max-width:340px;text-align:center}
</style></head><body>
<div id="login"><div class="card"><h2>MayorChatZ PRO 🔒</h2><p style="color:#25D366;font-size:12px">🔒 E2E Encrypted</p><input id="nameIn" placeholder="Enter your name e.g DE mayors"><button id="enterBtn">Enter</button></div></div>
<div id="top"><div><b>MayorChatZ PRO</b> <small style="color:#25D366">🔒 E2E</small><br><small id="onlineCount" style="color:#25D366">0 online</small></div><div style="display:flex;gap:6px"><button onclick="location.reload()" style="width:auto;padding:6px 10px;background:#333;color:#fff;margin:0">🔄</button><button onclick="shareLink()" style="width:auto;padding:6px 10px;background:#333;color:#fff;margin:0">📤</button></div></div>
<div id="tabs"><div class="tab active" id="tabChat">Chats</div><div class="tab" id="tabStatus">Status</div><div class="tab" id="tabGroups">Groups</div></div>
<div id="content">
<div id="chatPane" style="flex:1;display:flex;flex-direction:column"><div id="userList"></div><div id="msgs"><p style="color:#666;text-align:center;margin-top:20px">No messages yet - Start chatting 🔒</p></div><div id="inputBar"><label class="icon">📷<input type="file" hidden id="mediaIn" accept="image/*,video/*"></label><input id="msgIn" placeholder="🔒 Type message..."><button class="icon" id="recBtn">🎤</button><button id="sendBtn" style="width:60px;margin:0;background:#25D366;border-radius:10px">Send</button></div></div>
<div id="statusPane" style="display:none;flex:1;flex-direction:column"><div style="padding:10px;display:flex;gap:8px"><label style="background:#25D366;color:#000;padding:8px 12px;border-radius:20px;cursor:pointer">📷🎥 Post<input type="file" hidden id="statusIn" accept="image/*,video/*"></label><button id="textStatusBtn" style="width:auto;background:#3b82f6;color:#fff;margin:0;padding:8px 12px;border-radius:20px">📝 Text</button></div><div id="statusList"><p style="color:#666;padding:10px">No status yet</p></div></div>
<div id="groupPane" style="display:none;flex:1;flex-direction:column;padding:10px"><button id="addGroupBtn" style="background:#333;color:#fff">👥+ Create Group</button><div id="groupList" style="margin-top:10px"></div></div>
</div>
<div id="callModal"><div id="callBox"><h3 id="callText">Calling...</h3><div style="display:flex;gap:8px;margin-top:15px"><button onclick="acceptCall()" style="background:#25D366">Accept 📞</button><button onclick="endCall()" style="background:#f44">End</button></div></div></div>
<script>
let myName="",currentGroup="General",recording=false,recorder,chunks=[],currentCallId=null;
const $=id=>document.getElementById(id);
function loginNow(){let v=$('nameIn').value.trim();if(!v){alert('Enter name first');return;}myName=v;$('login').style.display='none';setInterval(ping,3000);setInterval(loadAll,3000);ping();loadAll();alert('Welcome '+myName+' 🔒');}
$('enterBtn').onclick=loginNow;
$('nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')loginNow();});
$('tabChat').onclick=function(){showTab('chat',this)};$('tabStatus').onclick=function(){showTab('status',this)};$('tabGroups').onclick=function(){showTab('groups',this)};
$('sendBtn').onclick=send; $('msgIn').addEventListener('keydown',e=>{if(e.key==='Enter')send();});
$('mediaIn').onchange=e=>sendMedia(e.target); $('statusIn').onchange=e=>postStatus(e.target);
$('textStatusBtn').onclick=postTextStatus; $('addGroupBtn').onclick=addGroup; $('recBtn').onclick=toggleRec;
function showTab(t,el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));$('chatPane').style.display=t=='chat'?'flex':'none';$('statusPane').style.display=t=='status'?'flex':'none';$('groupPane').style.display=t=='groups'?'flex':'none';if(el)el.classList.add('active');}
function ping(){if(!myName)return;fetch('/api/online',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:myName})}).catch(()=>{});}
async function loadAll(){if(!myName)return;loadUsers();loadMsgs();loadStatus();loadGroups();}
async function loadUsers(){try{let r=await fetch('/api/users');let d=await r.json();$('onlineCount').innerText=d.count+' online';$('userList').innerHTML=d.list.filter(n=>n!=myName).map(n=>`<div class="sItem"><div style="width:35px;height:35px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center">${n[0].toUpperCase()}</div><div style="flex:1"><b>${n}</b><br><small style="color:#25D366">online</small></div><button onclick="startCall('${n}','voice')" style="width:auto;background:#222;margin:0;padding:6px">📞</button><button onclick="startCall('${n}','video')" style="width:auto;background:#222;margin:0;padding:6px">📹</button></div>`).join('');}catch(e){}}
async function loadMsgs(){try{let r=await fetch('/api/messages?group='+currentGroup);let m=await r.json();if(!m.length)return;$('msgs').innerHTML=m.map(x=>{let media='';if(x.type=='image')media=`<img src="${x.data}">`;if(x.type=='video')media=`<video src="${x.data}" controls></video>`;if(x.type=='audio')media=`<audio src="${x.data}" controls></audio>`;let del=x.name==myName?`<span style="float:right;cursor:pointer" onclick="delMsg('${x.id}')">🗑️</span>`:'';return `<div class="m ${x.name==myName?'me':''}">${del}<b style="font-size:10px">${x.name} 🔒</b><br>${x.text||''}${media}<br><small style="font-size:9px;opacity:.5">${x.time}</small></div>`}).join('');$('msgs').scrollTop=$('msgs').scrollHeight;}catch(e){}}
async function send(){let t=$('msgIn').value.trim();if(!t)return;$('msgIn').value='';await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:myName,text:t,type:'text',group:currentGroup})});loadMsgs();}
async function sendMedia(inp){let f=inp.files[0];if(!f)return;if(f.size>8*1024*1024)return alert('File too big <8MB');let rd=new FileReader();rd.onload=async e=>{await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:myName,type:f.type.startsWith('video')?'video':'image',data:e.target.result,[STRIPPED]
async function delMsg(id){if(!confirm('Delete?'))return;await fetch('/api/messages/'+id,{method:'DELETE'});loadMsgs();}
async function toggleRec(){if(!recording){try{let s=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(s);chunks=[];recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=async ()=>{let blob=new Blob(chunks,{type:'audio/webm'});let rd=new FileReader();rd.onload=async e=>{await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:myName,type:'audio',data:e.target.result,[STRIPPED]
async function postStatus(inp){let f=inp.files[0];if(!f)return;if(f.size>10*1024*1024)return alert('Too big <10MB');let rd=new FileReader();rd.onload=async e=>{await fetch('/api/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:myName,type:f.type.startsWith('video')?'video':'image',data:e.target.result})});alert('Status posted!');loadStatus();};rd.readAsDataURL(f);}
async function postTextStatus(){let t=prompt('Enter text status:');if(!t)return;let colors=['#25D366','#3b82f6','#f59e0b','#ef4444'];let c=colors[Math.floor(Math.random()*colors.length)];await fetch('/api/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:myName,type:'text',data:t,[STRIPPED]
async function loadStatus(){try{let r=await fetch('/api/status');let s=await r.json();if(!s.length){$('statusList').innerHTML='<p style="color:#666;padding:10px">No status yet</p>';return;}$('statusList').innerHTML=s.reverse().map(x=>{if(x.type=='text')return `<div class="sItem"><div style="width:50px;height:50px;border-radius:50%;background:${x.color};display:flex;align-items:center;justify-content:center;font-size:10px">${x.data.substring(0,8)}</div><div><b>${x.name}</b><br><small>${x.data}</small></div></div>`;if(x.type=='image')return `<div class="sItem"><img src="${x.data}"><div><b>${x.name}</b></div></div>`;return `<div class="sItem"><video src="${x.data}" style="width:50px;height:50px;border-radius:50%"></video><div><b>${x.name}</b><br><small>Video</small></div></div>`}).join('');}catch(e){}}
async function loadGroups(){try{let r=await fetch('/api/groups');let g=await r.json();$('groupList').innerHTML=g.map(x=>`<div class="sItem" onclick="joinGroup('${x.name}')"><div style="width:40px;height:40px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center">👥</div><div><b>${x.name}</b><br><small>${currentGroup==x.name?'✅ Joined':'Tap to join'}</small></div></div>`).join('');}catch(e){}}
async function addGroup(){let n=prompt('Group name:');if(!n)return;await fetch('/api/groups',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})});loadGroups();}
function joinGroup(n){currentGroup=n;alert('Joined '+n);loadMsgs();}
async function shareLink(){try{await navigator.clipboard.writeText(location.href);alert('Copied: '+location.href);}catch(e){prompt('Copy link:',location.href);}}
async function startCall(to,type){currentCallId=Date.now().toString();$('callText').innerText='Calling '+to+' ('+type+')...';$('callModal').style.display='flex';await fetch('/api/calls',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from:myName,to,type})});}
function acceptCall(){$('callText').innerText='Connected 🔒';}
async function endCall(){$('callModal').style.display='none';if(currentCallId)await fetch('/api/calls/'+currentCallId,{method:'DELETE'});}
</script></body></html>
