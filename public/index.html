<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MayorChatZ</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a9c7a">
<script src="/socket.io/socket.io.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#0f1a1e;color:#fff;height:100vh;display:flex;flex-direction:column}
header{background:#1a2c33;padding:12px;display:flex;justify-content:space-between;align-items:center}
.tabs{display:flex;background:#1a2c33}
.tabs div{flex:1;text-align:center;padding:12px;cursor:pointer;border-bottom:3px solid transparent}
.tabs div.active{border-bottom:3px solid #0a9c7a;color:#0a9c7a}
.page{display:none;flex:1;overflow:auto;padding:10px}
.page.active{display:flex;flex-direction:column}
#chatBox{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px}
.msg{max-width:75%;padding:8px 10px;border-radius:8px;position:relative}
.me{background:#0a9c7a;align-self:flex-end}
.other{background:#1f3a44;align-self:flex-start}
.meta{font-size:11px;opacity:0.7;margin-bottom:3px}
.inputBar{display:flex;gap:6px;padding:8px;background:#1a2c33;align-items:center}
.inputBar input{flex:1;padding:10px;border-radius:20px;border:none;outline:none}
.inputBar button{padding:10px 14px;border:none;border-radius:50%;background:#0a9c7a;color:#fff;cursor:pointer}
img.chat-img{max-width:200px;border-radius:8px;margin-top:4px}
video.chat-vid{max-width:200px;border-radius:8px;margin-top:4px}
audio{width:200px;margin-top:4px}
.statusItem{display:flex;align-items:center;gap:10px;padding:8px;background:#1f3a44;margin-bottom:6px;border-radius:8px}
.sCircle{width:45px;height:45px;border-radius:50%;border:2px solid #0a9c7a;display:flex;align-items:center;justify-content:center;font-weight:bold}
</style>
</head>
<body>
<header>
<div>MayorChatZ</div>
<div style="display:flex;gap:10px"><div onclick="copyLink()">🔗</div><div id="online">● 0</div></div>
</header>

<div class="tabs">
<div id="tab-chats" class="active" onclick="showPage('chats')">💬 Chats</div>
<div id="tab-status" onclick="showPage('status')">📸 Status</div>
<div id="tab-groups" onclick="showPage('groups')">👥 Groups</div>
</div>

<div id="page-chats" class="page active">
<div id="onlineStatus" style="font-size:12px;opacity:0.7"></div>
<div id="typing" style="display:none;color:#0a9c7a;font-style:italic;margin:4px 0;font-size:13px"></div>
<div id="chatBox"></div>
<div class="inputBar">
<button onclick="document.getElementById('fileInput').click()">📎</button>
<button id="micBtn" onclick="toggleVoice()">🎤</button>
<input type="file" id="fileInput" hidden accept="image/*,video/*">
<input id="msgInput" placeholder="Type a message...">
<button onclick="sendMsg()">➤</button>
</div>
</div>

<div id="page-status" class="page">
<div class="inputBar">
<input id="statusInput" placeholder="Write status...">
<button onclick="postStatus()">Post</button>
<button onclick="document.getElementById('statusFile').click()">📎</button>
<input type="file" id="statusFile" hidden accept="image/*,video/*">
</div>
<div id="statusBox"></div>
</div>

<div id="page-groups" class="page">
<div class="inputBar">
<input id="groupInput" placeholder="New group name">
<button onclick="createGroup()">Create</button>
</div>
<div id="groupBox"></div>
</div>

<script>
const socket=io();
let myName=localStorage.getItem('mc_name')||prompt('Your name:')||'Anon';
localStorage.setItem('mc_name',myName);
socket.emit('setName',myName);

if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js');}

function showPage(p){
document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));
document.querySelectorAll('.tabs div').forEach(e=>e.classList.remove('active'));
document.getElementById('page-'+p).classList.add('active');
document.getElementById('tab-'+p).classList.add('active');
}

const chatBox=document.getElementById('chatBox');
const msgInput=document.getElementById('msgInput');
let typingTimeout;
msgInput.addEventListener('input',()=>{
  socket.emit('typing',myName);
  clearTimeout(typingTimeout);
  typingTimeout=setTimeout(()=>socket.emit('stopTyping'),1500);
});
socket.on('typing',(name)=>{
  const t=document.getElementById('typing');
  t.innerText=name+' is typing...'; t.style.display='block';
});
socket.on('stopTyping',()=>{document.getElementById('typing').style.display='none';});

function addMsg(m){
  const d=document.createElement('div');
  d.className='msg '+(m.name===myName?'me':'other');
  d.id='m-'+m.mid;
  let content=`<div class="meta">${m.name} • ${m.time}</div>`;
  if(m.type==='image') content+=`<img class="chat-img" src="${m.data}">`;
  else if(m.type==='video') content+=`<video class="chat-vid" controls src="${m.data}"></video>`;
  else if(m.type==='voice') content+=`<audio controls src="${m.data}"></audio>`;
  content+=`<div>${m.text||''}</div>`;
  if(m.name===myName) content+=`<div style="font-size:11px;text-align:right;cursor:pointer" onclick="delMsg('${m.mid}')">🗑️</div>`;
  d.innerHTML=content;
  chatBox.appendChild(d);
  chatBox.scrollTop=chatBox.scrollHeight;
  document.getElementById('typing').style.display='none';
}

function sendMsg(){
  const txt=msgInput.value.trim();
  if(!txt) return;
  const m={mid:Date.now(),name:myName,text:txt,time:new Date().toLocaleTimeString(),type:'text'};
  socket.emit('message',m);
  msgInput.value='';
  socket.emit('stopTyping');
}

const fileInput=document.getElementById('fileInput');
fileInput.onchange=()=>{
  const file=fileInput.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    const type=file.type.startsWith('image')?'image':'video';
    const m={mid:Date.now(),name:myName,text:'',time:new Date().toLocaleTimeString(),type:type,data:e.target.result};
    socket.emit('message',m);
  };
  reader.readAsDataURL(file);
};

// Voice
let recorder,chunks=[],isRec=false;
async function toggleVoice(){
  const btn=document.getElementById('micBtn');
  if(!isRec){
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    recorder=new MediaRecorder(stream);
    chunks=[];
    recorder.ondataavailable=e=>chunks.push(e.data);
    recorder.onstop=()=>{
      const blob=new Blob(chunks,{type:'audio/webm'});
      const reader=new FileReader();
      reader.onload=e=>{
        const m={mid:Date.now(),name:myName,text:'🎤 Voice',time:new Date().toLocaleTimeString(),type:'voice',data:e.target.result};
        socket.emit('message',m);
      };
      reader.readAsDataURL(blob);
    };
    recorder.start();
    isRec=true;
    btn.innerText='⏹️';
    btn.style.background='red';
  }else{
    recorder.stop();
    isRec=false;
    btn.innerText='🎤';
    btn.style.background='#0a9c7a';
  }
}

function delMsg(id){socket.emit('deleteMsg',id);}

socket.on('message',addMsg);
socket.on('history',arr=>{chatBox.innerHTML='';arr.forEach(addMsg);});
socket.on('deleteMsg',id=>{const el=document.getElementById('m-'+id); if(el) el.remove();});
socket.on('online',n=>{document.getElementById('online').innerText='● '+n;});

// Status
function postStatus(){
  const txt=document.getElementById('statusInput').value.trim();
  if(!txt && !window.statusData) return;
  const st={id:Date.now(),name:myName,text:txt,time:new Date().toLocaleTimeString(),data:window.statusData||null,type:window.statusType||'text'};
  socket.emit('postStatus',st);
  document.getElementById('statusInput').value=''; window.statusData=null;
}
document.getElementById('statusFile').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{window.statusData=ev.target.result; window.statusType=f.type.startsWith('image')?'image':'video'; alert('File ready, tap Post');};
  r.readAsDataURL(f);
};
function addStatus(s){
  const box=document.getElementById('statusBox');
  const d=document.createElement('div');
  d.className='statusItem';
  let media='';
  if(s.type==='image') media=`<img style="width:100%;border-radius:8px;margin-top:4px" src="${s.data}">`;
  if(s.type==='video') media=`<video style="width:100%;border-radius:8px" controls src="${s.data}"></video>`;
  d.innerHTML=`<div class="sCircle">${s.name[0]}</div><div><b>${s.name}</b><br><small>${s.time}</small><div>${s.text}</div>${media}</div>`;
  box.prepend(d);
}
socket.on('newStatus',addStatus);
socket.on('statusHistory',arr=>{document.getElementById('statusBox').innerHTML='';arr.forEach(addStatus);});

// Groups
function createGroup(){
  const n=document.getElementById('groupInput').value.trim();
  if(!n) return;
  socket.emit('createGroup',n);
  document.getElementById('groupInput').value='';
}
socket.on('groups',arr=>{
  const b=document.getElementById('groupBox');
  b.innerHTML='';
  arr.forEach(g=>{
    const d=document.createElement('div');
    d.className='statusItem';
    d.innerHTML=`<div class="sCircle">👥</div><div>${g.name}</div>`;
    b.appendChild(d);
  });
});

function copyLink(){navigator.clipboard.writeText(location.href); alert('Link copied!');}
document.getElementById('msgInput').addEventListener('keydown',e=>{if(e.key==='Enter') sendMsg();});
</script>
</body>
 </html>
