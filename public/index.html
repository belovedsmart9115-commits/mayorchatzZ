<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>MayorChatZ</title><script src="/socket.io/socket.io.js"></script><style>body{background:#0f1a1e;color:#fff;font-family:sans-serif;margin:0;padding:10px}button{background:#0a9c7a;color:#fff;border:0;padding:8px 12px;border-radius:8px;margin:2px}div{background:#1d2b31;padding:8px;margin:8px 0;border-radius:10px}img,video{max-width:100%;border-radius:10px;margin-top:5px}</style></head><body>
<div><button>💬 Chats</button> <button>📸 Status</button> <button>👥 Groups</button> <button>🔗 Copy</button></div>
<div id="ol">1 online</div>
<div style="color:#0f9">🔒 MayorChatZ Secure</div>
<div id="sList"></div>
<input id="t" placeholder="Post text status..." style="width:100%;padding:12px;border-radius:8px;border:0;margin-top:10px">
<input type="file" id="f" accept="image/*,video/*" style="display:none" onchange="postF(this)">
<button onclick="document.getElementById('f').click()">📷 Photo/Video Status</button>
<button onclick="postT()" style="background:#0a9c7a;padding:12px;border-radius:8px;border:0;color:#fff">Post Status</button>
<script>
const socket=io();
const myName=localStorage.username||'DE mayors';
socket.on('connect',()=>socket.emit('setName',myName));
socket.on('online',n=>document.getElementById('ol').innerText=n+' online');
socket.on('statusHistory',a=>a.forEach(show));
socket.on('newStatus',show);
function postT(){const v=document.getElementById('t').value;if(!v)return;socket.emit('postStatus',{id:Date.now(),name:myName,text:v,media:null,time:new Date().toLocaleTimeString()});document.getElementById('t').value=''}
function postF(inp){const file=inp.files[0];if(!file)return;if(file.size>10485760){alert('Too big! Use 10 sec video');return}const r=new FileReader();r.onload=e=>{socket.emit('postStatus',{id:Date.now(),name:myName,text:document.getElementById('t').value||'God bless you all',media:e.target.result,isVideo:file.type.startsWith('video'),time:new Date().toLocaleTimeString()});document.getElementById('t').value=''};r.readAsDataURL(file)}
function show(st){const l=document.getElementById('sList');const d=document.createElement('div');d.innerHTML=`<b>${st.name}</b><br>${st.text||''}<br>${st.media?(st.isVideo?`<video src="${st.media}" controls playsinline></video>`:`<img src="${st.media}">`):''}<br><small>${st.time||''}</small>`;l.prepend(d)}
</script></body></html>
