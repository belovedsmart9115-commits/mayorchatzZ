<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>MayorChatZ</title>
<meta name="theme-color" content="#ff2e88">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.png" type="image/png">
<link rel="apple-touch-icon" href="/icon.png">
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial}
body{background:linear-gradient(135deg,#2a0a4a,#ff2e88);height:100dvh;overflow:hidden;color:#fff}
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;background:linear-gradient(135deg,#2a0a4a,#ff2e88);padding:16px}
.login-box{background:#fff;color:#2a0a4a;padding:28px;border-radius:24px;width:100%;max-width:380px;text-align:center}
.login-box h1{font-size:36px;background:linear-gradient(90deg,#ff2e88,#4b0f7a);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-box input{width:100%;padding:14px;border:2px solid #ff2e88;border-radius:14px;outline:none;font-size:16px;margin-top:14px}
.login-box button{width:100%;margin-top:14px;padding:14px;border:none;border-radius:14px;background:linear-gradient(90deg,#ff2e88,#4b0f7a);color:#fff;font-size:17px;font-weight:700}
#app{display:none;height:100dvh;flex-direction:column}
header{background:#2a0a4a;padding:10px 12px;display:flex;align-items:center;gap:10px;border-bottom:3px solid #ff2e88;flex-shrink:0}
header h2{font-size:20px;line-height:1.1}header h2 span{color:#ff6fb0}
#online{font-size:12px;color:#a7f3d0}
.top-btns{margin-left:auto;display:flex;gap:6px}
.top-btns button{border:none;padding:9px 11px;border-radius:20px;cursor:pointer;font-weight:700;font-size:13px}
.btn-pink{background:#ff2e88;color:#fff}.btn-dark{background:#111;color:#fff}
#tabs{display:flex;background:#1e0733;flex-shrink:0}
#tabs button{flex:1;padding:12px;border:none;background:transparent;color:#bbb;font-weight:700;cursor:pointer}
#tabs button.active{background:#ff2e88;color:#fff}
#main{flex:1;display:flex;overflow:hidden;min-height:0}
#sidebar{width:320px;background:#fff;color:#222;overflow-y:auto;flex-shrink:0}
.chat-item{padding:13px;display:flex;gap:11px;align-items:center;cursor:pointer;border-bottom:1px solid #eee}
.chat-item.active{background:#ffe0ee}
.avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#ff2e88,#4b0f7a);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex-shrink:0}
#chatArea{flex:1;display:flex;flex-direction:column;background:#f5e6ff;min-width:0}
#chatHeader{background:#fff;color:#222;padding:10px;display:flex;align-items:center;gap:10px;border-bottom:2px solid #ff2e88;flex-shrink:0}
#messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:10px 12px;border-radius:16px;font-size:15px;line-height:1.4;box-shadow:0 2px 8px rgba(0,0,0,.1);word-break:break-word}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,#ff2e88,#ff6fb0);color:#fff;border-bottom-right-radius:4px}
.msg.other{align-self:flex-start;background:#fff;color:#222;border-bottom-left-radius:4px}
.msg.assistant{align-self:flex-start;background:#2a0a4a;color:#fff;border:2px solid #ff2e88}
.msg b{display:block;font-size:12px;margin-bottom:3px;color:#ff2e88}.msg.me b{color:#ffe0ee}.msg.assistant b{color:#ff6fb0}
.msg img,.msg video{max-width:100%;border-radius:10px;margin-top:6px}
.msg audio{max-width:100%;margin-top:6px}
#typing{padding:2px 14px;font-size:12px;color:#4b0f7a;height:16px}
#inputBar{display:flex;gap:8px;padding:10px;background:#fff;align-items:center;flex-shrink:0;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
#inputBar input[type=text]{flex:1;padding:12px;border:2px solid #e5b8ff;border-radius:25px;outline:none;font-size:16px;min-width:0}
#inputBar button{border:none;width:44px;height:44px;border-radius:50%;cursor:pointer;font-size:18px;flex-shrink:0}
#sendBtn{background:linear-gradient(135deg,#ff2e88,#4b0f7a);color:#fff}
#statusPanel{display:none;flex:1;overflow-y:auto;background:#fff;color:#222;padding:14px}
.status-card{background:linear-gradient(135deg,#ffe0ee,#e9d5ff);padding:12px;border-radius:16px;margin-bottom:12px;border-left:5px solid #ff2e88;position:relative}
.status-card img{width:100%;border-radius:12px;margin-top:8px;height:auto;display:block}
.status-card video{width:100%;height:auto;max-height:none;object-fit:contain;background:#000;border-radius:12px;margin-top:8px;display:block}
#statusForm{background:#fff3f8;border:2px dashed #ff2e88;border-radius:16px;padding:12px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px}
#statusForm input[type=text]{padding:11px;border:2px solid #ff2e88;border-radius:12px;outline:none;font-size:15px}
.status-row{display:flex;gap:8px}
.status-row label{flex:1;text-align:center;background:#2a0a4a;color:#fff;padding:10px;border-radius:12px;cursor:pointer;font-size:13px;font-weight:700}
.status-row button{flex:1;background:#ff2e88;color:#fff;border:none;border-radius:12px;font-weight:700;cursor:pointer}
#preview img{width:100%;border-radius:12px;height:auto}
#preview video{width:100%;height:auto;object-fit:contain;background:#000;border-radius:12px}
.del-btn{position:absolute;top:8px;right:8px;border:none;background:#ff2e88;color:#fff;border-radius:50%;width:28px;height:28px;cursor:pointer}
body.dark #chatArea{background:#1a0a2e}body.dark #sidebar{background:#220b3d;color:#fff}body.dark #chatHeader{background:#220b3d;color:#fff}body.dark #inputBar{background:#220b3d}body.dark #statusPanel{background:#220b3d;color:#fff}
@media(max-width:700px){#sidebar{width:100%;display:block}#chatArea{display:none;width:100%}body.in-chat #sidebar{display:none}body.in-chat #chatArea{display:flex}body.in-status #sidebar{display:none}body.in-status #chatArea{display:none}body.in-status #statusPanel{display:block}}
</style>
</head>
<body>
<div id="login"><div class="login-box"><h1>MayorChatZ 💖</h1><p>Hot Pink x Dark Purple Chat</p><input id="nameInput" placeholder="Enter your name..."><button onclick="joinChat()">Enter Chat 🚀</button></div></div>
<div id="app">
<header><div><h2>MayorChatZ <span>💖</span></h2><div id="online">● 1 online</div></div><div class="top-btns"><button class="btn-pink" onclick="showTab('chats')">💬 Chats</button><button class="btn-pink" onclick="showTab('status')">📸 Status</button><button class="btn-dark" onclick="toggleDark()">🌙</button></div></header>
<div id="tabs"><button id="tabChats" class="active" onclick="showTab('chats')">Chats</button><button id="tabStatus" onclick="showTab('status')">Status</button></div>
<div id="main">
<div id="sidebar"></div>
<div id="chatArea">
<div id="chatHeader"><button onclick="backToList()" style="border:none;background:#ff2e88;color:#fff;padding:8px 12px;border-radius:10px;font-weight:700">← Back</button><div class="avatar" id="chatAvatar">M</div><div style="min-width:0"><b id="chatName">MayorChatZ Assistant</b><div style="font-size:12px;color:#22c55e" id="chatSub">Tap to chat • Online</div></div></div>
<div id="messages"></div><div id="typing"></div>
<div id="inputBar"><label style="cursor:pointer;font-size:22px">📎<input type="file" id="fileInput" hidden accept="image/*,video/*,audio/*" onchange="uploadFile(this)"></label><button onclick="startVoice()">🎤</button><input id="msgInput" type="text" placeholder="Type a message..." enterkeyhint="send" onkeypress="if(event.key==='Enter')sendMsg()"><button id="sendBtn" onclick="sendMsg()">➤</button></div>
</div>
<div id="statusPanel">
<h3>📸 Status</h3><p style="font-size:13px;color:#666;margin:6px 0">Post text, photo or video - everybody go see am!</p>
<div id="statusForm"><input id="statusInput" type="text" placeholder="What's happening?"><div id="preview"></div><div class="status-row"><label>📷 Photo / 🎥 Video <input type="file" id="statusFile" hidden accept="image/*,video/*" onchange="previewStatus(this)"></label><button id="postBtn" onclick="postStatus()">Post +</button></div><small id="statusHint" style="color:#888"></small></div>
<div id="statusList"></div>
</div>
</div>
</div>
<script>
const socket=io();
let myName='', currentChat='MayorChatZ Assistant', users=[], statuses=JSON.parse(localStorage.getItem('mayor_status')||'[]'), pendingFile=null;
function joinChat(){let n=document.getElementById('nameInput').value.trim(); if(!n) return alert('Enter your name first'); myName=n; socket.emit('join',n);}
socket.on('joinError',m=>alert(m));
socket.on('joinSuccess',()=>{document.getElementById('login').style.display='none'; document.getElementById('app').style.display='flex'; renderSidebar(); renderStatuses();});
socket.on('onlineUsers',l=>{document.getElementById('online').innerText='● '+l.length+' online'; users=l; renderSidebar();});
socket.on('userList',l=>{users=l; renderSidebar();});
socket.on('typing',d=>{if(d.from!==myName) document.getElementById('typing').innerText=d.from+' is typing...'; setTimeout(()=>document.getElementById('typing').innerText='',2000);});
// FIXED STATUS LOGIC - never overwrite local with empty server list
socket.on('statusList',list=>{
  if(!list ||!list.length){
    // Server empty but phone get status -> send phone status back to server, don't clear
    if(statuses.length){ statuses.forEach(s=>{ if(!s.media ||!s.media.startsWith('data:')) socket.emit('newStatus',s); }); }
    return;
  }
  // Merge server + local, remove duplicates by time+name
  let merged=[...list,...statuses];
  let seen=new Set(); let uniq=[];
  merged.forEach(s=>{ let k=s.time+'|'+s.name; if(!seen.has(k)){ seen.add(k); uniq.push(s); } });
  statuses=uniq.slice(0,100);
  localStorage.setItem('mayor_status',JSON.stringify(statuses));
  renderStatuses();
});
socket.on('statusNew',s=>{
  if(!statuses.find(x=>x.time===s.time && x.name===s.name)){
    statuses.unshift(s); statuses=statuses.slice(0,100);
    localStorage.setItem('mayor_status',JSON.stringify(statuses)); renderStatuses();
  }
});
function renderSidebar(){let html=`<div class="chat-item" onclick="openChat('MayorChatZ Assistant')"><div class="avatar">🤖</div><div><b>MayorChatZ Assistant</b><br><small>Ask anything • Tap to chat</small></div></div><div class="chat-item" onclick="openChat('General Group')"><div class="avatar" style="background:#4b0f7a">👥</div><div><b>General Group</b><br><small>Group Chat • Everyone</small></div></div>`; users.filter(u=>u!==myName && u!=='MayorChatZ Assistant').forEach(u=>{html+=`<div class="chat-item" onclick="openChat('${u}')"><div class="avatar">${u[0].toUpperCase()}</div><div><b>${u}</b><br><small>Tap to chat</small></div></div>`;}); document.getElementById('sidebar').innerHTML=html;}
function openChat(name){currentChat=name; document.getElementById('chatName').innerText=name; document.getElementById('chatAvatar').innerText=name[0]; document.getElementById('messages').innerHTML=''; document.body.classList.add('in-chat'); document.body.classList.remove('in-status'); document.getElementById('tabChats').classList.add('active'); document.getElementById('tabStatus').classList.remove('active'); document.getElementById('statusPanel').style.display='none'; if(name==='General Group') addMsg({from:'MayorChatZ Assistant',text:'Welcome to General Group! 🎉 Everybody fit chat here.',type:'text'}); setTimeout(()=>document.getElementById('msgInput').focus(),100);}
function backToList(){document.body.classList.remove('in-chat');}
function addMsg(m){if(m.to && m.to!=='General Group' && m.to!==myName && m.from!==myName && m.from!=='MayorChatZ Assistant') return; if(currentChat==='General Group' && m.to!=='General Group' && m.from!=='MayorChatZ Assistant' && m.from!==myName) return; if(currentChat!=='General Group' && currentChat!=='MayorChatZ Assistant' && m.from!==currentChat && m.from!==myName) return; let div=document.createElement('div'); let cls=m.from===myName?'me':(m.from==='MayorChatZ Assistant'?'assistant':'other'); let content=m.text||''; if(m.type==='image') content=`<img src="${m.url}">`; if(m.type==='video') content=`<video src="${m.url}" controls playsinline></video>`; if(m.type==='audio') content=`<audio src="${m.url}" controls></audio>`; div.className='msg '+cls; div.innerHTML=`<b>${m.from}</b>${content}`; document.getElementById('messages').appendChild(div); document.getElementById('messages').scrollTop=1e9;}
socket.on('message',addMsg);
function sendMsg(){let inp=document.getElementById('msgInput'); let t=inp.value.trim(); if(!t) return; socket.emit('message',{from:myName,to:currentChat,text:t,type:'text'}); inp.value=''; inp.focus();}
document.getElementById('msgInput').addEventListener('input',()=>socket.emit('typing',{from:myName}));
async function uploadFile(el){let f=el.files[0]; if(!f) return; let fd=new FormData(); fd.append('file',f); let r=await fetch('/upload',{method:'POST',body:fd}); let d=await r.json(); socket.emit('message',{from:myName,to:currentChat,url:d.url,type:d.type,text:''});}
let mediaRecorder=null,audioChunks=[];
async function startVoice(){try{if(mediaRecorder && mediaRecorder.state==='recording'){mediaRecorder.stop(); return;} let s=await navigator.mediaDevices.getUserMedia({audio:true}); mediaRecorder=new MediaRecorder(s); audioChunks=[]; mediaRecorder.ondataavailable=e=>audioChunks.push(e.data); mediaRecorder.onstop=async()=>{let b=new Blob(audioChunks,{type:'audio/webm'}); let fd=new FormData(); fd.append('file',new File([b],'voice.webm',{type:'audio/webm'})); let r=await fetch('/upload',{method:'POST',body:fd}); let d=await r.json(); socket.emit('message',{from:myName,to:currentChat,url:d.url,type:'audio',text:''});}; mediaRecorder.start(); alert('Recording... Tap 🎤 again to send');}catch(e){alert('Mic no work for this browser');}}
function showTab(t){document.getElementById('tabChats').classList.toggle('active',t==='chats'); document.getElementById('tabStatus').classList.toggle('active',t==='status'); if(t==='status'){document.body.classList.add('in-status'); document.body.classList.remove('in-chat'); document.getElementById('statusPanel').style.display='block'; renderStatuses();} else{document.body.classList.remove('in-status'); document.body.classList.remove('in-chat'); document.getElementById('statusPanel').style.display='none';}}
function previewStatus(el){let f=el.files[0]; if(!f) return; pendingFile=f; let url=URL.createObjectURL(f); document.getElementById('preview').innerHTML=f.type.startsWith('video')?`<video src="${url}" controls playsinline></video>`:`<img src="${url}">`; document.getElementById('statusHint').innerText='Selected: '+f.name;}
async function postStatus(){
  let v=document.getElementById('statusInput').value.trim();
  if(!v &&!pendingFile) return alert('Type something or add photo/video');
  let btn=document.getElementById('postBtn'); btn.innerText='Posting...'; btn.disabled=true;
  let media='', mediaType='';
  try{
    if(pendingFile){ let fd=new FormData(); fd.append('file',pendingFile); let r=await fetch('/upload',{method:'POST',body:fd}); let d=await r.json(); media=d.url; mediaType=d.type; }
    let newStatus={name:myName,text:v,media:media,mediaType:mediaType,time:new Date().toLocaleString()};
    socket.emit('newStatus', newStatus);
    document.getElementById('statusInput').value=''; document.getElementById('preview').innerHTML=''; document.getElementById('statusHint').innerText=''; pendingFile=null; document.getElementById('statusFile').value='';
  }catch(e){ alert('Upload failed, try smaller video (under 100MB)'); }
  btn.innerText='Post +'; btn.disabled=false;
}
function deleteStatus(time){ if(!confirm('Delete this status?')) return; statuses=statuses.filter(s=>s.time!==time); localStorage.setItem('mayor_status',JSON.stringify(statuses)); renderStatuses(); socket.emit('deleteStatus', time); }
function renderStatuses(){
  document.getElementById('statusList').innerHTML=statuses.length?statuses.map((s)=>{
    let mediaHtml='';
    if(s.media){ if(s.mediaType==='video') mediaHtml=`<video src="${s.media}" controls playsinline preload="metadata"></video>`; else mediaHtml=`<img src="${s.media}">`; }
    return `<div class="status-card"><button class="del-btn" onclick="deleteStatus('${s.time}')">✕</button><b>💖 ${s.name}</b><p>${s.text||''}</p>${mediaHtml}<br><small>${s.time}</small></div>`;
  }).join(''):'<p>No status yet. Be the first to post! ✨</p>';
}
function toggleDark(){document.body.classList.toggle('dark');}
</script>
</body>
</html>
