<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MayorChatZ 👑</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#111b21;color:#e9edef;height:100vh;display:flex;flex-direction:column}
#auth{flex:1;display:flex;align-items:center;justify-content:center}
.card{background:#202c33;padding:24px;border-radius:16px;width:92%;max-width:360px}
h2{color:#00a884;text-align:center;margin-bottom:16px}
input{width:100%;padding:14px;margin:8px 0;border:0;border-radius:10px;background:#2a3942;color:#fff;font-size:15px;outline:none}
button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:10px;background:#00a884;color:#111b21;font-weight:800;font-size:16px}
#app{display:none;flex:1;flex-direction:column;overflow:hidden}
.hdr{background:#202c33;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.tabs{display:flex;background:#202c33;border-top:1px solid #111b21}
.tab{flex:1;text-align:center;padding:14px 0;color:#8696a0;border-bottom:3px solid transparent;font-size:14px}
.tab.active{color:#00a884;border-color:#00a884}
#content{flex:1;overflow-y:auto;background:#0b141a}
.item{padding:12px 16px;display:flex;gap:12px;border-bottom:1px solid #202c33;align-items:center}
.av{width:48px;height:48px;border-radius:50%;background:#00a884;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.msg{max-width:78%;padding:8px 10px;border-radius:8px;margin:4px 16px;word-break:break-word}
.me{background:#005c4b;margin-left:auto}
.other{background:#202c33}
#chatArea{display:none;flex-direction:column;flex:1;overflow:hidden}
#msgs{flex:1;overflow-y:auto;padding:10px 0;display:flex;flex-direction:column;background:#0b141a}
.bar{display:flex;gap:8px;padding:8px;background:#202c33}
.bar input{flex:1;border-radius:22px}
.send{width:48px;height:48px;border-radius:50%;background:#00a884;border:0;font-size:20px}
#typing{height:18px;padding:0 16px;color:#00a884;font-size:12px}
#out{margin-top:10px;text-align:center;min-height:18px}
</style>
</head>
<body>
<div id="auth"><div class="card">
<h2>MayorChatZ 👑</h2>
<input id="n" placeholder="Name e.g DE mayors">
<input id="ph" placeholder="Phone e.g 07088347232">
<input id="pw" type="password" placeholder="Password">
<input id="av" placeholder="Avatar emoji e.g 👑">
<button id="btnS">Signup</button>
<button id="btnL" style="background:#2a3942;color:#fff">Login</button>
<div id="out"></div>
</div></div>
<div id="app">
<div class="hdr"><div><b id="myName">Mayor</b><br><small id="myPh" style="color:#8696a0"></small></div><div onclick="logout()" style="cursor:pointer">Logout</div></div>
<div class="tabs"><div class="tab active" id="tStatus">Status</div><div class="tab" id="tChats">Chats</div><div class="tab" id="tGroups">Groups</div></div>
<div id="content"></div><div id="typing"></div>
<div id="chatArea"><div style="padding:10px;background:#202c33;display:flex;gap:10px;align-items:center"><span onclick="closeChat()" style="cursor:pointer">⬅️</span><b id="chatWith">General</b></div><div id="msgs"></div><div class="bar"><input id="msgInput" placeholder="Type a message"><button class="send" id="sendBtn">➤</button></div></div>
</div>
<script>
let ME=null,CURR='all',USERS=[];const $=id=>document.getElementById(id);const out=$('out');
function showAuth(m,c){out.textContent=m;out.style.color=c||'#00a884'}
function initApp(user){ME=user;$('auth').style.display='none';$('app').style.display='flex';$('myName').textContent=user.name+' '+user.avatar;$('myPh').textContent=user.phone;loadUsers();loadStatus();setInterval(poll,2000)}
let saved=localStorage.getItem('mayor');if(saved){try{initApp(JSON.parse(saved))}catch{}}
$('btnS').addEventListener('click',async()=>{let b={name:$('n').value.trim(),phone:$('ph').value.trim(),password:$('pw').value.trim(),avatar:$('av').value.trim()||'👤'};if(!b.name||!b.phone||!b.password){showAuth('❌ Fill all','#f15c6d');return}showAuth('⏳ Signing...');try{let r=await fetch('/api/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});let j=await r.json();if(j.error){showAuth(j.error==='exists'?'⚠️ Exists, tap Login':'❌ '+j.error,'#f15c6d');return}showAuth('✅ Signup OK! Now Login')}catch(e){showAuth('❌ '+e.message,'#f15c6d')}});
$('btnL').addEventListener('click',async()=>{let b={phone:$('ph').value.trim(),password:$('pw').value.trim()};if(!b.phone||!b.password){showAuth('❌ Fill phone & pass','#f15c6d');return}showAuth('⏳ Logging...');try{let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});let j=await r.json();if(j.error){showAuth('❌ Wrong phone/pass','#f15c6d');return}let user={name:j.name,avatar:j.avatar,phone:b.phone};localStorage.setItem('mayor',JSON.stringify(user));initApp(user)}catch(e){showAuth('❌ '+e.message,'#f15c6d')}});
function logout(){localStorage.removeItem('mayor');location.reload()}
$('tStatus').addEventListener('click',e=>{setActive(e.target);loadStatus()});$('tChats').addEventListener('click',e=>{setActive(e.target);loadChats()});$('tGroups').addEventListener('click',e=>{setActive(e.target);loadGroups()});
function setActive(el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active')}
async function loadUsers(){try{let r=await fetch('/api/users');USERS=await r.json()}catch{}}
async function loadChats(){$('content').style.display='block';$('chatArea').style.display='none';$('content').innerHTML='';let div=document.createElement('div');div.className='item';div.innerHTML=`<div class="av">🌍</div><div><b>General Group</b><br><small>All users chat</small></div>`;div.onclick=()=>openChat('all','General 🌍');$('content').appendChild(div);USERS.forEach(u=>{if(u.name===ME.name)return;let d=document.createElement('div');d.className='item';d.innerHTML=`<div class="av">${u.avatar}</div><div><b>${u.name}</b></div>`;d.onclick=()=>openChat(u.name,u.name);$('content').appendChild(d)})}
async function loadGroups(){$('content').style.display='block';$('chatArea').style.display='none';$('content').innerHTML='';try{let r=await fetch('/api/groups');let g=await r.json();g.forEach(x=>{let d=document.createElement('div');d.className='item';d.innerHTML=`<div class="av">👥</div><div><b>${x.name}</b></div>`;d.onclick=()=>openChat(x.id,x.name);$('content').appendChild(d)})}catch{$('content').innerHTML='<div class="item">No groups yet</div>'}}
async function loadStatus(){$('content').style.display='block';$('chatArea').style.display='none';$('content').innerHTML='';let top=document.createElement('div');top.className='item';top.innerHTML=`<div class="av">${ME.avatar}</div><div style="flex:1"><input id="stText" placeholder="My status..."><button onclick="postStatus()" style="padding:8px;margin-top:6px">Post Status</button></div>`;$('content').appendChild(top);try{let r=await fetch('/api/status');let list=await r.json();list.slice().reverse().forEach(s=>{let d=document.createElement('div');d.className='item';d.innerHTML=`<div class="av">${s.avatar}</div><div><b>${s.user}</b><br>${s.text}<br><small style="color:#8696a0">${s.time} • ${s.views.length} views</small></div>`;d.onclick=()=>fetch('/api/status/'+s.id+'/view',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:ME.name})});$('content').appendChild(d)})}catch{}}
window.postStatus=async()=>{let t=document.getElementById('stText');if(!t||!t.value.trim())return;await fetch('/api/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:ME.name,avatar:ME.avatar,text:t.value.trim()})});loadStatus()}
function openChat(dest,name){CURR=dest;$('chatWith').textContent=name;$('content').style.display='none';$('chatArea').style.display='flex';$('msgs').innerHTML='';poll()}
window.closeChat=()=>{$('chatArea').style.display='none';$('content').style.display='block';loadChats()}
$('sendBtn').addEventListener('click',sendMsg);$('msgInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg()});$('msgInput').addEventListener('input',()=>{fetch('/api/typing',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:ME.name})})});
async function sendMsg(){let txt=$('msgInput').value.trim();if(!txt)return;$('msgInput').value='';await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:ME.name,avatar:ME.avatar,text:txt,dest:CURR})});poll()}
async function poll(){if(!ME)return;try{let tr=await fetch('/api/typing');let ta=await tr.json();let others=ta.filter(u=>u!==ME.name);$('typing').textContent=others.length?others.join(', ')+' typing...':'';let mr=await fetch('/api/messages');let all=await mr.json();let filtered=CURR==='all'?all.filter(m=>m.dest==='all'):all.filter(m=>(m.dest===CURR&&m.user===ME.name)||(m.dest===ME.name&&m.user===CURR));$('msgs').innerHTML='';filtered.slice(-100).forEach(m=>{let d=document.createElement('div');d.className='msg '+(m.user===ME.name?'me':'other');d.innerHTML=`<small style="color:#00a884;font-size:11px">${m.user}</small><br>${m.text}<br><small style="opacity:.6;font-size:10px">${m.time}</small>`;$('msgs').appendChild(d)});$('msgs').scrollTop=$('msgs').scrollHeight}catch{}}
</script>
</body>
 </html>
