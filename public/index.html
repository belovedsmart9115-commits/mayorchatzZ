<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#111b21;display:flex;flex-direction:column;height:100vh}
header{background:#202c33;color:#e9edef;padding:15px;font-weight:bold;font-size:18px;display:flex;align-items:center;gap:10px}
#messages{flex:1;overflow-y:auto;padding:15px;background:#0b141a url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');list-style:none}
#messages li{max-width:75%;padding:8px 12px;margin:6px 0;border-radius:8px;font-size:15px;word-wrap:break-word}
.me{background:#005c4b;color:#e9edef;margin-left:auto;border-top-right-radius:0!important}
.other{background:#202c33;color:#e9edef;margin-right:auto;border-top-left-radius:0!important}
small{display:block;font-size:11px;opacity:0.6;margin-top:4px}
form{display:flex;padding:8px;background:#202c33;gap:8px}
input{flex:1;padding:12px;border:none;border-radius:20px;background:#2a3942;color:white;outline:none}
button{padding:12px 20px;border:none;border-radius:20px;background:#00a884;color:white;font-weight:bold}
</style>
</head>
<body>
<header>💬 My WhatsApp Clone — <span id="user"></span></header>
<ul id="messages"></ul>
<form id="form"><input id="input" autocomplete="off" placeholder="Type a message"><button>➤</button></form>
<script src="/socket.io/socket.io.js"></script>
<script>
const name = prompt("Your name?") || "Anon";
document.getElementById('user').textContent = name;
const socket = io();
const form = document.getElementById('form');
const input = document.getElementById('input');
const messages = document.getElementById('messages');
form.addEventListener('submit', e => {
 e.preventDefault();
 if(input.value){
   socket.emit('chat message', {user:name, text:input.value});
   input.value='';
 }
});
socket.on('chat message', data => {
 const li = document.createElement('li');
 li.className = data.user===name?'me':'other';
 li.innerHTML = `<b>${data.user}</b><br>${data.text}<small>${new Date().toLocaleTimeString()}</small>`;
 messages.appendChild(li);
 messages.scrollTop = messages.scrollHeight;
});
</script>
</body>
</html>
