<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>MayorChatZ CALLS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#0f0f0f;color:#fff;display:flex;height:100vh}
#login{position:fixed;inset:0;background:#0f0f0f;display:flex;align-items:center;justify-content:center;z-index:99}
.card{background:#1a1a1a;padding:24px;border-radius:16px;width:90%;max-width:340px}
input,button{width:100%;padding:12px;border-radius:10px;border:none;margin-top:10px}
input{background:#2a2a2a;color:#fff}button{background:#25D366;color:#000;font-weight:700;cursor:pointer}
#side{width:280px;background:#1a1a1a;border-right:1px solid #333;display:flex;flex-direction:column}
#main{flex:1;display:flex;flex-direction:column}
#users{flex:1;overflow:auto;padding:10px}.u{display:flex;justify-content:space-between;align-items:center;background:#2a2a2a;padding:10px;border-radius:10px;margin-bottom:8px}
#msgs{flex:1;overflow:auto;padding:12px}.m{background:#2a2a2a;padding:8px 12px;border-radius:12px;margin-bottom:8px;max-width:85%}.m.me{margin-left:auto;background:#25D366;color:#000}.m img,.m video{max-width:100%;border-radius:10px;margin-top:6px}
#input{display:flex;padding:10px;gap:6px;background:#1a1a1a;align-items:center}#input input{flex:1}.iconBtn{width:40px;background:#333;color:#fff}
#callModal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:100}
#callBox{background:#1a1a1a;padding:20px;border-radius:16px;text-align:center;width:90%;max-width:340px} video{width:100%;border-radius:12px;background:#000;margin:8px 0}
</style></head><body>
<div id="login"><div class="card"><h2>MayorChatZ 🔥</h2><p style="color:#888;font-size:13px">Your name</p><input id="nameIn" placeholder="e.g DE mayors"><button onclick="login()">Enter Chat</button></div></div>
<div id="side"><div style="padding:14px;border-bottom:1px solid #333"><b>MayorChatZ CALLS</b><br><small id="onlineCount" style="color:#25D366">0 online</small><button onclick="shareLink()" style="background:#333;color:#fff">📤 Share My Link</button></div><div id="users"></div></div>
<div id="main"><div id="msgs"></div><div id="input"><label class="iconBtn" style="text-align:center;padding:12px;border-radius:10px;background:#333;color:#fff;cursor:pointer">📷<input type="file" id="photoIn" accept="image/*,video/*" hidden onchange="sendMedia(this)"></label><input id="msgIn" placeholder="Type message..." onkeypress="if(event.key=='Enter')send()"><button onclick="send()" style="width:60px">Send</button></div></div>
<div id="callModal"><div id="callBox"><h3 id="callText">Incoming call...</h3><video id="localV" autoplay muted playsinline style="display:none"></video><video id="remoteV" autoplay playsinline></video><div style="display:flex;gap:8px;margin-top:10px"><button id="acceptBtn" onclick="acceptCall()" style="background:#25D366">Accept</button><button onclick="endCall()" style="background:#f44">End</button></div><p id="callStatus" style="color:#888;font-size:12px;margin-top:8px"></p></div></div>
<script>
let myName="",localStream,pc,currentCall=null,incomingCall=null;
function login(){myName=document.getElementById('nameIn').value.trim();if(!myName)return alert('Enter name');document.getElementById('login').style.display='none';setInterval(ping,3000);setInterval(loadMsgs,2000);setInterval(loadUsers,3000);setInterval(checkCalls,2000);ping();}
function ping(){fetch('/api/online',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:myName})});}
async function loadUsers(){let r=await fetch('/api/users');let d=await r.json();document.getElementById('onlineCount').innerText=d.count+' online';let html='';d.list.forEach(u=>{if(u==myName)return;html+=`<div class="u"><div><b>${u}</b><br><small>🟢 online</small></div><div><button onclick="makeCall('${u}','voice')" style="width:auto;padding:6px">📞</button><button onclick="makeCall('${u}','video')" style="width:auto;padding:6px">📹</button></div></div>`});document.getElementById('users').innerHTML=html||'<p style="padding:10px;color:#666">No other online</p>';}
async function loadMsgs(){let r=await fetch('/api/messages');let m=await r.json();let box=document.getElementById('msgs');box.innerHTML=m.map(x=>{let media='';if(x.type=='image')media=`<img src="${x.data}">`;if(x.type=='video')media=`<video src="${x.data}" controls></video>`;return `<div class="m ${x.name==myName?'me':''}"><b style="font-size:11px">${x.name}</b><br>${x.text||''}${media}</div>`}).join('');box.scrollTop=box.scrollHeight;}
async function send(){let t=document.getElementById('msgIn').value;if(!t)return;document.getElementById('msgIn').value='';await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:myName,text:t,type:'text'})});loadMsgs();}
async function sendMedia(inp){let f=inp.files[0];if(!f)return;let reader=new FileReader();reader.onload=async e=>{let type=f.type.startsWith('video')?'video':'image';await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:myName,text:'',type,data:e.target.result})});loadMsgs();};reader.readAsDataURL(f);}
async function shareLink(){let l=location.href;await navigator.clipboard.writeText(l);alert('Link copied: '+l);}
let ice=[{urls:'stun:stun.l.google.com:19302'}];
async function makeCall(to,type){currentCall={to,type};document.getElementById('callText').innerText=`Calling ${to}...`;document.getElementById('callStatus').innerText='Connecting...';document.getElementById('callModal').style.display='flex';document.getElementById('acceptBtn').style.display='none';localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:type=='video'});document.getElementById('localV').style.display=type=='video'?'block':'none';document.getElementById('localV').srcObject=localStream;pc=new RTCPeerConnection({iceServers:ice});localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));pc.ontrack=e=>document.getElementById('remoteV').srcObject=e.streams[0];let o=await pc.createOffer();await pc.setLocalDescription(o);await fetch('/api/calls',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from:myName,to,type,data:JSON.stringify(o)})});}
async function checkCalls(){let r=await fetch('/api/calls?user='+myName);let cs=await r.json();if(!cs.length)return;let c=cs[cs.length-1];if(c.accepted)return;if(incomingCall&&incomingCall.id==c.id)return;incomingCall=c;document.getElementById('callText').innerText=`${c.from} calling (${c.type})`;document.getElementById('callStatus').innerText='Incoming';document.getElementById('acceptBtn').style.display='block';document.getElementById('callModal').style.display='flex';}
async function acceptCall(){let c=incomingCall;localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:c.type=='video'});document.getElementById('localV').style.display=c.type=='video'?'block':'none';document.getElementById('localV').srcObject=localStream;pc=new RTCPeerConnection({iceServers:ice});localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));pc.ontrack=e=>document.getElementById('remoteV').srcObject=e.streams[0];let off=JSON.parse(c.data);await pc.setRemoteDescription(off);let ans=await pc.createAnswer();await pc.setLocalDescription(ans);await fetch('/api/calls/'+c.id,{method:'PUT'});currentCall=c;incomingCall=null;document.getElementById('acceptBtn').style.display='none';}
async function endCall(){document.getElementById('callModal').style.display='none';if(pc)pc.close();if(localStream)localStream.getTracks().forEach(t=>t.stop());if(currentCall&&currentCall.id)await fetch('/api/calls/'+currentCall.id,{method:'DELETE'});if(incomingCall)await fetch('/api/calls/'+incomingCall.id,{method:'DELETE'});currentCall=null;incomingCall=null;}
</script></body></html>
