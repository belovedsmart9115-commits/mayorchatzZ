<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MayorChatZ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0b0a1a;color:white;height:100vh;display:flex;flex-direction:column}
.header{background:#1a1033;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2a2350}
.tabs{display:flex;background:#1a1033;border-bottom:2px solid #2a2350}
.tab{flex:1;padding:12px;text-align:center;cursor:pointer;color:#aaa}
.tab.active{color:#ff2a8a;border-bottom:3px solid #ff2a8a}
.chat-list{flex:1;overflow-y:auto}
.chat-item{display:flex;gap:12px;padding:12px;border-bottom:1px solid #1f1a3a;cursor:pointer}
.chat-item:hover{background:#1f1a3a}
.avatar{width:45px;height:45px;border-radius:50%;background:#ff2a8a;display:flex;align-items:center;justify-content:center;font-weight:bold}
.info{flex:1}
.name{font-weight:bold;display:flex;gap:5px}
.last{color:#aaa;font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-size:11px;color:#aaa}
.chat-window{display:none;flex-direction:column;height:100vh;position:fixed;top:0;left:0;right:0;background:#0b0a1a;z-index:10}
.chat-header{background:#1a1033;padding:10px 15px;display:flex;align-items:center;gap:10px}
.status-dot{width:8px;height:8px;background:#00ff88;border-radius:50%;display:inline-block}
.online{font-size:12px;color:#00ff88}
.lastseen{font-size:11px;color:#aaa}
.msgs{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px;background:#0f0d24}
.msg{padding:10px 14px;border-radius:18px;max-width:75%;font-size:14px}
.user{background:#ff2a8a;align-self:flex-end;border-bottom-right-radius:4px}
.bot{background:#2a2350;align-self:flex-start;border-bottom-left-radius:4px}
.input-area{display:flex;padding:10px;background:#1a1033;gap:10px;align-items:center}
input{flex:1;padding:12px 18px;border-radius:25px;border:none;background:#2a2350;color:white;outline:none}
button{background:#ff2a8a;border:none;width:45px;height:45px;border-radius:50%;color:white;font-size:18px;cursor:pointer}
.back{font-size:22px;cursor:pointer}
</style>
</head>
<body>
<div class="header"><b>MayorChatZ</b><span>🔗 • 1</span></div>
<div class="tabs"><div class="tab active">💬 Chats</div><div class="tab">📸 Status</div><div class="tab">👥 Groups</div></div>

<div class="chat-list" id="chatList">
  <div class="chat-item" onclick="openChat('assistant')">
    <div class="avatar">M</div>
    <div class="info"><div class="name">MayorChatZ Assistant <span style="color:#00ff88">●</span></div><div class="last">Ask me anything! I'm online now...</div></div>
    <div class="time">now</div>
  </div>
  <div class="chat-item" onclick="openChat('mayor')">
    <div class="avatar" style="background:#6c5ce7">B</div>
    <div class="info"><div class="name">Mayor (You)</div><div class="last">Hey, check my bot...</div></div>
    <div class="time">10:32</div>
  </div>
</div>

<div class="chat-window" id="chatWindow">
  <div class="chat-header">
    <span class="back" onclick="closeChat()">←</span>
    <div class="avatar" id="cAvatar">M</div>
    <div style="flex:1">
      <div style="font-weight:bold" id="cName">MayorChatZ Assistant</div>
      <div><span class="status-dot"></span> <span class="online" id="cOnline">Online</span> • <span class="lastseen" id="cLast">Last seen today at 10:35 PM</span></div>
    </div>
  </div>
  <div class="msgs" id="msgs"></div>
  <div class="input-area">
    <button>📎</button><button>🎤</button>
    <input id="msgInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendMsg()">
    <button onclick="sendMsg()">➤</button>
  </div>
</div>

<script>
let current = 'assistant';
function openChat(who){
 document.getElementById('chatWindow').style.display='flex';
 current=who;
 let msgs=document.getElementById('msgs');
 msgs.innerHTML='';
 if(who==='assistant'){
   document.getElementById('cName').innerText='MayorChatZ Assistant';
   document.getElementById('cOnline').innerText='Online';
   document.getElementById('cLast').innerText='Last seen today at 10:35 PM';
   document.getElementById('cAvatar').innerText='M';
   msgs.innerHTML=`<div class="msg bot">Hello Boss! 🔥 I be MayorChatZ Assistant! Your FREE AI don dey live! Wetin you wan ask me today?</div>`;
 }else{
   document.getElementById('cName').innerText='Mayor (You)';
   document.getElementById('cOnline').innerText='Online';
   document.getElementById('cLast').innerText='Last seen just now';
   document.getElementById('cAvatar').innerText='B';
   msgs.innerHTML=`<div class="msg bot">This na your private chat preview Boss 😌</div>`;
 }
}
function closeChat(){document.getElementById('chatWindow').style.display='none';}
async function sendMsg(){
 let input=document.getElementById('msgInput');
 let text=input.value.trim();
 if(!text)return;
 let msgs=document.getElementById('msgs');
 msgs.innerHTML+=`<div class="msg user">${text}</div>`;
 input.value='';
 msgs.scrollTop=msgs.scrollHeight;
 if(current!=='assistant'){
   setTimeout(()=>{msgs.innerHTML+=`<div class="msg bot">Seen ✅</div>`;msgs.scrollTop=msgs.scrollHeight;},800);
   return;
 }
 try{
   let res=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
   let data=await res.json();
   msgs.innerHTML+=`<div class="msg bot">${data.reply}</div>`;
 }catch(e){
   msgs.innerHTML+=`<div class="msg bot">Network slow small Boss, try again! 😅</div>`;
 }
 msgs.scrollTop=msgs.scrollHeight;
}
openChat('assistant');
</script>
</body>
</html>
