<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>MayorchatzZ PRO MAX</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#111;color:#fff}
header{background:#075E54;padding:10px;display:flex;justify-content:space-between;align-items:center}
button{border:none;padding:6px 10px;border-radius:6px;font-weight:bold;cursor:pointer}
#auth{padding:25px;max-width:400px;margin:auto}
input,select{width:100%;padding:11px;margin:6px 0;border-radius:10px;border:none}
button.main{width:100%;padding:13px;background:#25D366;color:#000;font-size:16px;margin-top:8px}
#app{display:none;height:calc(100vh - 48px);flex-direction:row}
#side{width:35%;max-width:320px;background:#202c33;border-right:1px solid #333;display:flex;flex-direction:column}
#tabs{display:flex;background:#111}
#tabs button{flex:1;border-radius:0;background:#202c33;color:#aaa;padding:10px}
#tabs button.active{background:#075E54;color:#fff}
.list{flex:1;overflow-y:auto}
.item{padding:10px;border-bottom:1px solid #333;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.item:hover{background:#2a3942}
.item.active{background:#005c4b}
#main{flex:1;display:flex;flex-direction:column}
#topBar{padding:8px 10px;background:#202c33;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333}
#online{font-size:11px;opacity:.7}
#msgs{flex:1;overflow-y:auto;padding:10px;background:#0b141a}
.msg{margin:6px 0;padding:7px 10px;border-radius:10px;max-width:80%;word-break:break-word}
.me{background:#005c4b;margin-left:auto}
.other{background:#202c33}
.msg img{max-width:100%;border-radius:8px;margin-top:4px}
audio{width:100%;margin-top:4px}
small{font-size:9px;opacity:.6}
#typing{font-size:11px;color:#25D366;padding:2px 8px;height:14px}
#inputArea{display:flex;padding:7px;background:#202c33;gap:5px;align-items:center}
#inputArea input{flex:1;margin:0}
#inputArea label,#inputArea button{width:auto;padding:9px;background:#25D366;border-radius:8px;color:#000;font-weight:bold}
#callModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:99;flex-direction:column}
#callModal video{flex:1;background:#111}
#callBtns{padding:15px;display:flex;justify-content:center;gap:15px;background:#202c33}
#callBtns button{padding:12px 20px;border-radius:25px}
</style></head><body>
<header><b>MayorchatzZ PRO 🔥</b><div style="display:flex;gap:5px"><button onclick="toggleTheme()">🌙</button><button id="shareBtn" onclick="shareLink()" style="display:none;background:#25D366">Share</button><button id="logoutBtn" onclick="logout()" style="display:none;background:#f15a29;color:#fff">Logout</button></div></header>

<div id="authBox"><div id="auth">
<h2 id="ft">Create Account</h2>
<input id="nIn" placeholder="Your Name">
<select id="aIn"><option>👤</option><option>😎</option><option>🔥</option><option>👑</option><option>💀</option><option>😍</option><option>🚀</option><option>🎮</option></select>
<input id="pIn" placeholder="Phone">
<input id="pwIn" type="password" placeholder="Password">
<button class="main" onclick="doAuth()" id="ab">Signup</button>
<p style="margin-top:10px;text-align:center"><span id="tt">Have account?</span> <a href="#" onclick="tog()">Login</a></p>
<p id="err" style="color:#ff6b6b;text-align:center;margin-top:8px"></p>
</div></div>

<div id="app">
<div id="side">
<div id="tabs"><button id="tabAll" class="active" onclick="setTab('all')">All</button><button id="tabPriv" onclick="setTab('private')">DM</button><button id="tabGrp" onclick="setTab('groups')">Groups</button></div>
<div id="listAll" class="list"></div>
<div id="listPriv" class="list" style="display:none"></div>
<div id="listGrp" class="list" style="display:none">
<div style="padding:8px;display:flex;gap:4px"><input id="gName" placeholder="New group name"><button onclick="createGroup()" style="background:#25D366">+</button></div>
<div id="grpList"></div>
</div>
</div>
<div id="main">
<div id="topBar"><div><b id="chatTitle">General Chat</b><div id="online"></div></div><div><button onclick="startCall()" style="background:#25D366">📹 Call</button></div></div>
<div id="msgs"></div>
<div id="typing"></div>
<div id="inputArea"><label for="fileIn">📸</label><input type="file" id="fileIn" accept="image/*" hidden onchange="sendImg(this)"><button id="recBtn" onclick="toggleRec()">🎤</button><input id="msgIn" placeholder="Type message..." oninput="sendTyping()" onkeypress="if(event.key==='Enter')sendMsg()"><button onclick="sendMsg()">Send</button></div>
</div>
</div>

<div id="callModal">
<video id="remoteV" autoplay playsinline></video>
<video id="localV" autoplay playsinline muted style="position:absolute;bottom:80px;right:10px;width:120px;height:160px;border-radius:10px;border:2px solid #25D366"></video>
<div id="callBtns"><button onclick="endCall()" style="background:#f15a29">End ❌</button></div>
</div>

<script>
let isLogin=false, cur=localStorage.getItem('mayorUser'), ava=localStorage.getItem('mayorAvatar')||'👤';
let currentTab='all', currentChat={type:'all',id:'general'}, rec, recData=[], pc, localStream, callPoll;
let gid=i=>document.getElementById(i);
function check(){if(cur){gid('authBox').style.display='none';gid('app').style.display='flex';gid('logoutBtn').style.display='block';gid('shareBtn').style.display='block';loadAll();} }check();
function tog(){isLogin=!isLogin;gid('ft').innerText=isLogin?'Login':'Signup';gid('ab').innerText=isLogin?'Login':'Signup';gid('tt').innerText=isLogin?"No account?":"Have account?";gid('nIn').style.display=isLogin?'none':'block';gid('aIn').style.display=isLogin?'none':'block';}
async function doAuth(){
 let n=gid('nIn').value.trim(),a=gid('aIn').value,p=gid('pIn').value.trim(),pw=gid('pwIn').value.trim();
 if(!p||!pw||(!isLogin&&!n)){gid('err').innerText='Fill all';return;}
 gid('ab').innerText='Loading...';
 try{let url=isLogin?'/api/login':'/api/signup',body=isLogin?{phone:p,password:pw}:{name:n,phone:p,password:pw,avatar:a};
 let r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();
 if(d.error){gid('err').innerText=d.error;gid('ab').innerText=isLogin?'Login':'Signup';return;}
 localStorage.setItem('mayorUser',isLogin?d.name:n);localStorage.setItem('mayorAvatar',isLogin?d.avatar:a);location.reload();
 }catch(e){gid('err').innerText='Server waking, wait 30s';gid('ab').innerText='Signup';}
}
function setTab(t){
 currentTab=t;
 gid('tabAll').className=t=='all'?'active':'';gid('tabPriv').className=t=='private'?'active':'';gid('tabGrp').className=t=='groups'?'active':'';
 gid('listAll').style.display=t=='all'?'block':'none';gid('listPriv').style.display=t=='private'?'block':'none';gid('listGrp').style.display=t=='groups'?'block':'none';
}
async function loadAll(){loadUsers();loadGroups();loadMsgs();}
async function loadUsers(){
 try{let r=await fetch('/api/users'),u=await r.json();
 gid('online').innerText=u.length+' users online';
 let all=gid('listAll'); all.innerHTML='<div class="item active" onclick="openChat(\'all\',\'general\',\'General Chat\')"><span>🌍 General Chat</span><span>👥</span></div>';
 let priv=gid('listPriv'); priv.innerHTML='';
 u.forEach(x=>{
  if(x.name==cur) return;
  let d=document.createElement('div'); d.className='item'; d.innerHTML=`<span>${x.avatar} ${x.name}</span><span>💬</span>`;
  d.onclick=()=>openChat('private',x.name,x.name); priv.appendChild(d);
  let a2=d.cloneNode(true); a2.onclick=d.onclick; all.appendChild(a2);
 });
 }catch(e){}
}
async function loadGroups(){
 try{let r=await fetch('/api/groups'),g=await r.json(); let box=gid('grpList'); box.innerHTML='';
 g.forEach(gr=>{
  let d=document.createElement('div'); d.className='item'; d.innerHTML=`<span>👥 ${gr.name}</span><span>${gr.members.length}</span>`;
  d.onclick=()=>openChat('group',gr.id,gr.name); box.appendChild(d);
 });
 }catch(e){}
}
async function createGroup(){
 let name=gid('gName').value.trim(); if(!name) return;
 await fetch('/api/groups',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,creator:cur})});
 gid('gName').value=''; loadGroups();
}
function openChat(type,id,title){
 currentChat={type,id}; gid('chatTitle').innerText=title;
 document.querySelectorAll('.item').forEach(i=>i.classList.remove('active'));
 loadMsgs();
 if(type=='group') fetch('/api/groups/'+id+'/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:cur})});
}
async function loadMsgs(){
 try{let r=await fetch('/api/messages'),msgs=await r.json();
 let box=gid('msgs'); box.innerHTML='';
 let filtered=msgs.filter(m=>{
  if(currentChat.type=='all') return m.to=='all' || (!m.to);
  if(currentChat.type=='private') return (m.user==cur && m.to==currentChat.id) || (m.user==currentChat.id && m.to==cur) || (m.user==currentChat.id && m.to=='all');
  if(currentChat.type=='group') return m.to==currentChat.id;
  return true;
 });
 filtered.forEach(m=>{
  let d=document.createElement('div'); d.className='msg '+(m.user==cur?'me':'other');
  let content=m.text||''; if(m.type=='image') content='<br><img src="'+m.data+'">'; if(m.type=='voice') content='<br><audio controls src="'+m.data+'"></audio>';
  let del=m.user==cur?`<span style="font-size:10px;color:#ff8a65;cursor:pointer" onclick="delM('${m.id}')> [del]</span>`:'';
  d.innerHTML=`<b>${m.avatar||'👤'} ${m.user}</b>${del}<br>${content}<br><small>${m.time||''}</small>`;
  box.appendChild(d);
 });
 box.scrollTop=box.scrollHeight;
 }catch(e){}
}
async function sendMsg(){
 let t=gid('msgIn').value.trim(); if(!t||!cur) return;
 let to=currentChat.type=='all'?'all':currentChat.id;
 await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:cur,text:t,avatar:ava,type:'text',to})});
 gid('msgIn').value=''; loadMsgs();
}
async function sendImg(el){let f=el.files[0]; if(!f) return; let rd=new FileReader(); rd.onload=async()=>{let to=currentChat.type=='all'?'all':currentChat.id; await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:cur,avatar:ava,type:'image',data:rd.result,to})}); loadMsgs();}; rd.readAsDataURL(f);}
async function sendTyping(){if(!cur) return; await fetch('/api/typing',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:cur})});}
async function checkTyping(){try{let r=await fetch('/api/typing'),u=await r.json(),o=u.filter(x=>x!=cur); gid('typing').innerText=o.length?o.join(', ')+' typing...':'';}catch(e){}}
async function delM(id){if(!confirm('Delete?'))return; await fetch('/api/messages/'+id,{method:'DELETE'}); loadMsgs();}
function logout(){localStorage.clear(); location.reload();}
function shareLink(){let l='https://mayorchatzZ.onrender.com'; if(navigator.share) navigator.share({title:'Join',url:l}); else {navigator.clipboard.writeText(l); alert('Copied '+l);}}

// VIDEO CALL
async function startCall(){
 if(currentChat.type=='all'){alert('Select a user for private call first (tap DM)'); return;}
 let target=currentChat.id;
 gid('callModal').style.display='flex';
 localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
 gid('localV').srcObject=localStream;
 pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
 localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
 pc.ontrack=e=>{gid('remoteV').srcObject=e.streams[0];};
 pc.onicecandidate=e=>{if(e.candidate){fetch('/api/call',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from:cur,to:target,type:'ice',data:e.candidate})});}};
 let offer=await pc.createOffer(); await pc.setLocalDescription(offer);
 await fetch('/api/call',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from:cur,to:target,type:'offer',data:offer})});
 pollCall();
}
async function pollCall(){
 callPoll=setInterval(async()=>{
  let r=await fetch('/api/call/'+cur),cs=await r.json();
  for(let c of cs){
   if(c.type=='offer' && c.from!=cur){
    if(!pc){if(!confirm(c.from+' is calling you 📹 Accept?')){await fetch('/api/call/'+c.id,{method:'DELETE'}); continue;}
     gid('callModal').style.display='flex';
     localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
     gid('localV').srcObject=localStream;
     pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
     localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
     pc.ontrack=e=>{gid('remoteV').srcObject=e.streams[0];};
     pc.onicecandidate=e=>{if(e.candidate) fetch('/api/call',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from:cur,to:c.from,type:'ice',data:e.candidate})});};
     await pc.setRemoteDescription(c.data);
     let ans=await pc.createAnswer(); await pc.setLocalDescription(ans);
     await fetch('/api/call',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from:cur,to:c.from,type:'answer',data:ans})});
    }
   }
   if(c.type=='answer'){await pc.setRemoteDescription(c.data);}
   if(c.type=='ice' && pc){try{await pc.addIceCandidate(c.data);}catch(e){}}
   await fetch('/api/call/'+c.id,{method:'DELETE'});
  }
 },1500);
}
function endCall(){
 if(pc){pc.close(); pc=null;} if(localStream){localStream.getTracks().forEach(t=>t.stop());}
 gid('callModal').style.display='none'; clearInterval(callPoll);
 gid('localV').srcObject=null; gid('remoteV').srcObject=null;
}
setInterval(()=>{if(cur){loadMsgs(); loadUsers(); checkTyping();}},3000);
setInterval(()=>{if(cur) pollCall();},4000);
function toggleTheme(){document.body.classList.toggle('light');}
</script></body></html>
