<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MayorChatZ</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<meta name="theme-color" content="#ff2e8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MayorChatZ">
<script src="/socket.io/socket.io.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0b0a1a;color:#fff;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.h{background:#1a1033;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2a2350;font-weight:bold}
.tabs{display:flex;background:#1a1033}
.tab{flex:1;padding:13px;text-align:center;color:#888;cursor:pointer;border-bottom:3px solid transparent;font-size:14px}
.tab.active{color:#ff2a8a;border-bottom-color:#ff2a8a}
.fab{position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:#ff2a8a;color:#fff;border:none;font-size:28px;cursor:pointer;z-index:5;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.list{flex:1;overflow:auto}
.item{display:flex;gap:12px;padding:13px;border-bottom:1px solid #15122e;cursor:pointer;align-items:center}
.av{width:46px;height:46px;border-radius:50%;background:#ff2a8a;display:flex;align-items:center;justify-content:center;font-weight:bold;flex-shrink:0;overflow:hidden;position:relative}
.online-dot{width:12px;height:12px;background:#00ff88;border-radius:50%;border:2px solid #0b0a1a;position:absolute;bottom:0;right:0}
.nm{font-weight:bold;font-size:15px}
.lt{color:#999;font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.tm{font-size:11px;color:#888;margin-left:auto}
.panel{display:none;flex:1;overflow:auto;position:relative}
.panel.on{display:block}
.win{display:none;flex-direction:column;height:100dvh;position:fixed;inset:0;background:#0b0a1a;z-index:99}
.win.on{display:flex}
.ch{background:#1a1033;padding:10px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #2a2350}
.dot{width:8px;height:8px;background:#00ff88;border-radius:50%;display:inline-block}
.msgs{flex:1;overflow:auto;padding:15px;display:flex;flex-direction:column;gap:10px;background:#0f0d24}
.msg{padding:10px 14px;border-radius:18px;max-width:85%;font-size:14px;line-height:1.4;word-break:break-word}
.msg img,.msg video{max-width:100%;border-radius:12px;margin-top:5px;display:block}
.user{background:#ff2a8a;align-self:flex-end;border-bottom-right-radius:4px}
.bot{background:#2a2350;align-self:flex-start;border-bottom-left-radius:4px}
.bar{display:flex;align-items:center;gap:7px;padding:8px 8px 12px;background:#1a1033}
.ic{width:40px;height:40px;border-radius:50%;background:#2a2350;border:none;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.wrap{flex:1;background:#2a2350;border-radius:24px;display:flex;align-items:center;padding:0 14px}
.wrap input{flex:1;background:transparent;border:none;color:#fff;outline:none;padding:12px 0;font-size:15px}
.send{width:46px;height:46px;border-radius:50%;background:#ff2a8a;border:none;color:#fff;font-size:20px;cursor:pointer;flex-shrink:0}
.empty{text-align:center;padding:40px 20px;color:#666}
.lock{font-size:11px;color:#00ff88}
#login{position:fixed;inset:0;background:#0b0a1a;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;padding:20px;text-align:center}
#login input{padding:13px;width:100%;max-width:300px;border-radius:10px;border:1px solid #333;background:#1a1033;color:#fff;outline:none}
#login button{padding:13px 30px;border-radius:10px;border:none;background:#ff2a8a;color:#fff;font-weight:bold;cursor:pointer}
#loginErr{color:#ff6b6b;font-size:13px;min-height:18px}
</style>
</head>
<body>
<div id="login"><h2>MayorChatZ 🔥 🔒</h2><p style="color:#999">End-to-End Encrypted<br>Enter your name to join</p><input id="myName" placeholder="Your name e.g. Mayor"><button id="joinBtn">Join Chat 🚀</button><div id="loginErr"></div><p style="font-size:12px;color:#00ff88">🔒 Messages are end-to-end encrypted</p><button id="resetBtn" style="background:transparent;color:#888;font-size:12px;padding:5px">Having trouble? Tap here to clear &amp; retry</button></div>
<div class="h"><span>MayorChatZ 🔒</span><span id="meLabel"></span><button id="logoutBtn" style="background:#2a2350;color:#fff;border:none;padding:6px 10px;border-radius:8px;font-size:12px">Logout</button></div>
<div class="tabs">
 <div class="tab active" id="t0">Chats</div>
 <div class="tab" id="t1">Status</div>
 <div class="tab" id="t2">Groups</div>
</div>
<div class="list panel on" id="p0"><div id="chatList"></div></div>
<div class="panel" id="p1"><div id="statusList"></div><input type="file" id="sf" accept="image/*,video/*" hidden><button class="fab" id="statusBtn">+</button><button class="fab" id="statusCamBtn" style="bottom:90px;background:#00cec9">📷</button></div>
<div class="panel" id="p2"><div id="groupList"></div><button class="fab" id="groupBtn">+</button></div>
<div class="win" id="win">
 <div class="ch">
  <div id="backBtn" style="font-size:22px;cursor:pointer">←</div>
  <div class="av" id="ca">M</div>
  <div style="flex:1"><div id="cn" style="font-weight:bold">MayorChatZ Assistant</div><div style="font-size:11px"><span class="dot"></span> <span style="color:#00ff88" id="co">Online</span> • <span style="color:#aaa" id="cl">Last seen today at 10:35 PM</span><br><span class="lock">🔒 End-to-end encrypted</span></div></div>
 </div>
 <div class="msgs" id="msgs"></div>
 <div class="bar">
  <button class="ic" id="plusBtn">+</button>
  <input type="file" id="f" accept="image/*,video/*" hidden>
  <button class="ic" id="camBtn">📷</button>
  <div class="wrap"><input id="inp" placeholder="Type a message..."></div>
  <button class="send" id="sb">🎤</button>
 </div>
</div>
<script>
// Show any JS error on login screen so we fit see am
window.addEventListener('error', function(e){ var el=document.getElementById('loginErr'); if(el) el.textContent='Error: '+(e.message||'script error'); });
var socket = null;
try{ socket = io(); }catch(e){ socket = { on:function(){}, emit:function(){}, connected:false }; }
var cur=null, curName='', rec=null, chunks=[], isRec=false;
var me=null;
try{ me = localStorage.getItem('mc_me')? JSON.parse(localStorage.getItem('mc_me')) : null; }catch(e){ me=null; }
var allUsers=[], allGroups=[], allStatus=[], onlineIds=new Set();
var deliveredIds=new Set();
var lastMsgs={};
var myKeyPair=null, myPublicJWK=null;
function showErr(t){ var el=document.getElementById('loginErr'); if(el) el.textContent=t||''; }
function hardReset(){ try{ localStorage.removeItem('mc_me'); localStorage.removeItem('mc_keys'); }catch(e){} location.reload(); }
function b64(buf){ var s=''; var b=new Uint8Array(buf); for(var i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
function unb64(s){ var bin=atob(s); var b=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i); return b.buffer; }
async function getMyKeys(){
  try{
    if(!window.crypto ||!window.crypto.subtle) return null;
    var saved=null; try{ saved=localStorage.getItem('mc_keys'); }catch(e){}
    if(saved){
      try{
        var j=JSON.parse(saved);
        myKeyPair={ privateKey: await crypto.subtle.importKey('jwk', j.privateKey, {name:'ECDH', namedCurve:'P-256'}, false, ['deriveBits']), publicKey: await crypto.subtle.importKey('jwk', j.publicKey, {name:'ECDH', namedCurve:'P-256'}, true, []) };
        myPublicJWK=j.publicKey; return myPublicJWK;
      }catch(e){ try{ localStorage.removeItem('mc_keys'); }catch(e2){} }
    }
    myKeyPair=await crypto.subtle.generateKey({name:'ECDH', namedCurve:'P-256'}, true, ['deriveBits']);
    var pub=await crypto.subtle.exportKey('jwk', myKeyPair.publicKey);
    var priv=await crypto.subtle.exportKey('jwk', myKeyPair.privateKey);
    try{ localStorage.setItem('mc_keys', JSON.stringify({publicKey:pub, privateKey:priv})); }catch(e){}
    myPublicJWK=pub; return pub;
  }catch(e){ return null; }
}
async function sharedKeyFor(peerPublicJWK){
  if(!peerPublicJWK ||!myKeyPair) return null;
  var peerPub=await crypto.subtle.importKey('jwk', peerPublicJWK, {name:'ECDH', namedCurve:'P-256'}, true, []);
  var bits=await crypto.subtle.deriveBits({name:'ECDH', public:peerPub}, myKeyPair.privateKey, 256);
  return crypto.subtle.importKey('raw', bits, {name:'AES-GCM'}, false, ['encrypt','decrypt']);
}
async function encryptWithKey(aesKey, plainText){
  var iv=crypto.getRandomValues(new Uint8Array(12));
  var enc=await crypto.subtle.encrypt({name:'AES-GCM', iv:iv}, aesKey, new TextEncoder().encode(plainText));
  return {cipher:b64(enc), iv:b64(iv)};
}
async function decryptWithKey(aesKey, bundle){
  var dec=await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(bundle.iv)}, aesKey, unb64(bundle.cipher));
  return new TextDecoder().decode(dec);
}
async function encryptForUser(userId, plainText){
  var peer=allUsers.find(function(u){return u.id===userId;});
  if(!peer ||!peer.publicKey) return null;
  var key=await sharedKeyFor(peer.publicKey); if(!key) return null;
  return encryptWithKey(key, plainText);
}
async function decryptFromUser(senderId, bundle){
  var peer=allUsers.find(function(u){return u.id===senderId;});
  if(!peer ||!peer.publicKey) return null;
  var key=await sharedKeyFor(peer.publicKey); if(!key) return null;
  return decryptWithKey(key, bundle);
}
async function decryptOwn(recipientId, bundle){
  var peer=allUsers.find(function(u){return u.id===recipientId;});
  if(!peer ||!peer.publicKey) return null;
  var key=await sharedKeyFor(peer.publicKey);
  return decryptWithKey(key, bundle);
}
async function encryptTextForRecipients(ids, plainText){
  var out={};
  for(var i=0;i<ids.length;i++){ try{ var b=await encryptForUser(ids[i], plainText); if(b) out[ids[i]]=b; }catch(e){} }
  return out;
}
async function decryptMessage(m){
  if(m.text &&!m.encryptedFor) return m.text;
  if(!m.encryptedFor) return '[Encrypted message]';
  try{
    if(m.from===me.id){
      var bundle=m.encryptedFor[m.to] || m.encryptedFor[me.id] || m.encryptedFor[Object.keys(m.encryptedFor)[0]];
      if(!bundle) return '[🔒 Encrypted]';
      return await decryptOwn(m.to, bundle);
    } else {
      var b2=m.encryptedFor[me.id]; if(!b2) return '[🔒 Not for you]';
      return await decryptFromUser(m.from, b2);
    }
  }catch(e){ return '[🔒 Encrypted - could not decrypt]'; }
}
async function encryptFileFor(peerId, file){
  var peer=allUsers.find(function(u){return u.id===peerId;});
  if(!peer ||!peer.publicKey) throw new Error('Recipient has no key yet - ask them to Logout and Join again');
  var key=await sharedKeyFor(peer.publicKey);
  var buf=await file.arrayBuffer();
  var iv=crypto.getRandomValues(new Uint8Array(12));
  var enc=await crypto.subtle.encrypt({name:'AES-GCM', iv:iv}, key, buf);
  var combined=new Uint8Array(12+enc.byteLength); combined.set(iv,0); combined.set(new Uint8Array(enc),12);
  return new Blob([combined], {type:'application/octet-stream'});
}
async function decryptFileFor(senderId, url){
  var peer=allUsers.find(function(u){return u.id===senderId;});
  if(!peer ||!peer.publicKey) return url;
  try{
    var key=await sharedKeyFor(peer.publicKey);
    var buf=await fetch(url).then(function(r){return r.arrayBuffer();});
    if(buf.byteLength<13) return url;
    var dec=await crypto.subtle.decrypt({name:'AES-GCM', iv:buf.slice(0,12)}, key, buf.slice(12));
    return URL.createObjectURL(new Blob([dec]));
  }catch(e){ return url; }
}
function logout(){ try{ localStorage.removeItem('mc_me'); }catch(e){} location.reload(); }
function tab(i){ [0,1,2].forEach(function(n){ document.getElementById('t'+n).classList.toggle('active', n===i); document.getElementById('p'+n).classList.toggle('on', n===i); }); }
function doJoin(){ if(me && me.id && socket.emit) socket.emit('join', me.id, me.name); }
if(socket.on) socket.on('connect', doJoin);
// LOGIN FIRST - no crypto, no waiting. Keys generate in background after.
async function join(){
  var btn=document.getElementById('joinBtn');
  var name=document.getElementById('myName').value.trim();
  if(!name){ showErr('Enter your name first'); return; }
  showErr(''); if(btn){ btn.textContent='Joining... ⏳'; btn.disabled=true; }
  try{
    var oldId = me? me.id : ('u'+Date.now()+'_'+Math.floor(Math.random()*100000));
    var r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name, id:oldId, publicKey:null})});
    if(!r.ok) throw new Error('Server error '+r.status+' - Render dey wake up, wait 20 secs and try again');
    me=await r.json(); try{ localStorage.setItem('mc_me', JSON.stringify(me)); }catch(e){}
    document.getElementById('login').style.display='none';
    document.getElementById('meLabel').textContent='Hi, '+me.name;
    doJoin(); loadUsers();
    // Background: generate E2EE keys and upload public key
    getMyKeys().then(function(pub){
      if(!pub) return;
      fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:me.name, id:me.id, publicKey:pub})}).catch(function(){});
    });
  }catch(e){
    showErr('Login failed: '+e.message);
    alert('Login failed: '+e.message);
  } finally { if(btn){ btn.textContent='Join Chat 🚀'; btn.disabled=false; } }
}
document.getElementById('joinBtn').addEventListener('click', join);
document.getElementById('resetBtn').addEventListener('click', hardReset);
document.getElementById('logoutBtn').addEventListener('click', logout);
document.getElementById('t0').addEventListener('click', function(){tab(0);});
document.getElementById('t1').addEventListener('click', function(){tab(1);});
document.getElementById('t2').addEventListener('click', function(){tab(2);});
document.getElementById('myName').addEventListener('keydown', function(e){ if(e.key==='Enter') join(); });
if(me){
  document.getElementById('login').style.display='none';
  document.getElementById('meLabel').textContent='Hi, '+me.name;
  getMyKeys().then(function(pub){
    if(pub) fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:me.name, id:me.id, publicKey:pub})}).catch(function(){});
  });
  doJoin(); loadUsers();
}
async function loadUsers(){
  try{ allUsers=await fetch('/api/users').then(function(r){return r.json();}); allGroups=await fetch('/api/groups').then(function(r){return r.json();}); allStatus=await fetch('/api/status').then(function(r){return r.json();}); }catch(e){}
  var listDiv=document.getElementById('chatList');
  var html='<div class="item" data-chat="assistant"><div class="av">M<span class="online-dot"></span></div><div><div class="nm">MayorChatZ Assistant ●</div><div class="lt">FREE AI Online - Tap to chat...</div></div><div class="tm">now</div></div>';
  var others=allUsers.filter(function(u){return u.id!==me.id;});
  if(others.length===0){ html+='<div class="empty">No other users yet.<br>Share your link make friends join!</div>'; }
  else{
    others.forEach(function(u){
      var isOnline=onlineIds.has(u.id)||u.online;
      var preview=lastMsgs[u.id]||'🔒 Tap to chat - End-to-end encrypted';
      html+='<div class="item" data-chat="'+u.id+'" data-name="'+u.name.replace(/"/g,'')+'"><div class="av">'+(u.name[0]||'M').toUpperCase()+(isOnline?'<span class="online-dot"></span>':'')+'</div><div><div class="nm">'+u.name+' 🔒</div><div class="lt">'+preview+'</div></div><div class="tm">'+(isOnline?'online':'offline')+'</div></div>';
    });
  }
  listDiv.innerHTML=html;
  listDiv.querySelectorAll('.item').forEach(function(el){ el.addEventListener('click', function(){ openChat(el.getAttribute('data-chat'), el.getAttribute('data-name')||'MayorChatZ Assistant'); }); });
  renderGroups(); renderStatus();
}
function renderGroups(){
  var g=document.getElementById('groupList');
  if(allGroups.length===0){ g.innerHTML='<div class="empty">No groups yet. Click + to create group!</div>'; return; }
  g.innerHTML=allGroups.map(function(gr){ return '<div class="item" data-chat="'+gr.id+'" data-name="'+gr.name.replace(/"/g,'')+'"><div class="av" style="background:#fdcb6e">👑</div><div><div class="nm">'+gr.name+' 🔒</div><div class="lt">'+(gr.desc||'Group chat')+'</div></div></div>'; }).join('');
  g.querySelectorAll('.item').forEach(function(el){ el.addEventListener('click', function(){ openChat(el.getAttribute('data-chat'), el.getAttribute('data-name')); }); });
}
async function renderStatus(){
  var s=document.getElementById('statusList');
  if(allStatus.length===0){ s.innerHTML='<div class="empty">No status yet. Click + for text or 📷 for photo/video!</div>'; return; }
  var html='';
  for(var i=0;i<allStatus.length;i++){
    var st=allStatus[i]; var txt=st.text||'';
    if(st.encryptedFor && st.encryptedFor[me.id]){ try{ txt=await decryptFromUser(st.from, st.encryptedFor[me.id]); }catch(e){} }
    html+='<div class="item"><div class="av">'+(st.name||'M')[0]+'</div><div><div class="nm">'+st.name+' 🔒</div><div class="lt">'+txt+'</div></div></div>';
  }
  s.innerHTML=html;
}
async function createGroup(){ var name=prompt('Group name?'); if(!name) return; var last=prompt('Group description?')||'New group created'; await fetch('/api/groups',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name,desc:last,members:1,createdBy:me.name})}); loadUsers(); tab(2); }
document.getElementById('groupBtn').addEventListener('click', createGroup);
async function postStatus(){ var text=prompt('Wetin you wan post for status? (Encrypted)'); if(!text) return; var ids=allUsers.map(function(u){return u.id;}); var enc=await encryptTextForRecipients(ids, text); await fetch('/api/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:me.name, encryptedFor:enc, text:'🔒 Encrypted Status'})}); loadUsers(); tab(1); alert('Encrypted Status posted! 🔒'); }
document.getElementById('statusBtn').addEventListener('click', postStatus);
document.getElementById('statusCamBtn').addEventListener('click', function(){ document.getElementById('sf').click(); });
document.getElementById('sf').addEventListener('change', function(){ alert('Status photo/video is uploaded encrypted.'); this.value=''; });
async function renderOne(m, cls){
  var txt=await decryptMessage(m); var media='';
  if(m.file){
    if(m.isEncryptedFile){ var url=await decryptFileFor(m.from===me.id? m.to : m.from, m.file); if(m.fileType && m.fileType.indexOf('video')===0) media='<video controls src="'+url+'" playsinline></video>'; else if(m.fileType && m.fileType.indexOf('audio')===0) media='<audio controls src="'+url+'" style="width:180px"></audio>'; else media='<img src="'+url+'">'; }
    else { if(m.fileType && m.fileType.indexOf('video')===0) media='<video controls src="'+m.file+'" playsinline></video>'; else if(m.fileType && m.fileType.indexOf('audio')===0) media='<audio controls src="'+m.file+'" style="width:180px"></audio>'; else media='<img src="'+m.file+'">'; }
  }
  return '<div class="msg '+cls+'">'+(txt||'')+media+'</div>';
}
async function openChat(id, name){
  cur=id; curName=name;
  document.getElementById('win').classList.add('on');
  document.getElementById('cn').textContent=name;
  document.getElementById('ca').textContent=name[0];
  document.getElementById('cl').textContent = id==='assistant'? 'Last seen today at 10:35 PM' : 'Last seen just now';
  var ms=document.getElementById('msgs');
  if(id==='assistant'){ ms.innerHTML='<div class="msg bot">Hello Boss! 🔥 I be MayorChatZ! FREE AI don live! Ask me anything!</div>'; return; }
  var isGroup=allGroups.some(function(g){return g.id===id;});
  if(isGroup){ ms.innerHTML='<div class="msg bot">🔒 Group chat with '+name+'.<br>Messag
