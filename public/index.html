<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MayorchatzZ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#111;color:#fff}
header{background:#075E54;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;font-weight:bold}
#logout{background:#f15a29;border:none;padding:6px 12px;border-radius:5px;color:#fff;font-weight:bold}
#auth{padding:25px}
input{width:100%;padding:13px;margin:8px 0;border-radius:10px;border:none;font-size:15px}
button.main{width:100%;padding:13px;background:#25D366;border:none;border-radius:10px;font-weight:bold;color:#000;font-size:16px;margin-top:10px}
#chat{display:none;flex-direction:column;height:calc(100vh - 52px)}
#msgs{flex:1;overflow-y:auto;padding:15px;background:#0b141a}
.msg{margin:8px 0;padding:10px 14px;border-radius:10px;max-width:80%;word-break:break-word}
.me{background:#005c4b;margin-left:auto}
.other{background:#202c33}
#inputArea{display:flex;padding:10px;background:#202c33;gap:8px}
#inputArea input{flex:1;margin:0}
#inputArea button{width:75px;background:#25D366;border:none;border-radius:8px;font-weight:bold}
#online{font-size:13px;padding:8px 15px;background:#202c33;border-bottom:1px solid #333}
a{color:#25D366}
small{font-size:11px;opacity:.6}
</style>
</head>
<body>
<header><span>MayorchatzZ 🔥</span><button id="logout" onclick="logout()" style="display:none">Logout</button></header>
<div id="auth">
<h2 id="formTitle" style="margin-bottom:15px">Create Account</h2>
<input id="name" placeholder="Your Name">
<input id="phone" placeholder="Phone Number">
<input id="pass" type="password" placeholder="Password">
<button class="main" onclick="doAuth()" id="authBtn">Signup</button>
<p style="margin-top:15px;text-align:center"><span id="toggleText">Already have account?</span> <a href="#" onclick="toggleForm()">Login</a></p>
</div>
<div id="chat">
<div id="online">Loading online...</div>
<div id="msgs"></div>
<div id="inputArea">
<input id="msgInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendMsg()">
<button onclick="sendMsg()">Send</button>
</div>
</div>
<script>
let isLogin=false;let currentUser=localStorage.getItem('mayorUser');
function checkAuth(){if(currentUser){document.getElementById('auth').style.display='none';document.getElementById('chat').style.display='flex';document.getElementById('logout').style.display='block';loadMsgs();loadUsers();}}
checkAuth();
function toggleForm(){isLogin=!isLogin;document.getElementById('formTitle').innerText=isLogin?'Login':'Signup';document.getElementById('authBtn').innerText=isLogin?'Login':'Signup';document.getElementById('toggleText').innerText=isLogin?"Don't have account?":"Already have account?";document.getElementById('name').style.display=isLogin?'none':'block';}
async function doAuth(){
let name=document.getElementById('name').value.trim();
let phone=document.getElementById('phone').value.trim();
let password=document.getElementById('pass').value.trim();
if(!phone||!password||(!isLogin&&!name))return alert('Fill all fields');
let url=isLogin?'/api/login':'/api/signup';
let body=isLogin?{phone,password}:{name,phone,password};
let res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
let data=await res.json();
if(data.error)return alert(data.error=='exists'?'Phone already exists':'Wrong phone or password');
localStorage.setItem('mayorUser',isLogin?data.name:name);location.reload();
}
async function loadMsgs(){
let res=await fetch('/api/messages');let msgs=await res.json();
let box=document.getElementById('msgs');box.innerHTML='';
msgs.forEach(m=>{
let d=document.createElement('div');d.className='msg '+(m.user===currentUser?'me':'other');
d.innerHTML=`<b>${m.user}</b><br>${m.text}<br><small>${m.time}</small>`;
box.appendChild(d);
});box.scrollTop=box.scrollHeight;
}
async function loadUsers(){
let res=await fetch('/api/users');let users=await res.json();
document.getElementById('online').innerText='Online: '+(users.map(u=>u.name).join(', ')||'Only you');
}
async function sendMsg(){
let text=document.getElementById('msgInput').value.trim();if(!text)return;
await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:currentUser,text})});
document.getElementById('msgInput').value='';loadMsgs();
}
function logout(){localStorage.removeItem('mayorUser');location.reload();}
setInterval(()=>{if(currentUser){loadMsgs();loadUsers();}},3000);
</script>
</body>
  </html>
