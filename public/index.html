<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MayorChatZ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#111b21;color:#fff;height:100vh;display:flex;flex-direction:column}
.top{display:flex;background:#202c33;padding:12px;gap:20px}
.top b{color:#8696a0;cursor:pointer}.top b.active{color:#00a884;border-bottom:3px solid #00a884;padding-bottom:6px}
#chats{flex:1;overflow-y:auto;padding:10px;background:#0b141a}
.msg{max-width:75%;padding:8px 10px;border-radius:8px;margin:6px 0;word-wrap:break-word;position:relative}
.own{background:#005c4b;margin-left:auto}.other{background:#202c33}
.small{font-size:10px;opacity:.6;float:right;margin:4px 0 0 8px}
.bottom{display:flex;align-items:center;gap:8px;padding:10px;background:#202c33}
.bottom input{flex:1;padding:12px;border-radius:25px;border:none;background:#2a3942;color:white;outline:none}
.btn{width:45px;height:45px;border-radius:50%;background:#00a884;display:flex;align-items:center;justify-content:center;cursor:pointer}
</style>
</head>
<body>
<div class="top"><b class="active">Chats</b><b>Status</b><b>Groups</b><span id="online" style="margin-left:auto;font-size:12px;color:#00a884"></span></div>
<div id="chats"></div>
<div class="bottom">
<input id="msgInput" placeholder="Type a message">
<div class="btn" id="sendBtn">➤</div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();
const chats=document.getElementById('chats');
const input=document.getElementById('msgInput');
const sendBtn=document.getElementById('sendBtn');

function addMsg(m){
 if(document.getElementById('mid-'+m.mid)) return; // ANTI-DUPLICATE
 const d=document.createElement('div');
 d.id='mid-'+m.mid;
 d.className='msg '+(m.id===socket.id?'own':'other');
 d.innerHTML=`${m.text}<span class="small">${m.time} ${m.ticks||'✓✓'}</span>`;
 d.ondblclick=()=>{ if(m.id===socket.id && confirm('Delete?')) socket.emit('deleteMsg',m.mid); };
 d.oncontextmenu=(e)=>{ e.preventDefault(); if(m.id===socket.id) socket.emit('deleteMsg',m.mid); };
 chats.appendChild(d);
 chats.scrollTop=chats.scrollHeight;
}
socket.on('history',arr=>{ chats.innerHTML=''; arr.forEach(addMsg); });
socket.on('message',addMsg);
socket.on('deleteMsg',mid=>{ let el=document.getElementById('mid-'+mid); if(el) el.remove(); });
socket.on('online',n=>document.getElementById('online').innerText=n+' online');

function send(){
 let t=input.value.trim(); if(!t) return;
 socket.emit('message',{text:t}); input.value='';
}
sendBtn.onclick=send;
input.addEventListener('keydown',e=>{ if(e.key==='Enter') send(); });
</script>
</body>
</html>
