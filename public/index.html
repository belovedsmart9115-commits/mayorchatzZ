<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MayorChatZ</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.png">
<meta name="theme-color" content="#ff2e8a">
<script>
function join(){
  try{
    var input=document.getElementById('myName');
    var name=input?input.value.trim():'';
    if(!name){alert('Enter your name first');return;}
    var btn=document.getElementById('joinBtn');
    if(btn){btn.textContent='Joining...';btn.disabled=true;}
    var oldId=null;
    try{var s=localStorage.getItem('mc_me'); if(s) oldId=JSON.parse(s).id;}catch(e){}
    if(!oldId) oldId='u'+Date.now()+'_'+Math.floor(Math.random()*100000);
    fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name,id:oldId,publicKey:null})})
  .then(function(r){if(!r.ok) throw new Error('Server '+r.status); return r.json();})
  .then(function(me){
      try{localStorage.setItem('mc_me',JSON.stringify(me));}catch(e){}
      try{sessionStorage.setItem('mc_me',JSON.stringify(me));}catch(e){}
      window.me=me;
      document.getElementById('login').style.display='none';
      document.getElementById('meLabel').textContent='Hi, '+me.name;
      if(typeof doJoin==='function') doJoin();
      if(typeof loadUsers==='function') loadUsers();
      if(btn){btn.textContent='Join Chat';btn.disabled=false;}
    })
  .catch(function(e){alert('Login failed: '+e.message); if(btn){btn.textContent='Join Chat';btn.disabled=false;}});
  }catch(e){alert('Join error: '+e.message);}
}
function hardReset(){try{localStorage.removeItem('mc_me');sessionStorage.removeItem('mc_me');}catch(e){} location.reload();}
</script>
<script src="/socket.io/socket.io.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0b0a1a;color:#fff;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.h{background:#1a1033;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2a2350;font-weight:bold}
.tabs{display:flex;background:#1a1033}
.tab{flex:1;padding:13px;text-align:center;color:#888;cursor:pointer;border-bottom:3px solid transparent;font-size:14px}
.tab.active{color:#ff2a8a;border-bottom-color:#ff2a8a}
.fab{position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:#ff2a8a;color:#fff;border:none;font-size:28px;cursor:pointer;z-index:5}
.list{flex:1;overflow:auto}
.item{display:flex;gap:12px;padding:13px;border-bottom:1px solid #15122e;cursor:pointer;align-items:center}
.av{width:46px;height:46px;border-radius:50%;background:#ff2a8a;display:flex;align-items:center;justify-content:center;font-weight:bold;flex-shrink:0}
.nm{font-weight:bold;font-size:15px}
.lt{color:#999;font-size:13px;margin-top:3px}
.tm{font-size:11px;color:#888;margin-left:auto}
.panel{display:none;flex:1;overflow:auto}
.panel.on{display:block}
.win{display:none;flex-direction:column;height:100dvh;position:fixed;inset:0;background:#0b0a1a;z-index:99}
.win.on{display:flex}
.ch{background:#1a1033;padding:10px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #2a2350}
.msgs{flex:1;overflow:auto;padding:15px;display:flex;flex-direction:column;gap:10px;background:#0f0d24}
.msg{padding:10px 14px;border-radius:18px;max-width:85%;font-size:14px;line-height:1.4;word-break:break-word;white-space:pre-wrap}
.msg video,.msg img{max-width:100%;border-radius:10px;margin-top:5px;display:block}
.user{background:#ff2a8a;align-self:flex-end;border-bottom-right-radius:4px}
.bot{background:#2a2350;align-self:flex-start;border-bottom-left-radius:4px}
.bar{display:flex;align-items:center;gap:7px;padding:8px 8px 12px;background:#1a1033}
.ic{width:40px;height:40px;border-radius:50%;background:#2a2350;border:none;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.wrap{flex:1;background:#2a2350;border-radius:24px;display:flex;align-items:center;padding:0 14px}
.wrap input{flex:1;background:transparent;border:none;color:#fff;outline:none;padding:12px 0;font-size:15px}
.send{width:46px;height:46px;border-radius:50%;background:#ff2a8a;border:none;color:#fff;font-size:20px;cursor:pointer;flex-shrink:0}
.empty{text-align:center;padding:40px 20px;color:#666}
#login{position:fixed;inset:0;background:#0b0a1a;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;padding:20px;text-align:center}
#login input{padding:13px;width:100%;max-width:300px;border-radius:10px;border:1px solid #333;background:#1a1033;color:#fff;outline:none}
#login button{padding:13px 30px;border-radius:10px;border:none;background:#ff2a8a;color:#fff;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div id="login"><h2>MayorChatZ 🔥</h2><p style="color:#999">Enter your name to join</p><input id="myName" placeholder="Your name e.g. Mayor"><button id="joinBtn" onclick="join()">Join Chat 🚀</button><button onclick="hardReset()" style="background:transparent!important;color:#888!important;font-size:12px;padding:5px">Having trouble? Tap here to clear & retry</button></div>
<div class="h"><span>MayorChatZ</span><span id="meLabel"></span><button onclick="try{localStorage.removeItem('mc_me');sessionStorage.removeItem('mc_me');location.reload();}catch(e){}" style="background:#2a2350;color:#fff;border:none;padding:6px 10px;border-radius:8px;font-size:12px">Logout</button></div>
<div class="tabs"><div class="tab active" id="t0" onclick="tab(0)">Chats</div><div class="tab" id="t1" onclick="tab(1)">Status</div><div class="tab" id="t2" onclick="tab(2)">Groups</div></div>
<div class="list panel on" id="p0"><div id="chatList"><div class="empty">Loading chats...</div></div></div>
<div class="panel" id="p1"><div id="statusList"></div><input type="file" id="sf2" accept="image/*,video/*" hidden onchange="postStatusMedia(this)"><button class="fab" onclick="postStatus()">+</button><button class="fab" onclick="document.getElementById('sf2').click()" style="bottom:90px;background:#00cec9">📷</button></div>
<div class="panel" id="p2"><div id="groupList"></div><button class="fab" onclick="createGroup()">+</button></div>
<div class="win" id="win">
 <div class="ch"><div style="font-size:22px;cursor:pointer" onclick="closeChat()">←</div><div class="av" id="ca">M</div><div style="flex:1"><div id="cn" style="font-weight:bold">MayorChatZ Assistant</div><div style="font-size:11px;color:#00ff88">Online</div></div></div>
 <div class="msgs" id="msgs"></div>
 <div class="bar"><button class="ic" onclick="document.getElementById('f').click()">+</button><input type="file" id="f" accept="image/*,video/*" hidden onchange="sendPic(this)"><button class="ic" onclick="document.getElementById('f').click()">📷</button><div class="wrap"><input id="inp" placeholder="Type a message..." onkeydown="if(event.key==='Enter')go()"></div><button class="send" id="sb" onclick="go()">➤</button></div>
</div>
<script>
var socket=null; try{socket=io();}catch(e){socket={on:function(){},emit:function(){}};}
var cur=null, curName=''; var me=null;
try{me=localStorage.getItem('mc_me')?JSON.parse(localStorage.getItem('mc_me')):null;}catch(e){me=null;}
if(!me){try{me=sessionStorage.getItem('mc_me')?JSON.parse(sessionStorage.getItem('mc_me')):null;}catch(e){me=null;}}
var allUsers=[], allGroups=[], allStatus=[];
function tab(i){document.getElementById('t0').className='tab'+(i===0?' active':'');document.getElementById('t1').className='tab'+(i===1?' active':'');document.getElementById('t2').className='tab'+(i===2?' active':'');document.getElementById('p0').className='list panel'+(i===0?' on':'');document.getElementById('p1').className='panel'+(i===1?' on':'');document.getElementById('p2').className='panel'+(i===2?' on':'');}
function doJoin(){if(me&&me.id&&socket.emit) socket.emit('join',me.id,me.name);}
if(socket.on) socket.on('connect',doJoin);
if(me){document.getElementById('login').style.display='none';document.getElementById('meLabel').textContent='Hi, '+me.name;doJoin();loadUsers();}
function esc(s){return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function mediaHtml(m){
  if(!m.file) return '';
  if(m.fileType && m.fileType.indexOf('video')===0) return '<video controls playsinline src="'+m.file+'" style="max-width:100%;border-radius:10px;margin-top:5px"></video>';
  if(m.fileType && m.fileType.indexOf('audio')===0) return '<audio controls src="'+m.file+'"></audio>';
  return '<img src="'+m.file+'" style="max-width:100%;border-radius:10px;margin-top:5px">';
}
function loadUsers(){
  fetch('/api/users').then(function(r){return r.json();}).then(function(u){allUsers=u||[];return fetch('/api/groups').then(function(r){return r.json();});}).then(function(g){allGroups=g||[];return fetch('/api/status').then(function(r){return r.json();});}).then(function(s){allStatus=s||[];renderAll();}).catch(function(){renderAll();});
}
function renderAll(){
  var html='<div class="item" onclick="openChat(\'assistant\',\'MayorChatZ Assistant\')"><div class="av">M</div><div><div class="nm">MayorChatZ Assistant</div><div class="lt">FREE AI Online - Tap to chat...</div></div><div class="tm">now</div></div>';
  var others=[]; for(var i=0;i<allUsers.length;i++){if(!me||allUsers[i].id!==me.id) others.push(allUsers[i]);}
  if(others.length===0){html+='<div class="empty">No other users yet.<br>Share your link make friends join!</div>';}
  else{for(var j=0;j<others.length;j++){var u=others[j];html+='<div class="item" onclick="openChat(\''+u.id+'\',\''+esc(u.name).replace(/'/g,'')+'\')"><div class="av">'+esc((u.name||'M')[0]).toUpperCase()+'</div><div><div class="nm">'+esc(u.name)+'</div><div class="lt">Tap to chat</div></div><div class="tm">online</div></div>';}}
  document.getElementById('chatList').innerHTML=html;
  var gHtml=''; if(allGroups.length===0){gHtml='<div class="empty">No groups yet. Click + to create group!</div>';} else{for(var k=0;k<allGroups.length;k++){var gr=allGroups[k];gHtml+='<div class="item" onclick="openChat(\''+gr.id+'\',\''+esc(gr.name).replace(/'/g,'')+'\')"><div class="av">G</div><div><div class="nm">'+esc(gr.name)+'</div><div class="lt">'+esc(gr.desc||'Group chat')+'</div></div></div>';}}
  document.getElementById('groupList').innerHTML=gHtml;
  var sHtml=''; if(allStatus.length===0){sHtml='<div class="empty">No status yet. Click + to post!</div>';} else{for(var s=0;s<allStatus.length;s++){var st=allStatus[s];sHtml+='<div class="item"><div class="av">'+esc((st.name||'M')[0])+'</div><div><div class="nm">'+esc(st.name)+'</div><div class="lt">'+esc(st.text||'')+mediaHtml(st)+'</div></div></div>';}}
  document.getElementById('statusList').innerHTML=sHtml;
}
function openChat(id,name){
  cur=id; curName=name;
  document.getElementById('win').className='win on';
  document.getElementById('cn').textContent=name;
  document.getElementById('ca').textContent=name[0]||'M';
  var ms=document.getElementById('msgs');
  if(id==='assistant'){ms.innerHTML='<div class="msg bot">Hello Boss! I be MayorChatZ! FREE AI don live! Ask me anything!</div>';return;}
  var isGroup=false; for(var i=0;i<allGroups.length;i++){if(allGroups[i].id===id) isGroup=true;}
  if(isGroup){ms.innerHTML='<div class="msg bot">Group chat with '+esc(name)+'.</div>';return;}
  fetch('/api/messages?from='+me.id+'&to='+id).then(function(r){return r.json();}).then(function(msgs){
    if(!msgs||msgs.length===0){ms.innerHTML='<div class="msg bot">You don open chat with '+esc(name)+'. Send message now!</div>';return;}
    var h=''; for(var i=0;i<msgs.length;i++){var m=msgs[i]; h+='<div class="msg '+(m.from===me.id?'user':'bot')+'">'+esc(m.text||'')+mediaHtml(m)+'</div>';}
    ms.innerHTML=h;
  }).catch(function(){ms.innerHTML='<div class="msg bot">Chat with '+esc(name)+' started.</div>';});
  ms.scrollTop=99999;
}
function closeChat(){document.getElementById('win').className='win'; loadUsers();}
function go(){
  var inp=document.getElementById('inp'); var t=inp.value.trim(); if(!t) return;
  var ms=document.getElementById('msgs');
  if(cur==='assistant'){
    ms.innerHTML+='<div class="msg user">'+esc(t)+'</div>'; inp.value=''; ms.scrollTop=99999;
    fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})}).then(function(r){return r.json();}).then(function(d){ms.innerHTML+='<div class="msg bot">'+esc(d.reply||'No reply')+'</div>'; ms.scrollTop=99999;}).catch(function(){ms.innerHTML+='<div class="msg bot">Network slow Boss, try again</div>';});
  } else {
    socket.emit('send-message',{from:me.id,fromName:me.name,to:cur,text:t,fileType:'text'});
    inp.value='';
  }
  ms.scrollTop=99999;
}
function sendPic(inp){
  if(!inp.files[0]) return;
  if(!cur||cur==='assistant'){alert('Open a person chat first!'); inp.value=''; return;}
  var file=inp.files[0]; var fd=new FormData(); fd.append('file',file);
  var ms=document.getElementById('msgs');
  var localUrl=URL.createObjectURL(file);
  var media=file.type.indexOf('video')===0?'<video controls playsinline src="'+localUrl+'" style="max-width:100%;border-radius:10px"></video>':file.type.indexOf('audio')===0?'<audio controls src="'+localUrl+'"></audio>':'<img src="'+localUrl+'" style="max-width:100%;border-radius:10px">';
  ms.innerHTML+='<div class="msg user">'+media+'</div>'; ms.scrollTop=99999;
  fetch('/api/upload',{method:'POST',body:fd}).then(function(r){return r.json();}).then(function(d){
    socket.emit('send-message',{from:me.id,fromName:me.name,to:cur,text:file.type.indexOf('video')===0?'🎬 Video':'📷 Photo',file:d.url,fileType:file.type});
  }).catch(function(){alert('Upload failed - file too big? Try under 50MB');});
  inp.value='';
}
function createGroup(){var name=prompt('Group name?'); if(!name) return; fetch('/api/groups',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name,desc:'New group created',members:1,createdBy:me.name})}).then(function(){loadUsers(); tab(2);});}
function postStatus(){var text=prompt('Wetin you wan post for status?'); if(!text) return; fetch('/api/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:me.name,text:text})}).then(function(){loadUsers(); tab(1); alert('Status posted!');});}
function postStatusMedia(inp){
  if(!inp.files[0]) return;
  var file=inp.files[0]; var fd=new FormData(); fd.append('file',file);
  fetch('/api/upload',{method:'POST',body:fd}).then(function(r){return r.json();}).then(function(d){
    return fetch('/api/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:me.name,text:file.type.indexOf('video')===0?'🎬 Video Status':'📷 Photo Status',file:d.url,fileType:file.type})});
  }).then(function(){loadUsers(); tab(1); alert('Status media posted!');}).catch(function(){alert('Upload failed');});
  inp.value='';
}
if(socket.on){
  socket.on('users-changed',function(){loadUsers();});
  socket.on('online-users',function(){loadUsers();});
  socket.on('new-message',function(m){
    if(!m) return;
    if(m.from!==me.id&&m.to!==me.id) return;
    var isOpen=document.getElementById('win').className.indexOf('on')!==-1;
    if(isOpen&&(cur===m.from||cur===m.to)){
      var ms=document.getElementById('msgs');
      // Avoid duplicate of own photo we already showed locally
      if(m.from===me.id && m.file){
        // Still show server copy for other devices, but skip if last msg already has it
        // We show it - duplicate is better than missing
      }
      ms.innerHTML+='<div class="msg '+(m.from===me.id?'user':'bot')+'">'+esc(m.text||'')+mediaHtml(m)+'</div>';
      ms.scrollTop=99999;
    }
    loadUsers();
  });
  socket.on('new-group',function(){loadUsers();});
  socket.on('new-status',function(){loadUsers();});
}
</script>
</body>
                                                                                                                                                                                                                                                                                                                                                                                 </html>
