<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MayorChatZ</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial}
:root{--pink:#ff2e88;--purple:#2a0a4a;--purple2:#4b0f7a;--pink-light:#ff6fb0}
body{background:linear-gradient(135deg,#2a0a4a 0%,#4b0f7a 40%,#ff2e88 100%);height:100vh;overflow:hidden;color:#fff}
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;background:linear-gradient(135deg,#2a0a4a,#ff2e88)}
.login-box{background:rgba(255,255,255,.95);color:#2a0a4a;padding:30px;border-radius:24px;width:92%;max-width:380px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.login-box h1{font-size:38px;background:linear-gradient(90deg,#ff2e88,#4b0f7a);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-box p{margin:8px 0 18px;color:#666}
.login-box input{width:100%;padding:14px;border:2px solid #ff2e88;border-radius:14px;outline:none;font-size:16px}
.login-box button{width:100%;margin-top:14px;padding:14px;border:none;border-radius:14px;background:linear-gradient(90deg,#ff2e88,#4b0f7a);color:#fff;font-size:17px;font-weight:700;cursor:pointer}
#app{display:none;height:100vh;flex-direction:column}
header{background:rgba(42,10,74,.95);padding:10px 12px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--pink)}
header h2{font-size:20px}header h2 span{color:var(--pink-light)}
#online{font-size:12px;color:#a7f3d0}
.top-btns{margin-left:auto;display:flex;gap:6px}
.top-btns button{border:none;padding:8px 10px;border-radius:20px;cursor:pointer;font-weight:700}
.btn-status{background:#ff2e88;color:#fff}.btn-group{background:#fff;color:#4b0f7a}.btn-dark{background:#111;color:#fff}
#tabs{display:flex;background:#1e0733}
#tabs button{flex:1;padding:12px;border:none;background:transparent;color:#bbb;font-weight:700;cursor:pointer}
#tabs button.active{background:#ff2e88;color:#fff}
#main{flex:1;display:flex;overflow:hidden}
#sidebar{width:280px;background:#fff;color:#222;overflow-y:auto;border-right:3px solid #ff2e88}
.chat-item{padding:12px;display:flex;gap:10px;align-items:center;cursor:pointer;border-bottom:1px solid #eee}
.chat-item.active{background:#ffe0ee}
.avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#ff2e88,#4b0f7a);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex-shrink:0}
.chat-item small{color:#888}
#chatArea{flex:1;display:flex;flex-direction:column;background:#f5e6ff}
#chatHeader{background:#fff;color:#222;padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:2px solid #ff2e88}
#messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:75%;padding:10px 12px;border-radius:16px;position:relative;font-size:15px;line-height:1.4;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,#ff2e88,#ff6fb0);color:#fff;border-bottom-right-radius:4px}
.msg.other{align-self:flex-start;background:#fff;color:#222;border-bottom-left-radius:4px}
.msg.assistant{align-self:flex-start;background:#2a0a4a;color:#fff;border:2px solid #ff2e88}
.msg b{display:block;font-size:12px;margin-bottom:3px;color:#ff2e88}
.msg.me b{color:#ffe0ee}.msg.assistant b{color:#ff6fb0}
.msg.time{font-size:10px;opacity:.7;text-align:right;margin-top:4px}
.msg img,.msg video{max-width:100%;border-radius:10px;margin-top:6px}
#typing{padding:4px 14px;font-size:12px;color:#4b0f7a;font-style:italic;height:18px}
#inputBar{display:flex;gap:8px;padding:10px;background:#fff;align-items:center}
#inputBar input[type=text]{flex:1;padding:12px;border:2px solid #e5b8ff;border-radius:25px;outline:none}
#inputBar button{border:none;width:44px;height:44px;border-radius:50%;cursor:pointer;font-size:18px}
#sendBtn{background:linear-gradient(135deg,#ff2e88,#4b0f7a);color:#fff}
#statusPanel{display:none;padding:14px;overflow-y:auto;background:#fff;color:#222}
.status-card{background:linear-gradient(135deg,#ffe0ee,#e9d5ff);padding:12px;border-radius:16px;margin-bottom:10px;border-left:5px solid #ff2e88}
#statusForm{display:flex;gap:8px;margin-bottom:14px}
#statusForm input{flex:1;padding:10px;border:2px solid #ff2e88;border-radius:12px}
#statusForm button{padding:10px 14px;background:#ff2e88;color:#fff;border:none;border-radius:12px;font-weight:700}
body.dark #chatArea{background:#1a0a2e}body.dark #sidebar{background:#220b3d;color:#fff}body.dark.chat-item{border-color:#3b1a5e}body.dark #chatHeader{background:#220b3d;color:#fff}body.dark.msg.other{background:#2a0a4a;color:#fff}body.dark #inputBar{background:#220b3d}body.dark #statusPanel{background:#220b3d;color:#fff}
@media(max-width:700px){#sidebar{display:none}#sidebar.show{display:block;position:fixed;left:0;top:0;bottom:0;z-index:20;width:85%}}
</style>
</head>
<body>
<div id="login"><div class="login-box"><h1>MayorChatZ 💖</h1><p>Hot Pink x Dark Purple Chat</p><input id="nameInput" placeholder="Enter your name..."><button onclick="joinChat()">Enter Chat 🚀</button><p style="font-size:12px">Status • Group Chat • Assistant • Voice</p></div></div>

<div id="app">
<header><div><h2>MayorChatZ <span>💖</span></h2><div id="online">● 0 online</div></div><div class="top-btns"><button class="btn-status" onclick="showTab('chats')">💬 Chats</button><button class="btn-status" onclick="showTab('status')">📸 Status</button><button class="btn-dark" onclick="toggleDark()">🌙</button></div></header>
<div id="tabs"><button id="tabChats" class="active" onclick="showTab('chats')">Chats</button><button id="tabStatus" onclick="showTab('status')">Status</button></div>
<div id="main">
<div id="sidebar"></div>
<div id="chatArea">
<div id="chatHeader"><button onclick="document.getElementById('sidebar').classList.toggle('show')" style="border:none;background:#ff2e88;color:#fff;padding:6px 10px;border-radius:8px">☰</button><div class="avatar" id="chatAvatar">M</div><div><b id="chatName">MayorChatZ Assistant</b><div style="font-size:12px;color:#22c55e" id="chatSub">Tap a chat to start • Online</div></div></div>
<div id="messages"></div><div id="typing"></div>
<div id="inputBar"><label style="cursor:pointer;font-size:22px">📎<input type="file" id="fileInput" hidden onchange="uploadFile(this)"></label><button onclick="startVoice()" title="Voice Note">🎤</button><input id="msgInput" type="text" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendMsg()"><button id="sendBtn" onclick="sendMsg()">➤</button></div>
</div>
<div id="statusPanel">
<h3>📸 Status</h3><p style="font-size:13px;color:#666;margin:6px 0">Post wetin dey your mind - e go show for everybody!</p>
<div id="statusForm"><input id="statusInput" placeholder="What's happening? Post a status..."><button onclick="postStatus()">Post +</button></div>
<div id="statusList"></div>
</div>
</div>
</div>

<script>
const socket=io();
let myName='', currentChat='MayorChatZ Assistant', users=[], statuses=JSON.parse(localStorage.getItem('mayor_status')||'[]');
let mediaRecorder=null, audioChunks=[];

function joinChat(){
  let n=document.getElementById('nameInput').value.trim();
  if(!n) return alert('Enter your name first');
  myName=n; socket.emit('join',n);
}
socket.on('joinError',m=>alert(m));
socket.on('joinSuccess',()=>{
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='flex';
  renderSidebar(); renderStatuses();
});
socket.on('onlineUsers',l=>{document.getElementById('online').innerText='● '+l.length+' online'; users=l; renderSidebar();});
socket.on('userList',l=>{users=l; renderSidebar();});
socket.on('typing',d=>{ if(d.from!==myName) document.getElementById('typing').innerText=d.from+' is typing...'; setTimeout(()=>document.getElementById('typing').innerText='',2000);});

function renderSidebar(){
  let html=`<div class="chat-item ${currentChat==='MayorChatZ Assistant'?'active':''}" onclick="openChat('MayorChatZ Assistant')"><div class="avatar">🤖</div><div><b>MayorChatZ Assistant</b><br><small>Ask anything</small></div></div>
  <div class="chat-item ${currentChat==='General Group'?'active':''}" onclick="openChat('General Group')"><div class="avatar" style="background:#4b0f7a">👥</div><div><b>General Group</b><br><small>Group Chat • Everyone</small></div></div>`;
  users.filter(u=>u!==myName && u!=='MayorChatZ Assistant').forEach(u=>{
    html+=`<div class="chat-item ${currentChat===u?'active':''}" onclick="openChat('${u}')"><div class="avatar">${u[0].toUpperCase()}</div><div><b>${u}</b><br><small>Tap to chat</small></div></div>`;
  });
  document.getElementById('sidebar').innerHTML=html;
}
function openChat(name){currentChat=name; document.getElementById('chatName').innerText=name; document.getElementById('chatAvatar').innerText=name[0]; document.getElementById('messages').innerHTML=''; document.getElementById('sidebar').classList.remove('show'); renderSidebar(); showTab('chats'); if(name==='General Group') addMsg({from:'MayorChatZ Assistant',text:'Welcome to General Group! 🎉 Everybody fit chat here.',type:'text',time:''});}
function addMsg(m){
  if(m.to && m.to!=='General Group' && m.to!==myName && m.from!==myName && m.from!=='MayorChatZ Assistant') return;
  if(currentChat==='General Group' && m.to!=='General Group' && m.from!=='MayorChatZ Assistant') return;
  if(currentChat!=='General Group' && currentChat!=='MayorChatZ Assistant'){
    if(m.from!==currentChat && m.from!==myName) return;
  }
  let div=document.createElement('div'); let cls=m.from===myName?'me':(m.from==='MayorChatZ Assistant'?'assistant':'other');
  let content=m.text||'';
  if(m.type==='image') content=`<img src="${m.url}">`;
  if(m.type==='video') content=`<video src="${m.url}" controls></video>`;
  if(m.type==='audio') content=`<audio src="${m.url}" controls></audio>`;
  div.className='msg '+cls; div.innerHTML=`<b>${m.from}</b>${content}<div class="time">${m.time||''}</div>`;
  document.getElementById('messages').appendChild(div); document.getElementById('messages').scrollTop=1e9;
}
socket.on('message',addMsg);
function sendMsg(){
  let inp=document.getElementById('msgInput'); let t=inp.value.trim(); if(!t) return;
  socket.emit('message',{from:myName,to:currentChat,text:t,type:'text'}); inp.value='';
}
document.getElementById('msgInput')?.addEventListener('input',()=>socket.emit('typing',{from:myName}));
async function uploadFile(el){
  let f=el.files[0]; if(!f) return; let fd=new FormData(); fd.append('file',f);
  let r=await fetch('/upload',{method:'POST',body:fd}); let d=await r.json();
  socket.emit('message',{from:myName,to:currentChat,url:d.url,type:d.type,text:''});
}
async function startVoice(){
  try{
    if(mediaRecorder && mediaRecorder.state==='recording'){mediaRecorder.stop(); return;}
    let s=await navigator.mediaDevices.getUserMedia({audio:true}); mediaRecorder=new MediaRecorder(s); audioChunks=[];
    mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);
    mediaRecorder.onstop=async()=>{let b=new Blob(audioChunks,{type:'audio/webm'}); let fd=new FormData(); fd.append('file',new File([b],'voice.webm',{type:'audio/webm'})); let r=await fetch('/upload',{method:'POST',body:fd}); let d=await r.json(); socket.emit('message',{from:myName,to:currentChat,url:d.url,type:'audio',text:''});};
    mediaRecorder.start(); alert('Recording... Tap 🎤 again to send');
  }catch(e){alert('Mic no work for this browser');}
}
function showTab(t){
  document.getElementById('tabChats').classList.toggle('active',t==='chats');
  document.getElementById('tabStatus').classList.toggle('active',t==='status');
  document.getElementById('chatArea').style.display=t==='chats'?'flex':'none';
  document.getElementById('statusPanel').style.display=t==='status'?'block':'none';
  if(t==='status') renderStatuses();
}
function postStatus(){
  let v=document.getElementById('statusInput').value.trim(); if(!v) return;
  statuses.unshift({name:myName,text:v,time:new Date().toLocaleString()});
  localStorage.setItem('mayor_status',JSON.stringify(statuses)); document.getElementById('statusInput').value=''; renderStatuses();
}
function renderStatuses(){
  document.getElementById('statusList').innerHTML=statuses.length?statuses.map(s=>`<div class="status-card"><b>💖 ${s.name}</b><p>${s.text}</p><small>${s.time}</small></div>`).join(''):'<p>No status yet. Be the first to post! ✨</p>';
}
function toggleDark(){document.body.classList.toggle('dark');}
openChat('MayorChatZ Assistant');
</script>
</body>
  </html>
