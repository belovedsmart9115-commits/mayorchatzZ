<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MayorChatZ</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#0b141a;color:#fff;height:100vh;overflow:hidden}
#login{position:fixed;inset:0;background:#0b141a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;z-index:99;padding:20px;text-align:center}
#login h1{font-size:32px;color:#25d366}
#login input{padding:13px;width:280px;max-width:90%;border-radius:10px;border:none;outline:none;font-size:16px}
#login button{padding:13px 30px;background:#25d366;border:none;border-radius:10px;color:#fff;font-size:17px;font-weight:bold;cursor:pointer}
#app{display:none;height:100vh}
header{background:#202c33;padding:12px 15px;display:flex;justify-content:space-between;align-items:center}
header b{color:#25d366;font-size:20px}
header span{font-size:13px;color:#aaa}
.tabs{display:flex;background:#202c33;border-top:1px solid #333}
.tabs button{flex:1;padding:12px;border:none;background:transparent;color:#aaa;cursor:pointer;font-size:15px}
.tabs button.active{color:#25d366;border-bottom:3px solid #25d366}
.main{height:calc(100vh - 100px);overflow-y:auto;padding:10px;padding-bottom:90px}
.card{background:#202c33;padding:12px;border-radius:12px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer}
.avatar{width:48px;height:48px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:bold;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.card small{color:#aaa;display:block}
.dot{width:10px;height:10px;border-radius:50%;background:#555;display:inline-block}
.dot.on{background:#25d366}
#chatView{display:none;height:100vh;flex-direction:column;background:#0b141a}
#chatHead{background:#202c33;padding:12px;display:flex;align-items:center;gap:10px}
#chatHead button{background:none;border:none;color:#fff;font-size:22px;cursor:pointer}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background-image:url('https://i.imgur.com/8x8j8bP.png')}
.msg{max-width:80%;padding:9px 12px;border-radius:12px;font-size:15px;white-space:pre-wrap;word-break:break-word}
.msg.me{background:#005c4b;align-self:flex-end}
.msg.other{background:#202c33;align-self:flex-start}
.msg img,.msg video{max-width:100%;border-radius:10px;margin-top:5px}
.msg small{font-size:11px;color:#aaa;display:block;margin-top:3px}
#inputBar{display:flex;gap:8px;padding:10px;background:#202c33;align-items:center}
#inputBar input[type=text]{flex:1;padding:12px;border-radius:20px;border:none;outline:none;background:#2a3942;color:#fff}
#inputBar button{padding:11px 16px;border:none;border-radius:50%;background:#25d366;color:#fff;font-size:18px;cursor:pointer}
#fileBtn{background:#2a3942!important}
input[type=file]{display:none}
.btn{width:100%;padding:12px;background:#25d366;border:none;border-radius:10px;color:#fff;font-weight:bold;cursor:pointer;margin-top:8px}
input[type=text].full{width:100%;padding:12px;border-radius:10px;border:none;outline:none;background:#2a3942;color:#fff;margin-top:8px}
.aiCard{border:1px solid #25d366}
</style>
</head>
<body>

<div id="login">
<h1>💬 MayorChatZ</h1>
<p>Chat, Groups, Status & Free AI</p>
<input id="nameInput" placeholder="Enter your name e.g. Beloved">
<button onclick="login()">Enter Chat →</button>
<p style="font-size:12px;color:#888">Your name go show to others. No password needed.</p>
</div>

<div id="app">
<header><div><b>MayorChatZ</b><br><span id="myNameShow"></span></div><span id="onlineCount">● Online</span></header>
<div class="tabs">
<button id="tabChats" class="active" onclick="showTab('chats')">Chats</button>
<button id="tabGroups" onclick="showTab('groups')">Groups</button>
<button id="tabStatus" onclick="showTab('status')">Status</button>
</div>
<div class="main" id="main"></div>
</div>

<div id="chatView">
<div id="chatHead"><button onclick="closeChat()">←</button><div class="avatar" id="chatAvatar">?</div><div><b id="chatName"></b><br><span id="chatStatus" style="font-size:12px;color:#25d366">Online</span></div></div>
<div id="msgs"></div>
<div id="inputBar">
<label id="fileBtn" style="padding:11px;border-radius:50%;background:#2a3942;cursor:pointer">📎<input type="file" id="fileInput" accept="image/*,video/*,.pdf,.doc,.docx,.mp3,.mp4"></label>
<input type="text" id="msgInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMsg()">
<button onclick="sendMsg()">➤</button>
</div>
</div>

<script>
let myId=localStorage.getItem('mz_id')||('u'+Date.now()+Math.random().toString(36).slice(2,6));
localStorage.setItem('mz_id',myId);
let myName=localStorage.getItem('mz_name')||'';
let socket=io();
let currentChat=null, currentChatName='', allUsers=[], allGroups=[], currentMessages=[];
let myPublicKey='key_'+myId;

async function login(){
  let n=document.getElementById('nameInput').value.trim();
  if(!n) return alert('Enter your name');
  myName=n; localStorage.setItem('mz_name',n);
  let r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,id:myId,publicKey:myPublicKey})});
  let u=await r.json(); myId=u.id; localStorage.setItem('mz_id',myId);
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('myNameShow').textContent='Hi, '+myName;
  socket.emit('join',myId,myName);
  showTab('chats');
}
if(myName){ document.getElementById('nameInput').value=myName; }

function showTab(t){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add('active');
  if(t==='chats') renderChats();
  if(t==='groups') renderGroups();
  if(t==='status') renderStatus();
}

async function renderChats(){
  let r=await fetch('/api/users'); allUsers=await r.json();
  let html=`<div class="card aiCard" onclick="openAI()"><div class="avatar">🤖</div><div><b>MayorChatZ Assistant</b><small>Free AI - Ask anything, Maths, Science...</small></div><span class="dot on"></span></div>`;
  // HIDE OWN NAME - filter out myId
  html+=allUsers.filter(u=>u.id!==myId).map(u=>`
    <div class="card" onclick="openChat('${u.id}','${u.name.replace(/'/g,'')}')">
      <div class="avatar">${u.name.charAt(0).toUpperCase()}</div>
      <div style="flex:1"><b>${u.name}</b><small>${u.online?'Online':'Offline'} • Tap to chat</small></div>
      <span class="dot ${u.online?'on':''}"></span>
    </div>`).join('');
  if(allUsers.filter(u=>u.id!==myId).length===0) html+='<p style="text-align:center;color:#aaa;margin-top:20px">No other users yet.<br>Share the link make others join!</p>';
  document.getElementById('main').innerHTML=html;
}
async function renderGroups(){
  let r=await fetch('/api/groups'); allGroups=await r.json();
  let html=`<input class="full" id="gName" placeholder="New group name"><input class="full" id="gDesc" placeholder="Group description (optional)"><button class="btn" onclick="createGroup()">+ Create Group</button><br><br>`;
  html+=allGroups.map(g=>`<div class="card" onclick="openChat('${g.id}','${g.name.replace(/'/g,'')}')"><div class="avatar">👥</div><div style="flex:1"><b>${g.name}</b><small>${g.desc||''}</small></div></div>`).join('');
  document.getElementById('main').innerHTML=html;
}
async function createGroup(){
  let name=document.getElementById('gName').value.trim(); if(!name) return alert('Enter group name');
  await fetch('/api/groups',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,desc:document.getElementById('gDesc').value,createdBy:myName})});
  renderGroups();
}
async function renderStatus(){
  let r=await fetch('/api/status'); let list=await r.json();
  let html=`<input class="full" id="sText" placeholder="Write status..."><button class="btn" onclick="postStatus()">Post Status</button><br><br>`;
  html+=list.map(s=>{
    let media='';
    if(s.file){ if(s.fileType&&s.fileType.startsWith('image')) media=`<img src="${s.file}" style="width:100%;border-radius:10px;margin-top:8px">`; else if(s.fileType&&s.fileType.startsWith('video')) media=`<video src="${s.file}" controls style="width:100%;border-radius:10px;margin-top:8px"></video>`; }
    return `<div class="card" style="display:block"><b>${s.name}</b><small>${new Date(s.createdAt).toLocaleString()}</small><p style="margin-top:6px">${s.text||''}</p>${media}</div>`;
  }).join('');
  if(list.length===0) html+='<p style="text-align:center;color:#aaa">No status yet. Post one!</p>';
  document.getElementById('main').innerHTML=html;
}
async function postStatus(){
  let text=document.getElementById('sText').value.trim();
  await fetch('/api/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:myName,text})});
  renderStatus();
}
function openAI(){ openChat('AI','MayorChatZ Assistant'); }
function openChat(id,name){
  currentChat=id; currentChatName=name;
  document.getElementById('app').style.display='none';
  document.getElementById('chatView').style.display='flex';
  document.getElementById('chatName').textContent=name;
  document.getElementById('chatAvatar').textContent=name.charAt(0).toUpperCase();
  loadMessages();
}
function closeChat(){ document.getElementById('chatView').style.display='none'; document.getElementById('app').style.display='block'; currentChat=null; showTab('chats'); }
async function loadMessages(){
  if(!currentChat) return;
  if(currentChat==='AI'){
    document.getElementById('msgs').innerHTML=`<div class="msg other">Hello Boss! 👋 I be <b>MayorChatZ Assistant</b>.<br><br>Ask me anything:<br>• What is photosynthesis?<br>• 45 + 67 =?<br>• Who is Wole Soyinka?<br><br>Type your question below.</div>`;
    return;
  }
  let r=await fetch(`/api/messages?from=${myId}&to=${currentChat}`); currentMessages=await r.json();
  renderMsgs();
}
function renderMsgs(){
  let box=document.getElementById('msgs');
  box.innerHTML=currentMessages.map(m=>{
    let media='';
    if(m.file){ if(m.fileType&&m.fileType.startsWith('image')) media=`<img src="${m.file}">`; else if(m.fileType&&m.fileType.startsWith('video')) media=`<video src="${m.file}" controls></video>`; else media=`<a href="${m.file}" target="_blank" style="color:#25d366">📎 Download File</a>`; }
    return `<div class="msg ${m.from===myId?'me':'other'}"><b>${m.from===myId?'You':(m.fromName||'')}</b><br>${m.text||''}${media}<small>${new Date(m.createdAt).toLocaleTimeString()}</small></div>`;
  }).join('');
  box.scrollTop=box.scrollHeight;
}
async function sendMsg(){
  let inp=document.getElementById('msgInput'); let text=inp.value.trim();
  let fileInput=document.getElementById('fileInput');
  let fileUrl=null, fileType=null;
  if(fileInput.files[0]){
    let fd=new FormData(); fd.append('file',fileInput.files[0]);
    let r=await fetch('/api/upload',{method:'POST',body:fd}); let d=await r.json(); fileUrl=d.url; fileType=d.fileType; fileInput.value='';
  }
  if(!text &&!fileUrl) return;
  if(currentChat==='AI'){
    let box=document.getElementById('msgs');
    box.innerHTML+=`<div class="msg me">${text}<small>Now</small></div>`;
    inp.value=''; box.scrollTop=box.scrollHeight;
    box.innerHTML+=`<div class="msg other" id="typing">Typing...</div>`; box.scrollTop=box.scrollHeight;
    let r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
    let d=await r.json();
    document.getElementById('typing').remove();
    box.innerHTML+=`<div class="msg other">${d.reply.replace(/\n/g,'<br>')}<small>Now</small></div>`; box.scrollTop=box.scrollHeight;
    return;
  }
  socket.emit('send-message',{from:myId,fromName:myName,to:currentChat,text,file:fileUrl,fileType});
  inp.value='';
}
socket.on('new-message',(m)=>{
  if(currentChat && ((m.from===currentChat&&m.to===myId)||(m.from===myId&&m.to===currentChat))){
    currentMessages.push(m); renderMsgs();
  }
});
socket.on('users-changed',()=>{ if(currentChat===null) showTab('chats'); });
socket.on('new-group',()=>{ showTab('groups'); });
socket.on('new-status',()=>{});
socket.on('online-users',(ids)=>{ document.getElementById('onlineCount').textContent='● '+ids.length+' Online'; });
</script>
</body>
</html>
