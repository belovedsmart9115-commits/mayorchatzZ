<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MayorchatzZ Ultra</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#111;color:#fff}
body.light{background:#e5ddd5;color:#000}
header{background:#075E54;padding:12px 10px;display:flex;justify-content:space-between;align-items:center}
button{border:none;padding:6px 10px;border-radius:6px;font-weight:bold;cursor:pointer}
#auth{padding:25px;max-width:400px;margin:auto}
input,select{width:100%;padding:12px;margin:7px 0;border-radius:10px;border:none;font-size:15px}
button.main{width:100%;padding:13px;background:#25D366;color:#000;font-size:16px;margin-top:10px}
#chat{display:none;flex-direction:column;height:calc(100vh - 52px)}
#online{font-size:12px;padding:8px 10px;background:#202c33;border-bottom:1px solid #333;display:flex;gap:6px;flex-wrap:wrap}
#msgs{flex:1;overflow-y:auto;padding:12px}
.msg{margin:7px 0;padding:8px 12px;border-radius:10px;max-width:82%;word-break:break-word}
.me{background:#005c4b;margin-left:auto}
.other{background:#202c33}
.msg img{max-width:100%;border-radius:8px;margin-top:6px}
audio{width:100%;margin-top:5px}
small{font-size:10px;opacity:.6}
.del{font-size:10px;color:#ff8a65;cursor:pointer;margin-left:6px}
#typing{font-size:11px;color:#25D366;padding:2px 10px;height:16px}
#inputArea{display:flex;padding:8px;background:#202c33;gap:6px;align-items:center}
#inputArea input{flex:1;margin:0}
#inputArea label,#inputArea button{width:auto;padding:10px;background:#25D366;border-radius:8px;font-weight:bold;color:#000}
</style>
</head>
<body>
<header><b>MayorchatzZ 🔥</b><div style="display:flex;gap:6px"><button onclick="toggleTheme()">🌙</button><button id="shareBtn" onclick="shareLink()" style="display:none;background:#25D366">Share</button><button id="logoutBtn" onclick="logout()" style="display:none;background:#f15a29;color:#fff">Logout</button></div></header>
<div id="authBox"><div id="auth">
<h2 id="ft" style="margin-bottom:12px">Create Account</h2>
<input id="nIn" placeholder="Your Name">
<select id="aIn"><option>👤</option><option>😎</option><option>🔥</option><option>👑</option><option>💀</option><option>😍</option><option>🚀</option><option>🎮</option></select>
<input id="pIn" placeholder="Phone">
<input id="pwIn" type="password" placeholder="Password">
<button class="main" onclick="doAuth()" id="ab">Signup</button>
<p style="margin-top:12px;text-align:center"><span id="tt">Have account?</span> <a href="#" onclick="tog()">Login</a></p>
<p id="err" style="color:red;text-align:center;margin-top:10px"></p>
</div></div>
<div id="chat"><div id="online"></div><div id="msgs"></div><div id="typing"></div>
<div id="inputArea"><label for="fileIn">📸</label><input type="file" id="fileIn" accept="image/*" hidden onchange="sendImg(this)"><button id="recBtn" onclick="toggleRec()">🎤</button><input id="msgIn" placeholder="Message..." oninput="sendTyping()" onkeypress="if(event.key==='Enter')sendMsg()"><button onclick="sendMsg()">Send</button></div></div>
<script>
let isLogin=false;
let cur=localStorage.getItem('mayorUser');
let ava=localStorage.getItem('mayorAvatar')||'👤';
let rec,recData=[];
if(localStorage.getItem('theme')=='light')document.body.classList.add('light');
function toggleTheme(){document.body.classList.toggle('light');localStorage.setItem('theme',document.body.classList.contains('light')?'light':'dark');}
function gid(i){return document.getElementById(i);}
function check(){if(cur){gid('authBox').style.display='none';gid('chat').style.display='flex';gid('logoutBtn').style.display='block';gid('shareBtn').style.display='block';loadM();loadU();}}check();
function tog(){isLogin=!isLogin;gid('ft').innerText=isLogin?'Login':'Signup';gid('ab').innerText=isLogin?'Login':'Signup';gid('tt').innerText=isLogin?"No account?":"Have account?";gid('nIn').style.display=isLogin?'none':'block';gid('aIn').style.display=isLogin?'none':'block';}
async function doAuth(){
let n=gid('nIn').value.trim(),a=gid('aIn').value,p=gid('pIn').value.trim(),pw=gid('pwIn').value.trim();
gid('err').innerText='';
if(!p||!pw||(!isLogin&&!n)){gid('err').innerText='Fill all fields';return;}
gid('ab').innerText='Loading...';
try{
let url=isLogin?'/api/login':'/api/signup';
let body=isLogin?{phone:p,password:pw}:{name:n,phone:p,password:pw,avatar:a};
let r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
let d=await r.json();
if(d.error){gid('err').innerText=d.error;gid('ab').innerText=isLogin?'Login':'Signup';return;}
localStorage.setItem('mayorUser',isLogin?d.name:n);
localStorage.setItem('mayorAvatar',isLogin?d.avatar:a);
location.reload();
}catch(e){gid('err').innerText='Server waking up, wait 30s retry';gid('ab').innerText='Signup';}
}
async function loadM(){
let r=await fetch('/api/messages'),msgs=await r.json();
let box=gid('msgs');box.innerHTML='';
msgs.forEach(m=>{
if(m.user!=cur&&cur)fetch('/api/read',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:m.id,user:cur})});
let d=document.createElement('div');
d.className='msg '+(m.user==cur?'me':'other');
let content=m.text||'';
if(m.type=='image')content='<br><img src="'+m.data+'">';
if(m.type=='voice')content='<br><audio controls src="'+m.data+'"></audio>';
let ticks='';if(m.user==cur){let rb=m.readBy||[];ticks=rb.length>0?'✓✓<span style="color:#53bdeb">':'✓✓';ticks+='</span>';}
let del=m.user==cur?'<span class=del onclick="delM(\''+m.id+'\')">[del]</span>':'';
d.innerHTML='<b>'+(m.avatar||'👤')+' '+m.user+'</b> '+del+'<br>'+content+'<br><small>'+(m.time||'')+' '+ticks+'</small>';
box.appendChild(d);
});
box.scrollTop=box.scrollHeight;
}
async function loadU(){let r=await fetch('/api/users'),u=await r.json();gid('online').innerHTML='Online: '+(u.length?u.map(x=>x.avatar+' '+x.name).join(' • '):'No users yet');}
async function sendTyping(){if(!cur)return;await fetch('/api/typing',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:cur})});}
async function checkTyping(){let r=await fetch('/api/typing'),u=await r.json(),o=u.filter(x=>x!=cur);gid('typing').innerText=o.length?o.join(', ')+' typing...':'';}
async function sendMsg(){let t=gid('msgIn').value.trim();if(!t||!cur)return;await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:cur,text:t,avatar:ava,type:'text'})});gid('msgIn').value='';loadM();}
async function sendImg(el){let f=el.files[0];if(!f||!cur)return;let rd=new FileReader();rd.onload=async()=>{await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:cur,avatar:ava,type:'image',data:rd.result})});loadM();};rd.readAsDataURL(f);}
async function toggleRec(){
if(!rec||rec.state=='inactive'){
let s=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(s);recData=[];rec.ondataavailable=e=>recData.push(e.data);
rec.onstop=async()=>{let blob=new Blob(recData,{type:'audio/webm'}),rd=new FileReader();rd.onload=async()=>{await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:cur,avatar:ava,type:'voice',data:rd.result})});loadM();};rd.readAsDataURL(blob);};
rec.start();gid('recBtn').innerText='⏹️';gid('recBtn').style.background='red';
}else{rec.stop();gid('recBtn').innerText='🎤';gid('recBtn').style.background='#25D366';}
}
async function delM(id){if(!confirm('Delete?'))return;await fetch('/api/messages/'+id,{method:'DELETE'});loadM();}
function logout(){localStorage.clear();location.reload();}
function shareLink(){let l='https://mayorchatzZ.onrender.com';if(navigator.share)navigator.share({title:'Join',url:l});else{navigator.clipboard.writeText(l);alert('Copied '+l);}}
setInterval(()=>{if(cur){loadM();loadU();checkTyping();}},2500);
</script>
</body>
  </html>
