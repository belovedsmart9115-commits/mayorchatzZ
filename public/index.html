<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MayorChatZ PRO MAX</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#00a884">
<meta property="og:image" content="icon.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,sans-serif;background:#111b21;height:100vh;display:flex;flex-direction:column}
#head{background:#202c33;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
#head b{font-size:16px}#online{font-size:12px;color:#25d366}
#msgs{flex:1;overflow-y:auto;padding:10px;background:#0b141a url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');display:flex;flex-direction:column;gap:6px}
.bubble{max-width:75%;padding:8px 10px;border-radius:8px;position:relative;font-size:14.5px;line-height:19px;cursor:pointer}
.me{align-self:flex-end;background:#005c4b;color:#e9edef;border-top-right-radius:0}
.other{align-self:flex-start;background:#202c33;color:#e9edef;border-top-left-radius:0}
.meta{font-size:11px;color:#8696a0;text-align:right;margin-top:4px}
.me .meta{color:#53bdeb}
.reply{border-left:3px solid #25d366;background:rgba(0,0,0,.2);padding:4px 6px;margin-bottom:4px;border-radius:4px;font-size:12px;opacity:.8}
#repBar{background:#182229;color:#25d366;padding:8px 12px;display:none;justify-content:space-between;border-left:4px solid #25d366}
#inputArea{background:#202c33;padding:8px 10px;display:flex;align-items:flex-end;gap:8px}
#inp{flex:1;background:#2a3942;border:none;border-radius:8px;padding:10px 12px;color:#fff;outline:none;resize:none;max-height:100px}
.btn{width:40px;height:40px;border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px}
#sendBtn{background:#00a884;color:#fff}
#emojiBtn{background:transparent}
#emojiPanel{position:absolute;bottom:60px;left:10px;background:#202c33;padding:10px;border-radius:12px;display:none;grid-template-columns:repeat(6,1fr);gap:6px;width:220px;z-index:10}
#emojiPanel span{font-size:22px;cursor:pointer;padding:4px}
</style>
</head>
<body>
<div id="head"><div><b>MayorChatZ</b> <span id="online">1 online</span> • General</div><button onclick="share()" style="background:#00a884;color:#fff;border:none;padding:6px 12px;border-radius:20px;font-weight:600">Share</button></div>
<div id="repBar"><div><small id="repName"></small><div id="repText"></div></div><span onclick="cancelRep()" style="cursor:pointer">✕</span></div>
<div id="msgs"></div>
<div style="position:relative">
<div id="emojiPanel"></div>
<div id="inputArea">
<button class="btn" id="emojiBtn" onclick="toggleEmoji()">😊</button>
<textarea id="inp" placeholder="Type a message" rows="1"></textarea>
<button class="btn" id="sendBtn" onclick="send()">➤</button>
</div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
let replyTo=null;
const emojis=['😀','😂','😍','🔥','❤️','👑','😭','🥺','💀','🙏','😎','🤣','😅','😊','👍','👏','💯','✨','🎉','😢','🤔','😏','🥰','😜','🤩','😇','🥳','😋','🤫','🤐','😤','🥵','🥶','🤯','😴','🥱','🤠','👻','💩','👀','🫡','💪','🫶','🤝'];
const panel=document.getElementById('emojiPanel');
emojis.forEach(e=>{let s=document.createElement('span');s.textContent=e;s.onclick=()=>{inp.value+=e;panel.style.display='none';inp.focus()};panel.appendChild(s)});
function toggleEmoji(){panel.style.display=panel.style.display==='grid'?'none':'grid'}
let socket=io();let user=localStorage.getItem('mz_user')||'DE mayors';let room='general';
socket.emit('join',user);
socket.on('history',m=>{document.getElementById('msgs').innerHTML='';m.forEach(addMsg)});
socket.on('message',addMsg);
socket.on('count',c=>document.getElementById('online').innerText=c+' online');
function addMsg(d){
let div=document.createElement('div');div.className='bubble '+(d.user===user?'me':'other');
let isImg=d.text.match(/\.(jpeg|jpg|gif|png|webp)$/i);
let content=isImg?`<img src="${d.text}" style="max-width:200px;border-radius:8px">`:`${d.user!=='DE mayors'&&d.user!==user?'<small style="color:#25d366;font-weight:600">'+d.user+'</small><br>':''}${d.reply?`<div class="reply"><b>${d.reply.user}</b><br>${d.reply.text.slice(0,50)}</div>`:''}${d.text}`;
div.innerHTML=content+`<div class="meta">${new Date(d.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} ✓✓</div>`;
div.onclick=()=>{replyTo=d;document.getElementById('repBar').style.display='flex';document.getElementById('repName').innerText=d.user;document.getElementById('repText').innerText=d.text.slice(0,40);};
document.getElementById('msgs').appendChild(div);document.getElementById('msgs').scrollTop=99999;
}
function send(){let t=inp.value.trim();if(!t)return;socket.emit('message',{text:t,reply:replyTo?{user:replyTo.user,text:replyTo.text}:null});inp.value='';cancelRep();panel.style.display='none'}
function cancelRep(){replyTo=null;document.getElementById('repBar').style.display='none'}
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
function share(){let txt=`Join my private chat on MayorChatZ PRO MAX 🔒\n${location.href}`;if(navigator.share)navigator.share({title:'MayorChatZ',text:txt,url:location.href});else window.open('https://wa.me/?text='+encodeURIComponent(txt))}
// PWA
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
</body>
</html>
