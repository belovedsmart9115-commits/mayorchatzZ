<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MayorChatzZ</title>
<link rel="icon" href="/icon.png?v=2" />
<link rel="apple-touch-icon" href="/icon.png?v=2" />
<link rel="manifest" href="/manifest.json?v=2" /><meta name="theme-color" content="#ff2e8a" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111b21;display:flex;flex-direction:column;height:100vh;font-family:sans-serif}
header{background:#202c33;color:#e9edef;padding:12px;font-weight:bold}
#messages{flex:1;overflow-y:auto;padding:10px;list-style:none}
#messages li{max-width:75%;padding:8px 12px;margin:5px;border-radius:8px}
.me{background:#005c4b;color:#e9edef;margin-left:auto}
.other{background:#202c33;color:#e9edef}
small{display:block;font-size:11px;opacity:0.7;margin-top:4px}
form{display:flex;padding:8px;background:#202c33}
input{flex:1;padding:12px;border:none;border-radius:20px;outline:none}
button{padding:12px 20px;border:none;border-radius:20px;background:#00a884;color:white;margin-left:8px;cursor:pointer}
</style>
</head>
<body>
<header>💬 My WhatsApp Clone - <span id="user"></span></header>
<ul id="messages"></ul>
<form id="form"><input id="input" placeholder="Type a message..."/><button>Send</button></form>
<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>
</body>
</html>
