<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MayorChatZ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{display:flex;height:100vh;background:#efeae2;color:#111;overflow:hidden}
body.dark{background:#0b141a;color:#e9edef}
#sidebar{width:300px;background:#fff;border-right:1px solid #ddd;display:flex;flex-direction:column}
body.dark #sidebar{background:#111b21;border-color:#222}
#sideHead{padding:15px;background:#075E54;color:#fff;display:flex;justify-content:space-between;align-items:center}
body.dark #sideHead{background:#202c33}
#sideHead h2{font-size:18px}
#onlineCount{font-size:12px;color:#25D366;margin-top:2px}
#darkBtn{background:none;border:none;font-size:20px;cursor:pointer}
#myNameTag{padding:10px 15px;font-weight:bold;border-bottom:1px solid #eee;font-size:14px}
body.dark #myNameTag{border-color:#222}
.chatItem{padding:13px 15px;cursor:pointer;border-bottom:1px solid #f0f0f0;display:flex;gap:10px;align-items:center}
body.dark.chatItem{border-color:#222}
.chatItem:hover,.chatItem.active{background:#e9edef}
body.dark.chatItem:hover,body.dark.chatItem.active{background:#2a3942}
.avatar{width:40px;height:40px;border-radius:50%;background:#25D366;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;flex-shrink:0}
.chatItem b{font-size:15px}
.chatItem small{color:#888;font-size:12px}
#chatArea{flex:1;display:flex;flex-direction:column;background:#ece5dd}
body.dark #chatArea{background:#0b141a}
#chatHead{padding:12px 16px;background:#ededed;display:flex;align-items:center;gap:10px;border-bottom:1px solid #ddd}
body.dark #chatHead{background:#202c33;border-color:#222}
#typing{font-size:12px;color:#25D366;height:16px;padding:2px 16px}
#messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:70%;padding:8px 10px;border-radius:8px;background:#fff;align-self:flex-start;box-shadow:0 1px 1px rgba(0,0,0,.1);word-wrap:break-word}
body.dark.msg{background:#233138;color:#e9edef}
.msg.me{align-self:flex-end;background:#d9fdd3}
body.dark.msg.me{background:#005c4b}
.msg small{display:block;font-size:10px;color:#888;text-align:right;margin-top:4px}
.msg img,.msg video{max-width:100%;border-radius:8px;margin-top:5px}
#inputArea{display:flex;gap:8px;padding:10px;background:#f0f2f5;align-items:center}
body.dark #inputArea{background:#202c33}
#msgInput{flex:1;padding:11px 14px;border:none;border-radius:20px;outline:none;font-size:15px}
body.dark #msgInput{background:#2a3942;color:#fff}
#inputArea button{border:none;cursor:pointer;padding:10px 12px;border-radius:50%;background:#25D366;color:#fff;font-size:16px}
#fileBtn{background:#fff!important;color:#555!important}
#login{position:fixed;inset:0;background:#075E54;display:flex;align-items:center;justify-content:center;z-index:100}
#loginBox{background:#fff;padding:30px;border-radius:12px;text-align:center;width:90%;max-width:350px}
#loginBox h1{color:#075E54;margin-bottom:10px}
#loginBox input{width:100%;padding:12px;margin:12px 0;border:1px solid #ddd;border-radius:8px;font-size:16px}
#loginBox button{width:100%;padding:12px;background:#25D366;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer}
#error{color:red;font-size:13px;margin-top:8px}
@media(max-width:700px){#sidebar{width:100px}#sidebar.chatName{display:none}#sideHead h2{font-size:14px}}
</style>
</head>
<body>

<div id="login">
  <div id="loginBox">
    <h1>MayorChatZ 💬</h1>
    <p>Enter your name to continue</p>
    <input id="nameInput" placeholder="Your name...">
    <button onclick="doLogin()">Enter Chat</button>
    <div id="error"></div>
  </div>
</div>

<div id="sidebar">
  <div id="sideHead">
    <div><h2>MayorChatZ</h2><div id="onlineCount">0 online</div></div>
    <button id="darkBtn" onclick="toggleDark()">🌙</button>
  </div>
  <div id="myNameTag"></div>
  <div id="chatList"></div>
  <div style="margin-top:auto;padding:12px"><button onclick="logout()" style="width:100%;padding:10px;border:none;background:#ff4444;color:#fff;border-radius:8px;cursor:pointer">Logout</button></div>
</div>

<div id="chatArea">
  <div id="chatHead"><div class="avatar" id="headAvatar">M</div><div><b id="chatTitle">Select a chat</b><div style="font-size:12px;color:#25D366">Tap a chat to start</div></div></div>
  <div id="typing"></div>
  <div id="messages"></div>
  <div id="inputArea">
    <label for="fileInput" id="fileBtn" style="padding:10px 12px;border-radius:50%;background:#fff;cursor:pointer">📎</label>
    <input type="file" id="fileInput" accept="image/*,video/*" style="display:none" onchange="sendFile(this)">
    <input id="msgInput" placeholder="Type a message" oninput="sendTyping()" onkeydown="if(event.key==='Enter')sendMessage()">
    <button id="voiceBtn" onclick="toggleVoice()">🎤</button>
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let myName = localStorage.getItem('mayor_name') || '';
let currentChat = 'MayorChatZ Assistant';
let allMessages = [];
let allUsers = [];

// Dark mode - preserved
if(localStorage.getItem('mayor_dark')==='1') document.body.classList.add('dark');
function toggleDark(){
  document.body.classList.toggle('dark');
  localStorage.setItem('mayor_dark', document.body.classList.contains('dark')?'1':'0');
  document.getElementById('darkBtn').textContent = document.body.classList.contains('dark')?'☀️':'🌙';
}
if(document.body.classList.contains('dark')) document.getElementById('darkBtn').textContent='☀️';

function doLogin(){
  let n = document.getElementById('nameInput').value.trim();
  if(!n) return document.getElementById('error').textContent='Enter your name';
  socket.emit('join', n);
}
socket.on('joinError', m=> document.getElementById('error').textContent=m);
socket.on('joinSuccess', name=>{
  myName=name;
  localStorage.setItem('mayor_name', name);
  document.getElementById('login').style.display='none';
  document.getElementById('myNameTag').textContent='You: '+myName;
  renderChatList();
  renderMessages();
});
socket.on('userList', users=>{ allUsers=users; renderChatList(); });
socket.on('onlineUsers', users=>{ document.getElementById('onlineCount').textContent = users.length + ' online'; allUsers=users; renderChatList(); });

function logout(){ localStorage.removeItem('mayor_name'); location.reload(); }

function renderChatList(){
  let list = document.getElementById('chatList');
  let chats = ['MayorChatZ Assistant','General Group',...allUsers.filter(u=>u!==myName)];
  list.innerHTML = chats.map(c=>{
    let initial = c==='MayorChatZ Assistant'? '🤖' : c[0].toUpperCase();
    return `<div class="chatItem ${c===currentChat?'active':''}" onclick="openChat('${c.replace(/'/g,"\\'")}')"><div class="avatar">${initial}</div><div class="chatName"><b>${c}</b><br><small>${c==='MayorChatZ Assistant'?'Ask anything':'Tap to chat'}</small></div></div>`;
  }).join('');
}
function openChat(name){
  currentChat=name;
  document.getElementById('chatTitle').textContent=name;
  document.getElementById('headAvatar').textContent = name==='MayorChatZ Assistant'?'🤖':name[0].toUpperCase();
  document.getElementById('typing').textContent='';
  renderChatList(); renderMessages();
}

function isRelevant(m){
  if(currentChat==='General Group') return m.to==='General Group' || m.to==='General';
  if(currentChat==='MayorChatZ Assistant') return (m.from===myName && m.to==='MayorChatZ Assistant') || (m.from==='MayorChatZ Assistant' && m.to===myName);
  return (m.from===myName && m.to===currentChat) || (m.from===currentChat && m.to===myName);
}

function renderMessages(){
  let box=document.getElementById('messages');
  box.innerHTML='';
  allMessages.filter(isRelevant).forEach(m=>{
    let div=document.createElement('div');
    div.className='msg'+(m.from===myName?' me':'');
    let content='';
    if(m.type==='image') content=`<img src="${m.data}">`;
    else if(m.type==='video') content=`<video controls src="${m.data}"></video>`;
    else if(m.type==='voice') content=`<audio controls src="${m.data}" style="width:200px"></audio>`;
    else content=`${(m.text||'').replace(/\n/g,'<br>')}`;
    div.innerHTML=`<b style="font-size:12px;color:#075E54">${m.from}</b><div>${content}</div><small>${m.time||''}</small>`;
    box.appendChild(div);
  });
  box.scrollTop=box.scrollHeight;
}

function sendMessage(){
  let inp=document.getElementById('msgInput');
  let text=inp.value.trim();
  if(!text) return;
  socket.emit('message',{from:myName,to:currentChat,text:text,type:'text'});
  inp.value='';
}
async function sendFile(el){
  let file=el.files[0]; if(!file) return;
  let fd=new FormData(); fd.append('file',file);
  let res=await fetch('/upload',{method:'POST',body:fd});
  let d=await res.json();
  socket.emit('message',{from:myName,to:currentChat,text:'',type:d.type,data:d.url});
  el.value='';
}
socket.on('message', m=>{ allMessages.push(m); renderMessages(); });

// Typing
let typingTimeout;
function sendTyping(){ socket.emit('typing',{from:myName,to:currentChat}); }
socket.on('typing', d=>{
  if(d.from===currentChat){
    document.getElementById('typing').textContent=d.from+' is typing...';
    clearTimeout(typingTimeout);
    typingTimeout=setTimeout(()=>document.getElementById('typing').textContent='',2000);
  }
});

// Voice Note
let mediaRecorder, audioChunks=[], isRecording=false;
async function toggleVoice(){
  if(!isRecording){
    try{
      let stream=await navigator.mediaDevices.getUserMedia({audio:true});
      mediaRecorder=new MediaRecorder(stream); audioChunks=[];
      mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);
      mediaRecorder.onstop=()=>{
        let blob=new Blob(audioChunks,{type:'audio/webm'});
        let reader=new FileReader();
        reader.onload=()=>{ socket.emit('message',{from:myName,to:currentChat,text:'',type:'voice',data:reader.result}); };
        reader.readAsDataURL(blob);
      };
      mediaRecorder.start(); isRecording=true;
      document.getElementById('voiceBtn').textContent='⏹️';
      document.getElementById('voiceBtn').style.background='red';
    }catch(e){ alert('Allow microphone to send voice note'); }
  } else {
    mediaRecorder.stop(); isRecording=false;
    document.getElementById('voiceBtn').textContent='🎤';
    document.getElementById('voiceBtn').style.background='#25D366';
  }
}

// Auto-login if name saved
if(myName){
  document.getElementById('nameInput').value=myName;
  socket.emit('join', myName);
}
renderChatList();
</script>
</body>
</html>
