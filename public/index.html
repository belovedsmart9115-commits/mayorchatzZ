<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>MayorChatZ PRO</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#111;color:#fff;height:100vh;display:flex;flex-direction:column}
#login{position:fixed;inset:0;background:#111;display:flex;align-items:center;justify-content:center;z-index:99}.card{background:#1e1e1e;padding:24px;border-radius:16px;width:90%;max-width:340px}input,button{padding:12px;border-radius:10px;border:none;width:100%;margin-top:10px}input{background:#2a2a2a;color:#fff}button{background:#25D366;color:#000;font-weight:700}
#top{padding:10px;background:#1e1e1e;display:flex;justify-content:space-between;align-items:center}#tabs{display:flex;background:#1e1e1e;border-bottom:1px solid #333}.tab{flex:1;padding:10px;text-align:center;cursor:pointer;color:#888}.tab.active{color:#25D366;border-bottom:2px solid #25D366}
#content{flex:1;display:flex;flex-direction:column;overflow:hidden}#msgs{flex:1;overflow:auto;padding:10px}.m{background:#2a2a2a;padding:8px 12px;border-radius:12px;margin-bottom:8px;max-width:85%;position:relative}.m.me{margin-left:auto;background:#005c4b}.m img,.m video,.m audio{max-width:100%;border-radius:8px;margin-top:6px;display:block}.del{position:absolute;top:4px;right:6px;font-size:12px;cursor:pointer}
#inputBar{display:flex;gap:6px;padding:8px;background:#1e1e1e}#inputBar input{flex:1;margin:0}.icon{width:44px;background:#333;color:#fff}
#statusList,#groupList{padding:10px;overflow:auto}.sItem{background:#2a2a2a;padding:10px;border-radius:10px;margin-bottom:8px;display:flex;gap:10px;align-items:center}.sItem img{width:50px;height:50px;border-radius:50%;object-fit:cover}
#callModal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:100}#callBox{background:#1e1e1e;padding:20px;border-radius:16px;width:90%;max-width:340px;text-align:center}video{width:100%;border-radius:12px;background:#000;margin:6px 0}
</style></head><body>
<div id="login"><div class="card"><h2>MayorChatZ PRO 🔒</h2><small style="color:#25D366">🔒 End-to-end encrypted</small><input id="nameIn" placeholder="Your name"><button onclick="login()">Enter</button></div></div>
<div id="top"><div><b>MayorChatZ PRO</b> <span style="font-size:10px;color:#25D366">🔒 E2E</span><br><small id="onlineCount" style="color:#25D366">0 online</small></div><div style="display:flex;gap:6px"><button onclick="shareLink()" style="width:auto;padding:6px 10px;background:#333;color:#fff;margin:0">📤</button><button onclick="addGroup()" style="width:auto;padding:6px 10px;background:#333;color:#fff;margin:0">👥+</button></div></div>
<div id="tabs"><div class="tab active" onclick="showTab('chat',this)">Chats</div><div class="tab" onclick="showTab('status',this)">Status</div><div class="tab" onclick="showTab('groups',this)">Groups</div></div>
<div id="content">
<div id="chatPane" style="flex:1;display:flex;flex-direction:column"><div id="msgs"></div><div id="inputBar"><label class="icon" style="display:flex;align-items:center;justify-content:center;border-radius:10px">📷<input type="file" hidden accept="image/*,video/*" onchange="sendMedia(this)"></label><input id="msgIn" placeholder="🔒 Type..."><button class="icon" onclick="toggleRec()" id="recBtn">🎤</button><button onclick="send()" style="width:60px;margin:0;background:#25D366">Send</button></div></div>
<div id="statusPane" style="display:none;flex:1;flex-direction:column"><div style="padding:10px"><label style="background:#25D366;color:#000;padding:8px 12px;border-radius:20px;cursor:pointer">+ Post Status 📷🎥<input type="file" hidden accept="image/*,video/*" onchange="postStatus(this)"></label></div><div id="statusList"></div></div>
<div id="groupPane" style="display:none;flex:1;flex-direction:column"><div id="groupList"></div></div>
</div>
<div id="callModal"><div id="callBox"><h3 id="callText"></h3><video id="localV" autoplay muted playsinline></video><video id="remoteV" autoplay playsinline></video><div style="display:flex;gap:8px;margin-top:10px"><button id="acceptBtn" onclick="acceptCall()" style="background:#25D366">Accept</button><button onclick="endCall()" style="background:#f44">End</button></div></div></div>
<script>
let myName="",currentGroup="General",recorder,chunks=[],recording=false,localStream,pc,currentCall,incomingCall;
function login(){myName=document.getElementById('nameIn').value.trim();if(!myName)return alert('name');document.getElementById('login').style.display='none';setInterval(ping,3000);setInterval(loadAll,2000);ping();}
function ping(){fetch('/api/online',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:myName})});}
function showTab(t,el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById('chatPane').style.display=t=='chat'?'flex':'none';document.getElementById('statusPane').style.display=t=='status'?'flex':'none';document.getElementById('groupPane').style.display=t=='groups'?'flex':'none';if(el)el.classList.add('active');if(t=='chat')loadMsgs();if(t=='status')loadStatus();if(t=='groups')loadGroups();}
async function loadAll(){loadUsers();loadMsgs();loadStatus();loadGroups();checkCalls();}
async function loadUsers(){let r=await fetch('/api/users');let d=await r.json();document.getElementById('onlineCount').innerText=d.count+' online';}
async function loadMsgs(){let r=await fetch('/api/messages?group='+currentGroup);let m=await r.json();let box=document.getElementById('msgs');box.innerHTML=m.map(x=>{let media='';if(x.type=='image')media=`<img src="${x.data}">`;if(x.type=='video')media=`<video src="${x.data}" controls></video>`;if(x.type=='audio')media=`<audio src="${x.data}" controls></audio>`;let del=x.name==myName?`<span class="del" onclick="delMsg('${x.id}')">🗑️</span>`:'';return `<div class="m ${x.name==myName?'me':''}">${del}<b style="font-size:10px">${x.name} 🔒</b><br>${x.text||''}${media}<br><small style="font-size:9px;opacity:.5">${x.time}</small></div>`}).join('');box.scrollTop=box.scrollHeight;}
async function send(){let t=document.getElementById('msgIn').value;if(!t)return;document.getElementById('msgIn').value='';await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:myName,text:t,type:'text',group:currentGroup})});loadMsgs();}
async function sendMedia(inp){let f=inp.files[0];let rd=new FileReader();rd.onload=async e=>{let type=f.type.startsWith('video')?'video':'image';await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:myName,type,data:e.target.result,group:currentGroup})});loadMsgs();};rd.readAsDataURL(f);}
async function delMsg(id){if(!confirm('Delete?'))return;await fetch('/api/messages/'+id,{method:'DELETE'});loadMsgs();}
async function toggleRec(){if(!recording){let s=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(s);chunks=[];recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=async ()=>{let blob=new Blob(chunks,{type:'audio/webm'});let rd=new FileReader();rd.onload=async e=>{await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:myName,type:'audio',data:e.target.result,group:currentGroup})});loadMsgs();};rd.readAsDataURL(blob);};recorder.start();recording=true;document.getElementById('recBtn').innerText='⏹️';}else{recorder.stop();recording=false;document.getElementById('recBtn').innerText='🎤';}}
async function postStatus(inp){let f=inp.files[0];let rd=new FileReader();rd.onload=async e=>{let type=f.type.startsWith('video')?'video':'image';await fetch('/api/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:myName,type,data:e.target.result})});loadStatus();};rd.readAsDataURL(f);}
async function loadStatus(){let r=await fetch('/api/status');let s=await r.json();document.getElementById('statusList').innerHTML=s.map(x=>`<div class="sItem">${x.type=='image'?`<img src="${x.data}">`:`<video src="${x.data}" style="width:50px;height:50px;border-radius:50%"></video>`}<div><b>${x.name}</b><br><small>just now</small></div></div>`).join('')||'<p style="color:#666;padding:10px">No status</p>';}
async function loadGroups(){let r=await fetch('/api/groups');let g=await r.json();document.getElementById('groupList').innerHTML=g.map(x=>`<div class="sItem" onclick="joinGroup('${x.name}')" style="cursor:pointer"><div style="width:40px;height:40px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center">👥</div><div><b>${x.name}</b><br><small>${currentGroup==x.name?'✅ Joined':'Tap to join'}</small></div></div>`).join('');}
async function addGroup(){let n=prompt('Group name:');if(!n)return;await fetch('/api/groups',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})});loadGroups();}
function joinGroup(n){currentGroup=n;alert('Joined '+n+' - 🔒 encrypted');loadMsgs();document.querySelectorAll('.tab')[0].click();}
async function shareLink(){await navigator.clipboard.writeText(location.href);alert('Link copied');}
let ice=[{urls:'stun:stun.l.google.com:19302'}];
async function checkCalls(){let r=await fetch('/api/calls?user='+myName);let cs=await r.json();if(!cs.length)return;let c=cs[cs.length-1];if(c.accepted)return;incomingCall=c;document.getElementById('callText').innerText=c.from+' calling ('+c.type+')';document.getElementById('callModal').style.display='flex';}
async function endCall(){document.getElementById('callModal').style.display='none';if(pc)pc.close();}
</script></body></html>
