<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>MayorChatZ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#0f0f0f;color:#fff;height:100vh;display:flex;flex-direction:column}
#login{position:fixed;inset:0;background:#0f0f0f;display:flex;align-items:center;justify-content:center;z-index:99}
.card{background:#1a1a1a;padding:24px;border-radius:16px;width:90%;max-width:340px}
input,button{padding:12px;border-radius:10px;border:none}input{background:#2a2a2a;color:#fff;width:100%;margin-top:10px}button{background:#25D366;color:#000;font-weight:700;cursor:pointer;width:100%;margin-top:10px}
#top{padding:12px;background:#1a1a1a;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center}
#onlineList{padding:8px;background:#1a1a1a;display:flex;gap:8px;overflow:auto;white-space:nowrap;border-bottom:1px solid #333}
.userChip{background:#2a2a2a;padding:6px 10px;border-radius:20px;font-size:12px;display:flex;gap:6px;align-items:center}
#msgs{flex:1;overflow:auto;padding:12px;background:#0f0f0f}.m{background:#2a2a2a;padding:10px 14px;border-radius:14px;margin-bottom:10px;max-width:85%;word-break:break-word}.m.me{margin-left:auto;background:#25D366;color:#000}.m img,.m video{max-width:100%;border-radius:10px;margin-top:6px;display:block}
#inputBar{display:flex;gap:6px;padding:10px;background:#1a1a1a;position:sticky;bottom:0}#inputBar input{flex:1;margin:0}.icon{width:46px;background:#333;color:#fff;font-size:18px}
#callModal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:100}
#callBox{background:#1a1a1a;padding:20px;border-radius:16px;text-align:center;width:92%;max-width:360px}video{width:100%;border-radius:12px;background:#000;margin:8px 0}
</style></head><body>
<div id="login"><div class="card"><h2>MayorChatZ 🔥</h2><p style="color:#888;font-size:13px;margin-top:6px">Enter name to join</p><input id="nameIn" placeholder="e.g DE mayors"><button onclick="login()">Enter Chat</button></div></div>
<div id="top"><div><b>MayorChatZ CALLS</b><br><small id="onlineCount" style="color:#25D366">0 online</small></div><button onclick="shareLink()" style="width:auto;padding:8px 12px;background:#333;color:#fff;margin:0">📤 Share</button></div>
<div id="onlineList"></div>
<div id="msgs"><p style="color:#666;text-align:center;margin-top:40px">No messages yet<br>Be first to post photo/video!</p></div>
<div id="inputBar"><label class="icon" style="display:flex;align-items:center;justify-content:center;border-radius:10px;cursor:pointer">📷<input type="file" id="photoIn" accept="image/*,video/*" hidden onchange="sendMedia(this)"></label><input id="msgIn" placeholder="Type message..." onkeypress="if(event.key=='Enter')send()"><button onclick="send()" style="width:60px;margin:0">Send</button></div>
<div id="callModal"><div id="callBox"><h3 id="callText">Incoming call...</h3><video id="localV" autoplay muted playsinline style="display:none"></video><video id="remoteV" autoplay playsinline></video><div style="display:flex;gap:8px;margin-top:10px"><button id="acceptBtn" onclick="acceptCall()" style="background:#25D366">Accept</button><button onclick="endCall()" style="background:#f44">End</button></div><p id="callStatus" style="color:#888;font-size:12px;margin-top:8px"></p></div></div>
<script>
let myName="",localStream,pc,currentCall=null,incomingCall=null;
function login(){myName=document.getElementById('nameIn').value.trim();if(!myName)return alert('Enter name');document.getElementById('login').style.display='none';setInterval(ping,3000);setInterval(loadMsgs,2000);setInterval(loadUsers,3000);setInterval(checkCalls,2000);ping();}
function ping(){fetch('/api/online',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:myName})});}
async function loadUsers(){let r=await fetch('/api/users');let d=await r.json();document.getElementById('onlineCount').innerText=d.count+' online';let html='';d.list.forEach(u=>{if(u==myName)return;html+=`<div class="userChip"><span>🟢 ${u}</span><button onclick="makeCall('${u}','voice')" style="width:auto;padding:4px 6px;margin:0;font-size:12px;background:#25D366">📞</button><button onclick="makeCall('${u}','video')" style="width:auto;padding:4px 6px;margin:0;font-size:12px;background:#25D366">📹</button></div>`});document.getElementById('onlineList').innerHTML=html||'<span style="color:#666;font-size:12px;padding:6px">Only you online - share link to invite</span>';}
async function loadMsgs(){let r=await fetch('/api/messages');let m=await r.json();if(!m.length)return;let box=document.getElementById('msgs');box.innerHTML=m.map(x=>{let media='';if(x.type=='image')media=`<img src="${x.data}">`;if(x.type=='video')media=`<video src="${x.data}" controls></video>`;return `<div class="m ${x.name==myName?'me':''}"><b style="font-size:11px">${x.name}</b><br>${x.text||''}${media}<br><small style="font-size:10px;opacity:.6">${x.time||''}</small></div>`}).join('');box.scrollTop=box.scrollHeight;}
async function send(){let t=document.getElementById('msgIn').value;if(!t)return;document.getElementById('msgIn').value='';await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:myName,text:t,type:'text'})});loadMsgs();}
async function sendMedia(inp){let f=inp.files[0];if(!f)return;let reader=new FileReader();reader.onload=async e=>{let type=f.type.startsWith('video')?'video':'image';await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:myName,text:'',type,data:e.target.result})});loadMsgs();};reader.readAsDataURL(f);}
async function shareLink(){let l=location.href;await navigator.clipboard.writeText(l);alert('Link copied! Send to friends: '+l);}
let ice=[{urls:'stun:stun.l.google.com:19302'}];
async function makeCall(to,type){currentCall={to,type};document.getElementById('callText').innerText=`Calling ${to}...`;document.getElementById('callStatus').innerText='Ringing...';document.getElementById('callModal').style.display='flex';document.getElementById('acceptBtn').style.display='none';localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:type=='video'});document.getElementById('localV').style.display=type=='video'?'block':'none';document.getElementById('localV').srcObject=localStream;pc=new RTCPeerConnection({iceServers:ice});localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));pc.ontrack=e=>document.getElementById('remoteV').srcObject=e.streams[0];let o=await pc.createOffer();await pc.setLocalDescription(o);await fetch('/api/calls',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from:myName,to,type,data:JSON.stringify(o)})});}
async function checkCalls(){let r=await fetch('/api/calls?user='+myName);let cs=await r.json();if(!cs.length)return;let c=cs[cs.length-1];if(c.accepted)return;if(incomingCall&&incomingCall.id==c.id)return;incomingCall=c;document.getElementById('callText').innerText=`${c.from} calling you (${c.type})`;document.getElementById('callStatus').innerText='Incoming call';document.getElementById('acceptBtn').style.display='block';document.getElementById('callModal').style.display='flex';}
async function acceptCall(){let c=incomingCall;localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:c.type=='video'});document.getElementById('localV').style.display=c.type=='video'?'block':'none';document.getElementById('localV').srcObject=localStream;pc=new RTCPeerConnection({iceServers:ice});localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));pc.ontrack=e=>document.getElementById('remoteV').srcObject=e.streams[0];let off=JSON.parse(c.data);await pc.setRemoteDescription(off);let ans=await pc.createAnswer();await pc.setLocalDescription(ans);await fetch('/api/calls/'+c.id,{method:'PUT'});currentCall=c;incomingCall=null;document.getElementById('acceptBtn').style.display='none';}
async function endCall(){document.getElementById('callModal').style.display='none';if(pc)pc.close();if(localStream)localStream.getTracks().forEach(t=>t.stop());if(currentCall&&currentCall.id)await fetch('/api/calls/'+currentCall.id,{method:'DELETE'});if(incomingCall)await fetch('/api/calls/'+incomingCall.id,{method:'DELETE'});currentCall=null;incomingCall=null;document.getElementById('remoteV').srcObject=null;}
</script></body></html>
