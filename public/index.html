<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MayorChatZ PRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial;background:#111;color:#fff;height:100vh;display:flex;flex-direction:column}
#top{background:#202c33;padding:12px;display:flex;justify-content:space-between;align-items:center}
#tabs{display:flex;background:#202c33} #tabs div{flex:1;padding:12px;text-align:center;cursor:pointer;border-bottom:3px solid transparent} #tabs.active{border-color:#00a884;color:#00a884}
#chats,#statusList,#groupList{flex:1;overflow-y:auto;padding:10px;background:#0b141a}
.msg{background:#202c33;margin:6px 0;padding:8px 10px;border-radius:8px;max-width:80%}.msg.me{background:#005c4b;margin-left:auto}
.msg img{width:100%;border-radius:8px;margin-top:6px;cursor:pointer}.msg video{width:100%;border-radius:8px;margin-top:6px}
#bottom{display:flex;padding:8px;background:#202c33;gap:6px;align-items:center}
#input{flex:1;padding:10px;border-radius:20px;border:none;background:#2a3942;color:#fff}
button{background:#00a884;border:none;padding:10px 14px;border-radius:20px;color:#fff;font-weight:bold;cursor:pointer}
#statusView img,#statusView video{width:100%;max-height:70vh;border-radius:10px}
</style>
</head>
<body>
<div id="top"><b>MayorChatZ PRO 🔒 <span id="online">0 online</span></b><button onclick="share()">📤 Share</button></div>
<div id="tabs"><div id="tabC" class="active" onclick="showTab('chats')">Chats</div><div onclick="showTab('status')">Status</div><div onclick="showTab('groups')">Groups</div></div>

<div id="chats"></div>
<div id="statusList" style="display:none"></div>
<div id="groupList" style="display:none"><button onclick="createGroup()">👥+ Create Group</button><div id="groups"></div></div>

<div id="bottom"><button onclick="document.getElementById('file').click()">📷</button><input id="file" type="file" accept="image/*,video/*" style="display:none" onchange="sendFile(this)"><input id="input" placeholder="🔒 Type..."><button id="recBtn" onmousedown="startRec()" onmouseup="stopRec()" ontouchstart="startRec()" ontouchend="stopRec()">🎤</button><button onclick="sendMsg()">Send</button></div>

<script>
let myName=localStorage.getItem('mcName')||prompt('Your name?')||'User'; localStorage.setItem('mcName',myName);
let currentGroup=localStorage.getItem('mcGroup')||'General'; let mediaRec=null, chunks=[];
function showTab(t){
 document.getElementById('chats').style.display=t==='chats'?'block':'none';
 document.getElementById('statusList').style.display=t==='status'?'block':'none';
 document.getElementById('groupList').style.display=t==='groups'?'block':'none';
 document.querySelectorAll('#tabs div').forEach(d=>d.classList.remove('active'));
 if(t==='chats')document.getElementById('tabC').classList.add('active');
 if(t==='status')loadStatus(); if(t==='groups')loadGroups();
}
async function fetchMsgs(){ let r=await fetch('/api/messages?group='+currentGroup); let data=await r.json(); let c=document.getElementById('chats'); c.innerHTML=''; data.forEach(m=>{
  let isMe=m.name===myName; let div=document.createElement('div'); div.className='msg'+(isMe?' me':'');
  let html=`<b>${m.name}</b><small style="float:right">${m.time||''}</small><br>${m.text||''}`;
  if(m.media){ if(m.mediaType&&m.mediaType.includes('image')) html+=`<br><img src="${m.media}" onclick="window.open('${m.media}')">`; else if(m.mediaType&&m.mediaType.includes('video')) html+=`<br><video src="${m.media}" controls></video>`; else if(m.media.startsWith('data:image')) html+=`<br><img src="${m.media}" onclick="window.open('${m.media}')">`; else html+=`<br><video src="${m.media}" controls></video>`; }
  if(m.audio) html+=`<br><audio src="${m.audio}" controls></audio>`;
  if(isMe) html+=` <span style="cursor:pointer" onclick="delMsg('${m.id}')">🗑️ Delete</span>`;
  div.innerHTML=html; c.appendChild(div);
 }); c.scrollTop=c.scrollHeight;
}
async function sendMsg(){ let txt=document.getElementById('input').value; if(!txt.trim())return; await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:myName,text:txt,group:currentGroup})}); document.getElementById('input').value=''; fetchMsgs(); }
async function sendFile(inp){ let file=inp.files[0]; if(!file)return; if(file.size>15*1024*1024){alert('File too big! Use <15MB, trim video to <15 sec');return} let reader=new FileReader(); reader.onload=async e=>{ let media=e.target.result; await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:myName,text:'',media:media,mediaType:file.type,group:currentGroup})}); fetchMsgs(); }; reader.readAsDataURL(file); inp.value=''; }
async function delMsg(id){ if(!confirm('Delete?'))return; await fetch('/api/messages/'+id,{method:'DELETE'}); fetchMsgs(); }
async function loadStatus(){ let r=await fetch('/api/status'); let data=await r.json(); let c=document.getElementById('statusList'); c.innerHTML='<button onclick="postStatus()">📝+ Text Status</button> <button onclick="document.getElementById(\'statusFile\').click()">📷🎥 Media Status</button><input id=\'statusFile\' type=\'file\' accept=\'image/*,video/*\' style=\'display:none\' onchange=\'sendStatusFile(this)\'><hr>'; data.slice().reverse().forEach(s=>{ let d=document.createElement('div'); d.className='msg'; let h=`<b>${s.name}</b> <small>${s.time}</small><br>${s.text||''}`; if(s.media){ if(s.mediaType&&s.mediaType.includes('image')) h+=`<br><img src="${s.media}">`; else h+=`<br><video src="${s.media}" controls></video>`; } d.innerHTML=h; c.appendChild(d); }); }
async function postStatus(){ let t=prompt('Status text?'); if(!t)return; await fetch('/api/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:myName,text:t})}); loadStatus(); }
async function sendStatusFile(inp){ let file=inp.files[0]; if(!file)return; let r=new FileReader(); r.onload=async e=>{ await fetch('/api/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:myName,text:'',media:e.target.result,mediaType:file.type})}); loadStatus(); }; r.readAsDataURL(file); }
async function loadGroups(){ let r=await fetch('/api/groups'); let data=await r.json(); let c=document.getElementById('groups'); c.innerHTML=''; data.forEach(g=>{ let d=document.createElement('div'); d.className='msg'; d.innerHTML=`${g.name} <button onclick="joinGroup('${g.name}')">Join</button>`; c.appendChild(d); }); }
async function createGroup(){ let n=prompt('Group name?'); if(!n)return; await fetch('/api/groups',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})}); loadGroups(); }
function joinGroup(n){ currentGroup=n; localStorage.setItem('mcGroup',n); showTab('chats'); fetchMsgs(); alert('Joined '+n); }
function share(){ navigator.clipboard.writeText(location.href); alert('Link copied! '+location.href); }
async function updateOnline(){ await fetch('/api/online',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:myName})}); let r=await fetch('/api/users'); let d=await r.json(); document.getElementById('online').innerText=d.count+' online'; }
function startRec(){ navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{ mediaRec=new MediaRecorder(s); chunks=[]; mediaRec.ondataavailable=e=>chunks.push(e.data); mediaRec.onstop=async ()=>{ let blob=new Blob(chunks,{type:'audio/webm'}); let rd=new FileReader(); rd.onload=async e=>{ await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:myName,audio:e.target.result,group:currentGroup})}); fetchMsgs(); }; rd.readAsDataURL(blob); }; mediaRec.start(); }); }
function stopRec(){ if(mediaRec&&mediaRec.state==='recording')mediaRec.stop(); }
document.getElementById('input').addEventListener('keydown',e=>{ if(e.key==='Enter')sendMsg(); });
setInterval(()=>{ fetchMsgs(); updateOnline(); },3000); fetchMsgs(); updateOnline();
</script>
</body>
</html>
