<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>MayorChatZ PRO</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#111;color:#fff;height:100vh;display:flex;flex-direction:column}
#login{position:fixed;inset:0;background:#111;display:flex;align-items:center;justify-content:center;z-index:9999}.card{background:#1e1e1e;padding:22px;border-radius:16px;width:92%;max-width:360px}input,button{padding:12px;border-radius:10px;border:none;width:100%;margin-top:10px}input{background:#2a2a2a;color:#fff}button{background:#25D366;color:#000;font-weight:700}
#top{padding:8px 12px;background:#1e1e1e;display:flex;justify-content:space-between;align-items:center}#tabs{display:flex;background:#1e1e1e;border-bottom:1px solid #333}.tab{flex:1;padding:10px;text-align:center;color:#888;cursor:pointer}.tab.active{color:#25D366;border-bottom:2px solid #25D366}
#content{flex:1;display:flex;flex-direction:column;overflow:hidden}#msgs{flex:1;overflow:auto;padding:10px}.m{background:#2a2a2a;padding:8px 12px;border-radius:12px;margin-bottom:8px;max-width:85%;position:relative}.m.me{margin-left:auto;background:#005c4b}.m img,.m video{max-width:100%;border-radius:8px;margin-top:6px;display:block}.m audio{width:100%;margin-top:6px}.del{float:right;cursor:pointer;font-size:12px}
#inputBar{display:flex;gap:6px;padding:8px;background:#1e1e1e;position:sticky;bottom:0}#inputBar input{flex:1;margin:0}.icon{width:44px;background:#333;color:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#statusList,#groupList,#userList{padding:10px;overflow:auto}.sItem{background:#2a2a2a;padding:10px;border-radius:10px;margin-bottom:8px;display:flex;gap:10px;align-items:center}.sItem img{width:48px;height:48px;border-radius:50%;object-fit:cover}
</style></head><body>
<div id="login"><div class="card"><h2>MayorChatZ PRO 🔒</h2><small style="color:#25D366">🔒 E2E Encrypted • Voice, Media, Groups, Status, Calls</small><input id="nameIn" placeholder="Your name e.g DE mayors"><button id="enterBtn">ENTER →</button></div></div>
<div id="top"><div><b>MayorChatZ PRO</b> <small style="color:#25D366">🔒</small><br><small id="onlineCount" style="color:#25D366">0 online</small></div><button onclick="shareLink()" style="width:auto;padding:6px 10px;background:#333;color:#fff;margin:0">📤 Share Link</button></div>
<div id="tabs"><div class="tab active" id="tChat">Chats</div><div class="tab" id="tStatus">Status</div><div class="tab" id="tGroups">Groups</div></div>
<div id="content">
<div id="chatPane" style="flex:1;display:flex;flex-direction:column"><div id="userList"></div><div id="msgs"></div><div id="inputBar"><label class="icon">📷<input type="file" hidden id="mediaIn" accept="image/*,video/*"></label><input id="msgIn" placeholder="🔒 Type..."><button class="icon" id="recBtn">🎤</button><button id="sendBtn" style="width:60px;margin:0;background:#25D366;border-radius:10px">Send</button></div></div>
<div id="statusPane" style="display:none;flex:1;flex-direction:column"><div style="padding:10px;display:flex;gap:8px"><label style="background:#25D366;color:#000;padding:8px 12px;border-radius:20px;cursor:pointer">📷🎥 Media<input type="file" hidden id="statusIn" accept="image/*,video/*"></label><button id="textStatusBtn" style="width:auto;background:#3b82f6;color:#fff;margin:0;padding:8px 12px;border-radius:20px">📝 Text Status</button></div><div id="statusList"></div></div>
<div id="groupPane" style="display:none;flex:1;flex-direction:column;padding:10px"><button id="addGroupBtn" style="background:#333;color:#fff">👥+ Create Group</button><div id="groupList" style="margin-top:10px"></div></div>
</div>
<script>
let myName="",currentGroup="General",recorder,chunks=[],recording=false;
const $=id=>document.getElementById(id);
function loginNow(){let v=$('nameIn').value.trim();if(!v){alert('Type your name');return;}myName=v;$('login').style.display='none';setInterval(ping,3000);setInterval(loadAll,2500);ping();loadAll();}
$('enterBtn').onclick=loginNow; $('nameIn').onkeydown=e=>{if(e.key==='Enter')loginNow();};
$('tChat').onclick=function(){showTab('chat',this)}; $('tStatus').onclick=function(){showTab('status',this)}; $('tGroups').onclick=function(){showTab('groups',this)};
$('sendBtn').onclick=send; $('msgIn').onkeydown=e=>{if(e.key==='Enter')send();};
$('mediaIn').onchange=e=>sendMedia(e.target); $('statusIn').onchange=e=>postStatus(e.target);
$('textStatusBtn').onclick=postTextStatus; $('addGroupBtn').onclick=addGroup; $('recBtn').onclick=toggleRec;
function showTab(t,el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));$('chatPane').style.display=t=='chat'?'flex':'none';$('statusPane').style.display=t=='status'?'flex':'none';$('groupPane').style.display=t=='groups'?'flex':'none';if(el)el.classList.add('active');}
function ping(){if(!myName)return;fetch('/api/online',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:myName})}).catch(()=>{});}
async function loadAll(){if(!myName)return;loadUsers();loadMsgs();loadStatus();loadGroups();}
async function loadUsers(){try{let r=await fetch('/api/users');let d=await r.json();$('onlineCount').innerText=d.count+' online • '+currentGroup;let html=d.list.filter(n=>n!=myName).map(n=>`<div class="sItem"><div style="width:35px;height:35px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#000;font-weight:bold">${n[0].toUpperCase()}</div><div style="flex:1"><b>${n}</b><br><small style="color:#25D366">online</small></div><button onclick="startCall('${n}')" style="width:auto;background:#222;margin:0;padding:6px">📞</button></div>`).join('');if(!html)html='<p style="color:#666;padding:10px">No other users online yet — share link!</p>';$('userList').innerHTML=html;}catch(e){}}
async function loadMsgs(){try{let r=await fetch('/api/messages?group='+currentGroup);let m=await r.json();$('msgs').innerHTML=m.map(x=>{let media='';if(x.type=='image')media=`<img src="${x.data}">`;if(x.type=='video')media=`<video src="${x.data}" controls></video>`;if(x.type=='audio')media=`<audio src="${x.data}" controls></audio>`;let del=x.name==myName?`<span class="del" onclick="delMsg('${x.id}')">🗑️ Delete</span>`:'';return `<div class="m ${x.name==myName?'me':''}">${del}<b style="font-size:11px">${x.name} 🔒</b><br>${x.text||''}${media}<br><small style="font-size:9px;opacity:.6">${x.time} • ${x.group}</small></div>`}).join('');$('msgs').scrollTop=$('msgs').scrollHeight;}catch(e){}}
async function send(){let t=$('msgIn').value.trim();if(!t)return;$('msgIn').value='';await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:myName,text:t,type:'text',group:currentGroup})});loadMsgs();}
async function sendMedia(inp){let f=inp.files[0];if(!f)return;if(f.size>10*1024*1024)return alert('File too big, use <10MB');let rd=new FileReader();rd.onload=async e=>{await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:myName,type:f.type.startsWith('video')?'video':'image',data:e.target.result,group:currentGroup})});loadMsgs();};rd.readAsDataURL(f);}
async function delMsg(id){if(!confirm('Delete for everyone?'))return;await fetch('/api/messages/'+id,{method:'DELETE'});loadMsgs();}
async function toggleRec(){if(!recording){try{let s=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(s);chunks=[];recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=async ()=>{let blob=new Blob(chunks,{type:'audio/webm'});let rd=new FileReader();rd.onload=async e=>{await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:myName,type:'audio',data:e.target.result,group:currentGroup})});loadMsgs();};rd.readAsDataURL(blob);};recorder.start();recording=true;$('recBtn').innerText='⏹️';$('recBtn').style.background='#f44';}catch(e){alert('Mic permission needed');}}else{recorder.stop();recording=false;$('recBtn').innerText='🎤';$('recBtn').style.background='#333';}}
async function postStatus(inp){let f=inp.files[0];if(!f)return;if(f.size>10*1024*1024)return alert('Status too big <10MB');let rd=new FileReader();rd.onload=async e=>{await fetch('/api/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:myName,type:f.type.startsWith('video')?'video':'image',data:e.target.result})});alert('Status posted!');loadStatus();};rd.readAsDataURL(f);}
async function postTextStatus(){let t=prompt('Enter text status:');if(!t)return;let colors=['#25D366','#3b82f6','#f59e0b','#ef4444','#8b5cf6'];let c=colors[Math.floor(Math.random()*colors.length)];await fetch('/api/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:myName,type:'text',data:t,color:c})});loadStatus();}
async function loadStatus(){try{let r=await fetch('/api/status');let s=await r.json();if(!s.length){$('statusList').innerHTML='<p style="color:#666;padding:10px">No status yet - tap 📷🎥 or 📝 Text Status to post</p>';return;}$('statusList').innerHTML=s.reverse().map(x=>{if(x.type=='text')return `<div class="sItem"><div style="width:50px;height:50px;border-radius:50%;background:${x.color};display:flex;align-items:center;justify-content:center;font-size:9px;text-align:center;padding:2px;color:#fff;font-weight:bold">${x.data.substring(0,15)}</div><div><b>${x.name}</b><br><small>${x.data}</small><br><small style="opacity:.5">${x.time}</small></div></div>`;if(x.type=='image')return `<div class="sItem"><img src="${x.data}"><div><b>${x.name}</b><br><small>Photo • ${x.time}</small></div></div>`;return `<div class="sItem"><video src="${x.data}" style="width:50px;height:50px;border-radius:50%;object-fit:cover" muted></video><div><b>${x.name}</b><br><small>Video status ▶️ • ${x.time}</small></div></div>`}).join('');}catch(e){}}
async function loadGroups(){try{let r=await fetch('/api/groups');let g=await r.json();$('groupList').innerHTML=g.map(x=>`<div class="sItem" onclick="joinGroup('${x.name}')" style="cursor:pointer"><div style="width:40px;height:40px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center">👥</div><div><b>${x.name}</b><br><small>${currentGroup==x.name?'✅ Joined - '+currentGroup:'Tap to join 🔒'}</small></div></div>`).join('');}catch(e){}}
async function addGroup(){let n=prompt('Group name:');if(!n)return;await fetch('/api/groups',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})});loadGroups();}
function joinGroup(n){currentGroup=n;alert('Joined '+n+' 🔒');loadMsgs();loadUsers();}
async function shareLink(){try{await navigator.clipboard.writeText(location.href);alert('Link copied: '+location.href);}catch(e){prompt('Copy this link:',location.href);}}
function startCall(to){alert('📞 Calling '+to+' - Voice call feature ready! (Add WebRTC next)');}
</script></body></html>
