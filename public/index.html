<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>MayorchatzZ Ultra</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:var(--bg);color:var(--c)}:root{--bg:#111;--c:#fff;--card:#202c33;--me:#005c4b;--oth:#202c33;--top:#075E54}body.light{--bg:#e5ddd5;--c:#000;--card:#f0f0f0;--me:#dcf8c6;--oth:#fff;--top:#128C7E}header{background:var(--top);padding:12px 10px;display:flex;justify-content:space-between;align-items:center}#hBtns{display:flex;gap:6px}button{border:none;padding:6px 10px;border-radius:6px;font-weight:bold;cursor:pointer}#auth{padding:25px;max-width:400px;margin:auto}input,select{width:100%;padding:12px;margin:7px 0;border-radius:10px;border:none;font-size:15px}button.main{width:100%;padding:13px;background:#25D366;color:#000;font-size:16px;margin-top:10px}#chat{display:none;flex-direction:column;height:calc(100vh - 52px)}#online{font-size:12px;padding:8px 10px;background:var(--card);border-bottom:1px solid #333;display:flex;gap:6px;flex-wrap:wrap}#msgs{flex:1;overflow-y:auto;padding:12px;background:var(--bg)}.msg{margin:7px 0;padding:8px 12px;border-radius:10px;max-width:82%;word-break:break-word;position:relative}.me{background:var(--me);margin-left:auto}.other{background:var(--oth)}.msg img{max-width:100%;border-radius:8px;margin-top:6px}audio{width:100%;margin-top:5px}small{font-size:10px;opacity:.6}.del{font-size:10px;color:#ff8a65;cursor:pointer;margin-left:6px}#typing{font-size:11px;color:#25D366;padding:2px 10px;height:16px}#inputArea{display:flex;padding:8px;background:var(--card);gap:6px;align-items:center}#inputArea input{flex:1;margin:0}#inputArea label,#inputArea button{width:auto;padding:10px;background:#25D366;border-radius:8px;font-weight:bold;color:#000}</style></head><body><header><b>MayorchatzZ 🔥</b><div id="hBtns"><button onclick="toggleTheme()">🌙</button><button id="share" onclick="shareLink()" style="display:none;background:#25D366">Share</button><button id="logout" onclick="logout()" style="display:none;background:#f15a29;color:#fff">Logout</button></div></header><div id="auth"><h2 id="ft" style="margin-bottom:12px">Create Account</h2><input id="name" placeholder="Your Name"><select id="avatar"><option>👤</option><option>😎</option><option>🔥</option><option>👑</option><option>💀</option><option>😍</option><option>🚀</option><option>🎮</option></select><input id="phone" placeholder="Phone"><input id="pass" type="password" placeholder="Password"><button class="main" onclick="doAuth()" id="ab">Signup</button><p style="margin-top:12px;text-align:center"><span id="tt">Have account?</span> <a href="#" onclick="tog()">Login</a></p></div><div id="chat"><div id="online"></div><div id="msgs"></div><div id="typing"></div><div id="inputArea"><label for="fileIn">📸</label><input type="file" id="fileIn" accept="image/*" hidden onchange="sendImg(this)"><button id="recBtn" onclick="toggleRec()">🎤</button><input id="msgIn" placeholder="Message..." oninput="sendTyping()" onkeypress="if(event.key==='Enter')sendMsg()"><button onclick="sendMsg()">Send</button></div></div><script>let isLogin=false;let cur=localStorage.getItem('mayorUser');let ava=localStorage.getItem('mayorAvatar')||'👤';let last=0,rec,recData=[];if(localStorage.getItem('theme')=='light')document.body.classList.add('light');function toggleTheme(){document.body.classList.toggle('light');localStorage.setItem('theme',document.body.classList.contains('light')?'light':'dark');}if(Notification&&Notification.permission!='granted')Notification.requestPermission();function check(){if(cur){auth.style.display='none';chat.style.display='flex';logout.style.display='block';share.style.display='block';loadM();loadU();}}check();function tog(){isLogin=!isLogin;ft.innerText=isLogin?'Login':'Signup';ab.innerText=isLogin?'Login':'Signup';tt.innerText=isLogin?"No account?":"Have account?";name.style.display=isLogin?'none':'block';avatar.style.display=isLogin?'none':'block';}async function doAuth(){let n=name.value.trim(),a=avatar.value,p=phone.value.trim(),pw=pass.value.trim();if(!p||!pw||(!isLogin&&!n))return alert('Fill all');let url=isLogin?'/api/login':'/api/signup',body=isLogin?{phone:p,password:pw}:{name:n,phone:p,password:pw,avatar:a};let r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(d.error)return alert(d.error=='exists'?'Exists':'Wrong pass');localStorage.setItem('mayorUser',isLogin?d.name:n);localStorage.setItem('mayorAvatar',isLogin?d.avatar:a);location.reload();}async function loadM(){let r=await fetch('/api/messages'),msgs=await r.json();if(msgs.length>last&&last!=0){let newM=msgs.slice(last);newM.forEach(m=>{if(m.user!=cur&&Notification&&Notification.permission=='granted'){new Notification(m.user,{body:m.type=='image'?'📸 Photo':m.type=='voice'?'🎤 Voice':m.text});let au=new Audio('https://notificationsounds.com/storage/sounds/file-sounds-1150-pristine.mp3');au.play().catch(()=>{});if(navigator.vibrate)navigator.vibrate(200);}});}last=msgs.length;let box=document.getElementById('msgs');box.innerHTML='';msgs.forEach(m=>{if(m.user!=cur)fetch('/api/read',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:m.id,user:cur})});let d=document.createElement('div');d.className='msg '+(m.user==cur?'me':'other');let content=m.text;if(m.type=='image')content=`<br><img src="${m.data}">`;if(m.type=='voice')content=`<br><audio controls src="${m.data}"></audio>`;let ticks=m.user==cur?(m.readBy.length>0?'✓✓<span style="color:#53bdeb">':'✓✓')+'</span>':'';let del=m.user==cur?`<span class=del onclick="delM('${m.id}')>[del]</span>`:'';d.innerHTML=`<b>${m.avatar} ${m.user}</b> ${del}<br>${content}<br><small>${m.time} ${ticks}</small>`;box.appendChild(d);});box.scrollTop=box.scrollHeight;}async function loadU(){let r=await fetch('/api/users'),u=await r.json();online.innerHTML='Online: '+u.map(x=>`${x.avatar} ${x.name}`).join(' • ');}async function sendTyping(){await fetch('/api/typing',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:cur})});}async function checkTyping(){let r=await fetch('/api/typing'),u=await r.json(),o=u.filter(x=>x!=cur);typing.innerText=o.length?o.join(', ')+' typing...':'';}async function sendMsg(){let t=msgIn.value.trim();if(!t)return;await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:cur,text:t,avatar:ava,type:'text'})});msgIn.value='';loadM();}async function sendImg(el){let f=el.files[0];if(!f)return;let rd=new FileReader();rd.onload=async()=>{await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:cur,avatar:ava,type:'image',data:rd.result})});loadM();};rd.readAsDataURL(f);}async function toggleRec(){if(!rec||rec.state=='inactive'){let s=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(s);recData=[];rec.ondataavailable=e=>recData.push(e.data);rec.onstop=async()=>{let blob=new Blob(recData,{type:'audio/webm'}),rd=new FileReader();rd.onload=async()=>{await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:cur,avatar:ava,type:'voice',data:rd.result})});loadM();};rd.readAsDataURL(blob);};rec.start();recBtn.innerText='⏹️';recBtn.style.background='red';}else{rec.stop();recBtn.innerText='🎤';recBtn.style.background='#25D366';}}async function delM(id){if(!confirm('Delete?'))return;await fetch('/api/messages/'+id,{method:'DELETE'});loadM();}function logout(){localStorage.removeItem('mayorUser');localStorage.removeItem('mayorAvatar');location.reload();}function shareLink(){let l='https://mayorchatzZ.onrender.com';navigator.share?navigator.share({title:'Join',url:l}):(navigator.clipboard.writeText(l),alert('Copied '+l));}setInterval(()=>{if(cur){loadM();loadU();checkTyping();}},2000);</script></body></html>
