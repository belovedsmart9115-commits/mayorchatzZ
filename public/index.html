<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MayorChatZ 👑</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#111b21;color:#e9edef;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#auth{flex:1;display:flex;align-items:center;justify-content:center}
.card{background:#202c33;padding:24px;border-radius:16px;width:92%;max-width:360px}
h2{color:#00a884;text-align:center;margin-bottom:16px}
input{width:100%;padding:14px;margin:8px 0;border:0;border-radius:10px;background:#2a3942;color:#fff;outline:none}
button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:10px;background:#00a884;color:#111b21;font-weight:800}
#app{display:none;flex:1;flex-direction:column;overflow:hidden;height:100vh}
.hdr{background:#202c33;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.tabs{display:flex;background:#202c33;border-top:1px solid #111b21;flex-shrink:0}
.tab{flex:1;text-align:center;padding:14px 0;color:#8696a0;border-bottom:3px solid transparent;font-size:14px}
.tab.active{color:#00a884;border-color:#00a884}
#content{flex:1;overflow-y:auto;background:#0b141a}
.item{padding:14px 16px;display:flex;gap:12px;border-bottom:1px solid #1f2c34;align-items:center;cursor:pointer;position:relative}
.av{width:48px;height:48px;border-radius:50%;background:#00a884;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;position:relative}
.dot{width:12px;height:12px;background:#00a884;border-radius:50%;position:absolute;bottom:0;right:0;border:2px solid #202c33}
#chatArea{display:none;flex-direction:column;flex:1;overflow:hidden;background:#0b141a}
#chatHead{padding:12px;background:#202c33;display:flex;gap:12px;align-items:center;flex-shrink:0;justify-content:space-between}
#msgs{flex:1;overflow-y:auto;padding:10px 0;display:flex;flex-direction:column}
.msg{max-width:78%;padding:8px 10px;border-radius:8px;margin:4px 16px;word-break:break-word;font-size:15px}
.me{background:#005c4b;margin-left:auto}
.other{background:#202c33}
.bar{display:flex;gap:8px;padding:10px;background:#202c33;flex-shrink:0}
.bar input{flex:1;border-radius:22px}
.send{width:48px;height:48px;border-radius:50%;background:#00a884;border:0;font-size:20px;flex-shrink:0}
#typing,#onlineCount{height:18px;padding:0 16px;color:#00a884;font-size:12px;flex-shrink:0}
.shareBtn{background:#25D366;color:#fff;padding:6px 12px;border-radius:20px;font-size:12px;border:0;cursor:pointer}
</style></head><body>
<div id="auth"><div class="card"><h2>MayorChatZ 👑</h2>
<input id="n" placeholder="Name"><input id="ph" placeholder="Phone"><input id="pw" type="password" placeholder="Password"><input id="av" placeholder="Avatar 👑">
<button id="btnS">Signup</button><button id="btnL" style="background:#2a3942;color:#fff">Login</button><div id="out" style="margin-top:10px;text-align:center;min-height:18px"></div>
</div></div>
<div id="app">
<div class="hdr"><div><b id="myName"></b><br><small id="myPh" style="color:#8696a0"></small><br><small id="onlineCount"></small></div><div style="display:flex;gap:10px;align-items:center"><button class="shareBtn" onclick="shareApp()">Share 🔗</button><span onclick="logout()" style="cursor:pointer">Logout</span></div></div>
<div class="tabs"><div class="tab" id="tStatus">Status</div><div class="tab active" id="tChats">Chats</div><div class="tab" id="tGroups">Groups</div></div>
<div id="content"></div><div id="typing"></div>
<div id="chatArea"><div id="chatHead"><div style="display:flex;gap:10px;align-items:center"><span onclick="closeChat()" style="font-size:20px;cursor:pointer">⬅️</span><div><b id="chatWith"></b><br><small id="chatOnline" style="color:#00a884"></small></div></div><button class="shareBtn" onclick="shareApp()">Invite</button></div><div id="msgs"></div><div class="bar"><input id="msgInput" placeholder="Type a message"><button class="send" id="sendBtn">➤</button></div></div>
</div>
<script>
let ME=null,CURR='all',USERS=[],ONLINE={};const $=id=>document.getElementById(id);
function showAuth(m,c){$('out').textContent=m;$('out').style.color=c||'#00a884'}
function initApp(u){ME=u;$('auth').style.display='none';$('app').style.display='flex';$('myName').textContent=u.name+' '+u.avatar;$('myPh').textContent=u.phone;setInterval(()=>fetch('/api/online',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:ME.name})}),3000);loadUsers();setTimeout(()=>loadChats(),300);setInterval(poll,2000)}
let saved=localStorage.getItem('mayor');if(saved){try{initApp(JSON.parse(saved))}catch{}}
$('btnS').addEventListener('click',async()=>{let b={name:$('n').value.trim(),phone:$('ph').value.trim(),password:$('pw').value.trim(),avatar:$('av').value.trim()||'👤'};if(!b.name||!b.phone||!b.password){showAuth('❌ Fill all','#f15c6d');return}showAuth('⏳...');let r=await fetch('/api/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});let j=await r.json();showAuth(j.error? (j.error==='exists'?'⚠️ Exists, Login':'❌ '+j.error):'✅ OK Login now', j.error?'#f15c6d':'#00a884')});
$('btnL').addEventListener('click',async()=>{let b={phone:$('ph').value.trim(),password:$('pw').value.trim()};if(!b.phone||!b.password){showAuth('❌ Fill phone & pass','#f15c6d');return}showAuth('⏳...');let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});let j=await r.json();if(j.error){showAuth('❌ Wrong','#f15c6d');return}let u={name:j.name,avatar:j.avatar,phone:b.phone};localStorage.setItem('mayor',JSON.stringify(u));initApp(u)});
function logout(){localStorage.removeItem('mayor');location.reload()}
window.shareApp=async()=>{let url='https://mayorchatzZ.onrender.com';let txt=`Join my MayorChatZ 👑 - My own WhatsApp!\n${url}`;if(navigator.share){try{await navigator.share({title:'MayorChatZ 👑',text:txt,url})}catch{}}else{await navigator.clipboard.writeText(txt);alert('✅ Link copied! Share to friends:\n'+url)}}
$('tStatus').onclick=e=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');loadStatus()}
$('tChats').onclick=e=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');loadChats()}
$('tGroups').onclick=e=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');loadGroups()}
async function loadUsers(){try{let r=await fetch('/api/users');USERS=await r.json()}catch{}}
async function loadChats(){$('content').style.display='block';$('chatArea').style.display='none';$('content').innerHTML='';let d=document.createElement('div');d.className='item';d.innerHTML=`<div class="av">🌍<div class="dot"></div></div><div><b>General Group</b><br><small style="color:#00a884">${Object.keys(ONLINE).length} online - Tap to chat</small></div>`;d.onclick=()=>openChat('all','General Group 🌍');$('content').appendChild(d);USERS.forEach(u=>{if(u.name===ME.name)return;let isOn=ONLINE[u.name];let x=document.createElement('div');x.className='item';x.innerHTML=`<div class="av">${u.avatar}${isOn?'<div class="dot"></div>':''}</div><div><b>${u.name}</b><br><small style="color:${isOn?'#00a884':'#8696a0'}">${isOn?'Online 🟢':'Offline'}</small></div>`;x.onclick=()=>openChat(u.name,u.name);$('content').appendChild(x)})}
async function loadGroups(){$('content').style.display='block';$('chatArea').style.display='none';$('content').innerHTML='<div class="item">Groups coming soon - Share app to invite friends!</div>'}
async function loadStatus(){$('content').style.display='block';$('chatArea').style.display='none';$('content').innerHTML='';let top=document.createElement('div');top.className='item';top.innerHTML=`<div class="av">${ME.avatar}</div><div style="flex:1"><input id="stText" placeholder="My status..."><button onclick="postStatus()" style="padding:8px;margin-top:6px;width:100%">Post Status</button></div>`;$('content').appendChild(top);try{let r=await fetch('/api/status');let list=await r.json();list.slice().reverse().forEach(s=>{let d=document.createElement('div');d.className='item';d.innerHTML=`<div class="av">${s.avatar}</div><div><b>${s.user}</b><br>${s.text}<br><small style="color:#8696a0">${s.time}</small></div>`;$('content').appendChild(d)})}catch{}}
window.postStatus=async()=>{let t=document.getElementById('stText');if(!t||!t.value.trim())return;await fetch('/api/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:ME.name,avatar:ME.avatar,text:t.value.trim()})});loadStatus()}
function openChat(dest,name){CURR=dest;$('chatWith').textContent=name;$('chatOnline').textContent=dest==='all'?`${Object.keys(ONLINE).length} online`: (ONLINE[dest]?'Online 🟢':'Offline');$('content').style.display='none';$('chatArea').style.display='flex';poll()}
window.closeChat=()=>{$('chatArea').style.display='none';$('content').style.display='block';loadChats()}
$('sendBtn').onclick=sendMsg;$('msgInput').onkeydown=e=>{if(e.key==='Enter')sendMsg()};$('msgInput').oninput=()=>{fetch('/api/typing',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:ME.name})})}
async function sendMsg(){let t=$('msgInput').value.trim();if(!t)return;$('msgInput').value='';await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:ME.name,avatar:ME.avatar,text:t,dest:CURR})});poll()}
async function poll(){if(!ME)return;try{let or=await fetch('/api/online');let ol=await or.json();ONLINE=ol.reduce((a,b)=>(a[b]=1,a),{});$('onlineCount').textContent=`${Object.keys(ONLINE).length} Online 🟢`;let tr=await fetch('/api/typing');let ta=await tr.json();let others=ta.filter(u=>u!==ME.name);$('typing').textContent=others.length?others.join(', ')+' typing...':'';let mr=await fetch('/api/messages');let all=await mr.json();let filtered=CURR==='all'?all.filter(m=>m.dest==='all'):all.filter(m=>(m.dest===CURR&&m.user===ME.name)||(m.dest===ME.name&&m.user===CURR));if($('chatArea').style.display!=='none'){let c=$('msgs');c.innerHTML='';if(filtered.length===0){c.innerHTML='<div style="text-align:center;color:#8696a0;padding:30px">No messages yet<br>Say Hi! 👋<br><br><button onclick="shareApp()" style="background:#25D366;color:#fff;padding:10px 20px;border-radius:20px;border:0">Share App to Friends 🔗</button></div>'}else{filtered.slice(-100).forEach(m=>{let d=document.createElement('div');d.className='msg '+(m.user===ME.name?'me':'other');d.innerHTML=`<small style="color:#00a884;font-size:11px">${m.user}</small><br>${m.text}<br><small style="opacity:.6;font-size:10px">${m.time}</small>`;c.appendChild(d)});c.scrollTop=c.scrollHeight}if($('content').style.display!=='none')loadChats()}}catch{}}
</script></body></html>
