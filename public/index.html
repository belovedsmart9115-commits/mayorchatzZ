<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MayorChatZ 👑</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#111b21;color:#e9edef;height:100vh;display:flex;flex-direction:column}
#auth{display:flex;flex:1;align-items:center;justify-content:center}
.card{background:#202c33;padding:24px;border-radius:12px;width:90%;max-width:340px}
.card h2{color:#00a884;text-align:center;margin-bottom:16px}
input{width:100%;padding:12px;margin:8px 0;border:none;border-radius:8px;background:#2a3942;color:#fff}
button{width:100%;padding:12px;margin-top:10px;border:none;border-radius:8px;background:#00a884;color:#111b21;font-weight:700;font-size:16px}
#app{display:none;flex:1;flex-direction:column;overflow:hidden}
.header{background:#202c33;padding:12px 16px;display:flex;justify-content:space-between}
.tabs{display:flex;background:#202c33}
.tab{flex:1;text-align:center;padding:14px 0;color:#8696a0;border-bottom:3px solid transparent}
.tab.active{color:#00a884;border-color:#00a884}
#content{flex:1;overflow-y:auto;background:#0b141a}
.item{padding:12px 16px;display:flex;gap:12px;border-bottom:1px solid #202c33;align-items:center}
.avatar{width:48px;height:48px;border-radius:50%;background:#00a884;display:flex;align-items:center;justify-content:center;font-size:24px}
.msg{max-width:75%;padding:8px 10px;border-radius:8px;margin:4px 16px}
.me{background:#005c4b;margin-left:auto}
.other{background:#202c33}
#chatArea{display:none;flex-direction:column;flex:1}
#msgs{flex:1;overflow-y:auto;padding:10px 0;display:flex;flex-direction:column}
.inputBar{display:flex;gap:8px;padding:8px;background:#202c33}
.inputBar input{flex:1;border-radius:20px}
.sendBtn{width:50px;background:#00a884;border-radius:50%}
</style>
</head>
<body>
<div id="auth"><div class="card">
<h2>MayorChatZ 👑</h2>
<input id="name" placeholder="Name e.g DE mayors">
<input id="phone" placeholder="Phone e.g 07088347232">
<input id="password" type="password" placeholder="Password">
<input id="av" placeholder="Avatar emoji e.g 👑">
<button onclick="doSignup()">Signup</button>
<button onclick="doLogin()" style="background:#2a3942;color:#fff">Login</button>
<p id="authMsg" style="text-align:center;margin-top:10px;color:#f15c6d"></p>
</div></div>
<div id="app">
<div class="header"><div><b id="myName">Mayor</b><br><small id="myPhone" style="color:#8696a0"></small></div><div onclick="location.reload()">Logout</div></div>
<div class="tabs">
<div class="tab active" onclick="switchTab('status',event)">Status</div>
<div class="tab" onclick="switchTab('chats',event)">Chats</div>
<div class="tab" onclick="switchTab('groups',event)">Groups</div>
</div>
<div id="content"></div><div id="typing" style="padding:0 16px;color:#00a884;font-size:12px;height:18px"></div>
<div id="chatArea">
<div style="padding:10px;background:#202c33;display:flex;gap:10px"><span onclick="closeChat()">⬅️</span><b id="chatWith">General</b></div>
<div id="msgs"></div>
<div class="inputBar"><input id="msgInput" placeholder="Type message" oninput="sendTyping()" onkeydown="if(event.key==='Enter')sendMsg()"><button class="sendBtn" onclick="sendMsg()">➤</button></div>
</div></div>
<script>
let ME=null,CURR='all',USERS=[];
async function doSignup(){
 let body={name:document.getElementById('name').value,phone:document.getElementById('phone').value,password:document.getElementById('password').value,avatar:document.getElementById('av').value||'👤'};
 if(!body.name||!body.phone||!body.password){authMsg.innerText='Fill all';return}
 let r=await fetch('/api/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let j=await r.json();
 if(j.error){authMsg.innerText=j.error==='exists'?'Phone exists, Login';return}
 authMsg.style.color='#00a884';authMsg.innerText='Signup ok! Now Login';
}
async function doLogin(){
 let body={phone:document.getElementById('phone').value,password:document.getElementById('password').value};
 let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let j=await r.json();
 if(j.error){authMsg.innerText='Wrong phone/pass';return}
 ME={name:j.name,avatar:j.avatar,phone:body.phone}; myName.innerText=j.name+' '+j.avatar; myPhone.innerText=body.phone;
 auth.style.display='none'; app.style.display='flex'; loadUsers(); loadStatus(); setInterval(poll,2000);
}
function switchTab(t,e){
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); e.target.classList.add('active');
 if(t==='status')loadStatus(); if(t==='chats')loadChats(); if(t==='groups')loadGroups();
}
async function loadUsers(){let r=await fetch('/api/users');USERS=await r.json();}
async function loadChats(){
 content.innerHTML=''; chatArea.style.display='none'; content.style.display='block';
 let div=document.createElement('div');div.className='item';div.innerHTML=`<div class="avatar">🌍</div><div><b>General Group</b></div>`;div.onclick=()=>openChat('all','General');content.appendChild(div);
 USERS.forEach(u=>{if(u.name===ME.name)return;let d=document.createElement('div');d.className='item';d.innerHTML=`<div class="avatar">${u.avatar}</div><div><b>${u.name}</b></div>`;d.onclick=()=>openChat(u.name,u.name);content.appendChild(d);});
}
async function loadGroups(){
 content.innerHTML=''; chatArea.style.display='none'; content.style.display='block';
 let r=await fetch('/api/groups');let g=await r.json();
 g.forEach(x=>{let d=document.createElement('div');d.className='item';d.innerHTML=`<div class="avatar">👥</div><div><b>${x.name}</b></div>`;d.onclick=()=>openChat(x.id,x.name);content.appendChild(d);});
}
async function loadStatus(){
 content.innerHTML=''; chatArea.style.display='none'; content.style.display='block';
 let top=document.createElement('div');top.className='item';top.innerHTML=`<div class="avatar">${ME.avatar}</div><div style="flex:1"><input id="stText" placeholder="My status"><button onclick="postStatus()" style="padding:6px;margin-top:4px">Post</button></div>`;content.appendChild(top);
 let r=await fetch('/api/status');let list=await r.json();
 list.reverse().forEach(s=>{let d=document.createElement('div');d.className='item';d.innerHTML=`<div class="avatar">${s.avatar}</div><div><b>${s.user}</b><br>${s.text}<br><small>${s.time} - ${s.views.length} views</small></div>`;d.onclick=()=>fetch('/api/status/'+s.id+'/view',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:ME.name})});content.appendChild(d);});
}
async function postStatus(){let t=document.getElementById('stText').value;if(!t)return;await fetch('/api/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:ME.name,avatar:ME.avatar,text:t})});loadStatus();}
function openChat(dest,name){CURR=dest;chatWith.innerText=name;content.style.display='none';chatArea.style.display='flex';msgs.innerHTML='';poll();}
function closeChat(){chatArea.style.display='none';content.style.display='block';loadChats();}
async function sendMsg(){let txt=msgInput.value.trim();if(!txt)return;msgInput.value='';await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:ME.name,avatar:ME.avatar,text:txt,dest:CURR})});poll();}
async function sendTyping(){await fetch('/api/typing',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:ME.name})});}
async function poll(){
 if(!ME)return;
 let tr=await fetch('/api/typing');let ta=await tr.json();let others=ta.filter(u=>u!==ME.name);typing.innerText=others.length?others.join(', ')+' typing...':'';
 let mr=await fetch('/api/messages');let all=await mr.json();
 let filtered=CURR==='all'?all.filter(m=>m.dest==='all'):all.filter(m=>(m.dest===CURR&&m.user===ME.name)||(m.dest===ME.name&&m.user===CURR));
 msgs.innerHTML='';filtered.slice(-100).forEach(m=>{let d=document.createElement('div');d.className='msg '+(m.user===ME.name?'me':'other');d.innerHTML=`<small style="color:#00a884">${m.user}</small><br>${m.text}<br><small style="opacity:.6;font-size:10px">${m.time}</small>`;msgs.appendChild(d);});msgs.scrollTop=msgs.scrollHeight;
}
</script>
</body>
</html>
