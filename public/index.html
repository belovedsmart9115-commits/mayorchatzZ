<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MayorchatzZ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#111;color:#fff}
header{background:#075E54;padding:15px;text-align:center;font-size:20px;font-weight:bold}
#auth{padding:20px}
input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none}
button{width:100%;padding:12px;background:#25D366;border:none;border-radius:8px;font-weight:bold;color:#000;margin-top:10px}
#chat{display:none;flex-direction:column;height:calc(100vh - 56px)}
#msgs{flex:1;overflow-y:auto;padding:15px;background:#0b141a}
.msg{margin:8px 0;padding:10px 15px;border-radius:10px;max-width:80%}
.me{background:#005c4b;margin-left:auto}
.other{background:#202c33}
#inputArea{display:flex;padding:10px;background:#202c33}
#inputArea input{flex:1;margin:0 8px 0 0}
a{color:#25D366}
</style>
</head>
<body>
<header>MayorchatzZ - WhatsApp Clone</header>

<div id="auth">
<h3 id="formTitle">Signup</h3>
<input id="name" placeholder="Your Name">
<input id="phone" placeholder="Phone Number">
<input id="pass" type="password" placeholder="Password">
<button onclick="doAuth()" id="authBtn">Signup</button>
<p style="margin-top:15px;text-align:center"><span id="toggleText">Already have account?</span> <a href="#" onclick="toggleForm()">Login</a></p>
</div>

<div id="chat">
<div id="msgs"></div>
<div id="inputArea">
<input id="msgInput" placeholder="Type a message...">
<button onclick="sendMsg()" style="width:80px">Send</button>
</div>
</div>

<script>
let isLogin=false;let currentUser=localStorage.getItem('mayorUser');
if(currentUser){document.getElementById('auth').style.display='none';document.getElementById('chat').style.display='flex';loadMsgs();}

function toggleForm(){isLogin=!isLogin;
document.getElementById('formTitle').innerText=isLogin?'Login':'Signup';
document.getElementById('authBtn').innerText=isLogin?'Login':'Signup';
document.getElementById('toggleText').innerText=isLogin?"Don't have account?":"Already have account?";
document.getElementById('name').style.display=isLogin?'none':'block';
}

async function doAuth(){
let name=document.getElementById('name').value;
let phone=document.getElementById('phone').value;
let password=document.getElementById('pass').value;
if(!phone||!password)return alert('Fill all');
let url=isLogin?'/api/login':'/api/signup';
let body=isLogin?{phone,password}:{name,phone,password};
let res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
let data=await res.json();
if(data.error)return alert(data.error);
localStorage.setItem('mayorUser',isLogin?data.name:name);
location.reload();
}

async function loadMsgs(){
let res=await fetch('/api/messages');
let msgs=await res.json();
let box=document.getElementById('msgs');box.innerHTML='';
msgs.forEach(m=>{
let d=document.createElement('div');
d.className='msg '+(m.user===currentUser?'me':'other');
d.innerHTML=`<b>${m.user}</b><br>${m.text}<br><small style="opacity:.6">${m.time}</small>`;
box.appendChild(d);
});
box.scrollTop=box.scrollHeight;
}
async function sendMsg(){
let text=document.getElementById('msgInput').value;
if(!text)return;
await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:currentUser,text})});
document.getElementById('msgInput').value='';
loadMsgs();
}
setInterval(()=>{if(currentUser)loadMsgs()},3000);
</script>
</body>
</html>
