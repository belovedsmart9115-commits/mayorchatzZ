<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>MayorChatZ</title></head><body style="background:#111;color:#fff;font-family:sans-serif"><script>let n=prompt("Enter your name:","DE mayors");if(!n)n="Guest";localStorage.setItem("mc_name",n);document.write('<h2>Welcome '+n+' 🔒</h2><div id="m" style="padding:10px"></div><div style="position:fixed;bottom:0;left:0;right:0;display:flex;padding:8px;background:#222"><input id="i" style="flex:1;padding:12px;border-radius:8px;border:none" placeholder="Type message..."><button onclick="s()" style="margin-left:6px;padding:12px;background:#25D366;border:none;border-radius:8px;font-weight:bold">Send</button></div>');function l(){fetch("/api/messages").then(r=>r.json()).then(d=>{document.getElementById("m").innerHTML=d.map(x=>"<div style=background:#2a2a2a;padding:8px;border-radius:8px;margin-bottom:6px><b>"+x.name+"</b>: "+(x.text||"")+"</div>").join("")});fetch("/api/online",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:localStorage.getItem("mc_name")})})}setInterval(l,2000);l();function s(){let t=document.getElementById("i").value;if(!t)return;document.getElementById("i").value="";fetch("/api/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:localStorage.getItem("mc_name"),text:t,type:"text",group:"General"})}).then(l)}</script></body></html>
