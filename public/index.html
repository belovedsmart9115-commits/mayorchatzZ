<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MayorchatZ</title><style>body{margin:0;font-family:Arial;background:#111;color:#fff;display:flex;flex-direction:column;height:100vh}#header{background:#075e54;padding:15px;font-weight:bold;font-size:18px}#chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}.msg{background:#202c33;padding:10px 14px;border-radius:8px;max-width:75%}.msg.me{background:#005c4b;align-self:flex-end}#inputArea{display:flex;padding:10px;background:#202c33;gap:10px}#msgInput{flex:1;padding:12px;border-radius:20px;border:none;outline:none}#sendBtn{background:#25d366;border:none;padding:10px 20px;border-radius:20px;color:#fff;font-weight:bold}#loginBox{padding:20px;text-align:center;margin-top:20px}a{color:#25d366}</style></head><body><div id="header">MayorchatZ - WhatsApp Clone</div><div id="loginBox"><p>You never login</p><a href="/signup.html">Go to Signup</a> | <a href="/login.html">Login</a></div><div id="chat"></div><div id="inputArea"><input id="msgInput" placeholder="Type message..."><button id="sendBtn" onclick="sendMsg()">Send</button></div><script>let currentUser=localStorage.getItem('mayor_user')||'Guest';const chatDiv=document.getElementById('chat');async function loadMsgs(){try{let r=await fetch('/api/messages');let msgs=await r.json();chatDiv.innerHTML='';msgs.forEach(m=>{let div=document.createElement('div');div.className='msg'+(m.user===currentUser?' me':'');div.innerHTML=`<b>${m.user}</b><br>${m.text}<br><small>${m.time}</small>`;chatDiv.appendChild(div);});chatDiv.scrollTop=chatDiv.scrollHeight;}catch(e){}}async function sendMsg(){let input=document.getElementById('msgInput');let text=input.value.trim();if(!text)return;await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:currentUser,text})});input.value='';loadMsgs();}if(localStorage.getItem('mayor_user')){document.getElementById('loginBox').style.display='none';}loadMsgs();setInterval(loadMsgs,3000);</script></body></html>
