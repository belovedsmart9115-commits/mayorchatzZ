<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MayorChatZ 👑</title>
<style>
body{background:#111b21;color:#fff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.box{background:#202c33;padding:24px;border-radius:16px;width:92%;max-width:360px}
h2{color:#00a884;text-align:center}
input{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:0;background:#2a3942;color:#fff;box-sizing:border-box}
button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:10px;font-weight:bold;font-size:16px}
#btnS{background:#00a884} #btnL{background:#2a3942;color:#fff}
#out{margin-top:12px;text-align:center;min-height:20px;color:#00a884}
</style>
</head>
<body>
<div class="box">
<h2>MayorChatZ 👑</h2>
<input id="n" placeholder="Name DE mayors">
<input id="p" placeholder="Phone 07088347232">
<input id="pw" type="password" placeholder="Password 1234">
<input id="a" placeholder="Avatar 👑">
<button id="btnS">Signup</button>
<button id="btnL">Login</button>
<div id="out"></div>
</div>
<script>
console.log("MayorChatZ loaded");
const out=document.getElementById('out');
document.getElementById('btnS').addEventListener('click', async ()=>{
 out.textContent="⏳ Signing...";
 let data={name:document.getElementById('n').value.trim(),phone:document.getElementById('p').value.trim(),password:document.getElementById('pw').value.trim(),avatar:document.getElementById('a').value.trim()||"👤"};
 if(!data.name||!data.phone||!data.password){out.textContent="❌ Fill name phone password";return}
 try{
  let res=await fetch("/api/signup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
  let j=await res.json();
  if(j.error){out.textContent=j.error==="exists"?"⚠️ Exists, tap Login":"❌ "+j.error;return}
  out.textContent="✅ Signup OK! Now tap Login";
 }catch(e){out.textContent="❌ "+e.message; alert(e.message)}
});
document.getElementById('btnL').addEventListener('click', async ()=>{
 out.textContent="⏳ Logging...";
 let data={phone:document.getElementById('p').value.trim(),password:document.getElementById('pw').value.trim()};
 try{
  let res=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
  let j=await res.json();
  if(j.error){out.textContent="❌ Wrong phone/pass";return}
  out.textContent="✅ Login OK "+j.name+" 👑";
  localStorage.setItem("mayor",JSON.stringify({name:j.name,avatar:j.avatar,phone:data.phone}));
  setTimeout(()=>{document.body.innerHTML="<h1 style='text-align:center;margin-top:50px;color:#00a884'>WELCOME "+j.name+" 👑<br><br>Signup & Login don WORK!<br><br>Chat UI next...</h1>"},800);
 }catch(e){out.textContent="❌ "+e.message}
});
</script>
</body>
</html>
